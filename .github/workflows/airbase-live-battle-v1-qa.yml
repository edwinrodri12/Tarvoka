name: TARVOKA Base Aerea playable native 3D QA
on:
  push:
    branches: [feat/airbase-playable-3d-v1-20261120]
    paths:
      - "scripts/ui/Airbase*.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "tests/test_airbase_live_battle_v1.gd"
      - ".github/workflows/airbase-live-battle-v1-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ui/Airbase*.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "tests/test_airbase_live_battle_v1.gd"
      - ".github/workflows/airbase-live-battle-v1-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-airbase:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot 4.3 and Mesa
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/airbase-godot.zip
          unzip -oq /tmp/airbase-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          command -v xvfb-run
      - name: Parse actual game scripts (exclude isolated Web-only adapters)
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ui/BastionStudioAdapter.gd scripts/ui/ArmoredWorkshopStudioAdapterV1.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/airbase-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/airbase-import.log; then exit 1; fi
      - name: Verify actual airbases, all art variants and fog
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 75s \
            xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_airbase_live_battle_v1.gd \
            2>&1 | tee /tmp/airbase-live.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/airbase-live.log; then exit 1; fi
          grep -F 'PASS AIRBASE REAL BATTLE V1:' /tmp/airbase-live.log
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbase-playable-v1-native-mesa
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/airbase-import.log
            /tmp/airbase-live.log
