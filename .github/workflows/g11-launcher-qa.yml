      - 'scripts/ui/G11MechanicalDetailV14.gd'
      - 'scripts/ui/G11AftPodFinishV15.gd'
      - 'scripts/ui/G11FrontFrameV16.gd'
      - 'scripts/ui/G11SurfaceWeatherV17.gd'
      - 'scripts/ui/G11TrackAssemblyV18.gd'
      - 'scripts/ui/G11TrackFinishV19.gd'
      - 'scripts/ui/G11WheelSuspensionV20.gd'
      - 'scripts/ui/G11ShockMountFinishV21.gd'
      - 'tests/test_g11_shock_mount_finish_v21.gd'
      - 'tests/test_g11_shock_mount_finish_v21_capture.gd'
      - 'tests/test_g11_wheel_suspension_v20.gd'
