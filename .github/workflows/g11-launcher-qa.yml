      - 'tests/test_g11_mobile_lod.gd'
      - 'tests/benchmark_g11_mobile_stress.gd'
      - 'scripts/ui/G11AndroidPerfLab.gd'
      - 'scenes/G11AndroidStressLab.tscn'
      - 'tests/test_g11_android_lab.gd'
      - 'tests/test_g11_360_gpu_v3.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_g11_launcher_3d.gd'
      - '.github/workflows/g11-launcher-qa.yml'
  pull_request:
  workflow_dispatch:

jobs:
  launcher-native-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate native 3D launcher and all faction states
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_launcher_3d.gd 2>&1 | tee /tmp/g11_3d_qa.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_3d_qa.log; then
            echo 'G11 native sculpt or animation regression'; exit 1
          fi
          grep -F 'PASS G11 3D:' /tmp/g11_3d_qa.log
      - name: Validate G11 V14 articulated hoses and maintenance surfaces
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_mechanical_detail_v14.gd 2>&1 | tee /tmp/g11_v14.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v14.log; then
            echo 'G11 V14 native 3D regression'; exit 1
          fi
          grep -F 'PASS G11 V14:' /tmp/g11_v14.log
      - name: Validate G11 V15 real sculpted rear armor and service details
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_aft_pod_finish_v15.gd 2>&1 | tee /tmp/g11_v15.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v15.log; then
            echo 'G11 V15 native geometry regression'; exit 1
          fi
          grep -F 'PASS G11 V15:' /tmp/g11_v15.log
      - name: Validate G11 V16 structural frame, 12 open tubes and roof details
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
