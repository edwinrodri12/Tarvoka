      - 'tests/test_g11_track_finish_v19_capture.gd'
      - 'tests/test_g11_track_clearance_v18.gd'
      - 'tests/test_g11_track_clearance_v18_capture.gd'
      - 'tests/test_g11_surface_weather_v17.gd'
      - 'tests/test_g11_surface_weather_v17_capture.gd'
      - 'tests/test_g11_front_frame_v16.gd'
      - 'tests/test_g11_front_frame_v16_capture.gd'
      - 'tests/test_g11_aft_pod_finish_v15.gd'
      - 'tests/test_g11_aft_pod_finish_v15_capture.gd'
      - 'tests/test_g11_mechanical_detail_v14.gd'
      - 'tests/test_g11_tracks_faction_v13.gd'
      - 'tests/test_g11_tracks_faction_v13_capture.gd'
      - 'tests/test_g11_cab_chassis_v12.gd'
      - 'tests/test_g11_cab_chassis_v12_capture.gd'
      - 'tests/test_g11_armor_finish_v11.gd'
      - 'tests/test_g11_armor_finish_v11_capture.gd'
      - 'tests/test_g11_cooldown_v10.gd'
      - 'tests/test_g11_cooldown_v10_capture.gd'
      - 'tests/test_g11_exhaust_v9.gd'
      - 'tests/test_g11_exhaust_v9_capture.gd'
      - 'tests/test_g11_salvo_v8.gd'
      - 'tests/test_g11_salvo_v8_capture.gd'
      - 'tests/test_g11_360_gpu_v7.gd'
      - 'tests/test_g11_360_gpu_v6.gd'
      - 'tests/test_g11_360_gpu_v5.gd'
      - 'tests/test_g11_360_gpu_v4.gd'
