          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_android_lab.log; then
            echo 'G11 on-device benchmark scene failed'; exit 1
          fi
          grep -F 'PASS G11 ANDROID LAB:' /tmp/g11_android_lab.log
      - name: Verify each G11 V8 rocket and muzzle fires independently
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
