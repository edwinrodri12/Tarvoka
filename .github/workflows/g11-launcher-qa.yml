          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_tracks_v13.log; then
            echo 'G11 V13 gear alignment or faction roof failed'; exit 1
          fi
          grep -F 'PASS G11 TRACK FACTION V13:' /tmp/g11_tracks_v13.log
      - name: Render G11 V13 corrected gears and faction roofs from 20 actual Godot camera positions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g11-360
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G11_CAPTURE_DIR=/tmp/g11-360 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_tracks_faction_v13_capture.gd 2>&1 | tee /tmp/g11_tracks_v13_capture.log
