name: TARVOKA G11 native launcher sculpt QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/G11Art3D.gd'
      - 'scripts/ui/G11VisualRig3D.gd'
      - 'scripts/ui/G11FinishV2.gd'
      - 'scripts/ui/G11SurfaceV3.gd'
      - 'scripts/ui/G11GeometryV4.gd'
      - 'scripts/ui/G11MechanicsV5.gd'
      - 'scripts/ui/G11DamageSculptV6.gd'
      - 'scripts/ui/G11DamageAtmosphereV7.gd'
      - 'scripts/ui/G11SequentialSalvoV8.gd'
      - 'scripts/ui/G11ExhaustV9.gd'
      - 'scripts/ui/G11CooldownV10.gd'
      - 'scripts/ui/G11ArmorFinishV11.gd'
      - 'scripts/ui/G11CabChassisV12.gd'
      - 'scripts/ui/G11TracksFactionV13.gd'
      - 'tests/test_g11_tracks_faction_v13.gd'
      - 'tests/test_g11_tracks_faction_v13_capture.gd'
      - 'tests/test_g11_cab_chassis_v12.gd'
      - 'tests/test_g11_cab_chassis_v12_capture.gd'
      - 'tests/test_g11_armor_finish_v11.gd'
      - 'tests/test_g11_armor_finish_v11_capture.gd'
      - 'tests/test_g11_cooldown_v10.gd'
      - 'tests/test_g11_cooldown_v10_capture.gd'
      - 'tests/test_g11_exhaust_v9.gd'
      - 'tests/test_g11_exhaust_v9_capture.gd'
      - 'tests/test_g11_salvo_v8.gd'
      - 'tests/test_g11_salvo_v8_capture.gd'
      - 'tests/test_g11_360_gpu_v7.gd'
      - 'tests/test_g11_360_gpu_v6.gd'
      - 'tests/test_g11_360_gpu_v5.gd'
      - 'tests/test_g11_360_gpu_v4.gd'
      - 'scripts/ui/G11MobileLOD.gd'
      - 'tests/test_g11_mobile_lod.gd'
      - 'tests/benchmark_g11_mobile_stress.gd'
      - 'scripts/ui/G11AndroidPerfLab.gd'
      - 'scenes/G11AndroidStressLab.tscn'
      - 'tests/test_g11_android_lab.gd'
      - 'tests/test_g11_360_gpu_v3.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_g11_launcher_3d.gd'
      - '.github/workflows/g11-launcher-qa.yml'
  pull_request:
  workflow_dispatch:

jobs:
  launcher-native-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate native 3D launcher and all faction states
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_launcher_3d.gd 2>&1 | tee /tmp/g11_3d_qa.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_3d_qa.log; then
            echo 'G11 native sculpt or animation regression'; exit 1
          fi
          grep -F 'PASS G11 3D:' /tmp/g11_3d_qa.log
      - name: Assert G11 two-tier mobile LOD and faction animation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_mobile_lod.gd 2>&1 | tee /tmp/g11_mobile_qa.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_mobile_qa.log; then
            echo 'G11 mobile LOD regression'; exit 1
          fi
          grep -F 'PASS G11 MOBILE LOD:' /tmp/g11_mobile_qa.log
      - name: Smoke test touch-friendly native Android benchmark scene
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 110s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_android_lab.gd 2>&1 | tee /tmp/g11_android_lab.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_android_lab.log; then
            echo 'G11 on-device benchmark scene failed'; exit 1
          fi
          grep -F 'PASS G11 ANDROID LAB:' /tmp/g11_android_lab.log
      - name: Verify each G11 V8 rocket and muzzle fires independently
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_salvo_v8.gd 2>&1 | tee /tmp/g11_v8_salvo.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v8_salvo.log; then
            echo 'G11 12-tube rocket animation regression'; exit 1
          fi
          grep -F 'PASS G11 SALVO V8:' /tmp/g11_v8_salvo.log
      - name: Test G11 V9 rocket engine contrails and gas dissipation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_exhaust_v9.gd 2>&1 | tee /tmp/g11_v9_exhaust.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v9_exhaust.log; then
            echo 'G11 procedural exhaust integration failed'; exit 1
          fi
          grep -F 'PASS G11 EXHAUST V9:' /tmp/g11_v9_exhaust.log
      - name: Verify G11 V10 post-salvo cool rims and smooth hydraulic home position
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_cooldown_v10.gd 2>&1 | tee /tmp/g11_cooldown_v10.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_cooldown_v10.log; then
            echo 'G11 V10 cooldown or restoration regression'; exit 1
          fi
          grep -F 'PASS G11 COOLDOWN V10:' /tmp/g11_cooldown_v10.log
      - name: Verify true beveled G11 V11 metals and structural frame in all 8 factions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_armor_finish_v11.gd 2>&1 | tee /tmp/g11_armor_v11.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_armor_v11.log; then
            echo 'G11 V11 beveled frame and metallic barrel test failed'; exit 1
          fi
          grep -F 'PASS G11 ARMOR V11:' /tmp/g11_armor_v11.log
      - name: Verify G11 V12 actual cabin glazing, mirrors and chassis service fittings
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_cab_chassis_v12.gd 2>&1 | tee /tmp/g11_cab_v12.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_cab_v12.log; then
            echo 'G11 V12 cab/chassis geometry test failed'; exit 1
          fi
          grep -F 'PASS G11 CAB CHASSIS V12:' /tmp/g11_cab_v12.log
      - name: Validate corrected G11 V13 sprocket pitch, full roof paint and 8 factions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_tracks_faction_v13.gd 2>&1 | tee /tmp/g11_tracks_v13.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_tracks_v13.log; then
            echo 'G11 V13 gear alignment or faction roof failed'; exit 1
          fi
          grep -F 'PASS G11 TRACK FACTION V13:' /tmp/g11_tracks_v13.log
      - name: Render G11 V13 corrected gears and faction roofs from 20 actual Godot camera positions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g11-360
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G11_CAPTURE_DIR=/tmp/g11-360 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_tracks_faction_v13_capture.gd 2>&1 | tee /tmp/g11_tracks_v13_capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_tracks_v13_capture.log; then
            echo 'G11 eight-angle GPU capture failed'; exit 1
          fi
          grep -F 'PASS G11 TRACK FACTION V13 CAPTURE:' /tmp/g11_tracks_v13_capture.log
          test "$(find /tmp/g11-360 -name '*.png' | wc -l)" -eq 20
      - name: Upload G11 V13 physically aligned gears, colored pod roofs and synchronized track inspection gallery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-g11-v13-corrected-gears-faction-roofs-20-real-godot
          path: /tmp/g11-360/*.png
          retention-days: 14
      # Heavy mobile/GL measurements are intentionally deferred until art is approved.
      # They remain available through manual workflow_dispatch, not sculpt commits.
      - name: Quantitative G11 8/32/64 native stress benchmark
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G11_BENCH_OUTPUT=/tmp/g11-mobile-benchmark.json \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/benchmark_g11_mobile_stress.gd 2>&1 | tee /tmp/g11_mobile_bench.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_mobile_bench.log; then
            echo 'G11 mobile stress failed'; exit 1
          fi
          grep -F 'PASS G11 STRESS:' /tmp/g11_mobile_bench.log
          python3 -c 'import json; d=json.load(open("/tmp/g11-mobile-benchmark.json")); assert len(d["cases"]) == 7'
      - name: Upload machine-readable G11 performance report
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-g11-mobile-gl-stress
          path: /tmp/g11-mobile-benchmark.json
          retention-days: 14
