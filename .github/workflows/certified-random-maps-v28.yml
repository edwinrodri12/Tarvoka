name: TARVOKA v28 certified random map contract

on:
  pull_request:
    paths:
      - "scripts/experiments/CertifiedRandomMapsV28.gd"
      - "tests/test_certified_random_maps_v28.gd"
      - ".github/workflows/certified-random-maps-v28.yml"
  workflow_dispatch:

jobs:
  certified_random_maps:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Certify seed/size/terrain/facilities/connectivity and preserve saves
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 420s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_certified_random_maps_v28.gd \
            2>&1 | tee /tmp/v28-map-validation.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v28-map-validation.log; then exit 1; fi
          grep -Fq 'PASS v28 map certification:' /tmp/v28-map-validation.log
      - name: Preserve map acceptance and rejections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-v28-map-certification
          path: /tmp/v28-map-validation.log
          retention-days: 30
          if-no-files-found: ignore
