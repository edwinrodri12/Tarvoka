name: TARVOKA v391 opt-in relay tie pressure

on:
  pull_request:
    paths:
      - "scripts/core/BasicAI.gd"
      - "tests/test_ai_opening_budget_counterfactual_v383.gd"
      - "tests/test_ai_relay_tie_pressure_v391.gd"
      - "tests/aggregate_ai_relay_tie_pressure_v391.py"
      - ".github/workflows/ai-relay-tie-pressure-v391.yml"
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    env:
      TARVOKA_V391_MICRO_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate enemy relay visibility, tie eligibility and guard protections
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 150s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_relay_tie_pressure_v391.gd \
            2>&1 | tee /tmp/tie-micro-v391.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tie-micro-v391.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v391 micro:' /tmp/tie-micro-v391.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v391-micro
          path: /tmp/tie-micro-v391.log
          if-no-files-found: ignore
          retention-days: 30

  paired:
    needs: [micro]
    runs-on: ubuntu-22.04
    timeout-minutes: 52
    strategy:
      fail-fast: false
      matrix:
        first: [0,1]
    env:
      TARVOKA_V391_FIRST: ${{ matrix.first }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compare default and opt-in full matches with exact mirrored action/state
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3000s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_relay_tie_pressure_v391.gd \
            2>&1 | tee /tmp/tie-v391.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:|TIE391_DIVERGENCE' /tmp/tie-v391.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v391: fog-safe opt-in relay tie pressure' /tmp/tie-v391.log
          test "$(grep -c '^TIE391_RESULT ' /tmp/tie-v391.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v391-first${{ matrix.first }}
          path: /tmp/tie-v391.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [paired]
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v391-first*
          path: .ci-v391
          merge-multiple: false
      - name: Validate both conditions and report observed differences
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_relay_tie_pressure_v391.py .ci-v391
          cat reports/ai_v391_relay_tie_pressure.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v391-relay-urgency-report
          path: reports/ai_v391_relay_tie_pressure.*
          if-no-files-found: ignore
          retention-days: 30
