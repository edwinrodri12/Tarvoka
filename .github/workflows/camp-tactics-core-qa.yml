name: TARVOKA tactical camps core and legacy regression
on:
  push:
    branches: [main, feat/campamentos-tacticos-core-v1-20261124]
    paths:
      - 'scripts/core/**'
      - 'tests/test_camp_tactics_core.gd'
      - '.github/workflows/camp-tactics-core-qa.yml'
  pull_request:
    paths:
      - 'scripts/core/**'
      - 'tests/test_camp_tactics_core.gd'
      - '.github/workflows/camp-tactics-core-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tactical-camps:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Native deterministic camp rules and legacy checks
        run: |
          set -euo pipefail
          for test in camp_tactics_core battle_session save_codec logistics rules; do
            timeout 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script "res://tests/test_${test}.gd" 2>&1 | tee "/tmp/tarvoka-${test}.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' "/tmp/tarvoka-${test}.log"; then exit 1; fi
            grep -F 'PASS ' "/tmp/tarvoka-${test}.log"
          done
      - name: Archive native checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-tactical-core-godot-qa
          path: /tmp/tarvoka-*.log
          if-no-files-found: warn
