name: TARVOKA G11 V32 track and suspension motion native QA

on:
  push:
    branches: [main, feat/g11-v32-track-wheel-suspension-dynamics]
    paths:
      - 'scripts/ui/G11RunningGearV32.gd'
      - 'scripts/ui/G11MobileLOD.gd'
      - 'scripts/ui/G11VisualRig3D.gd'
      - 'scripts/ui/G11BattleActionsV29.gd'
      - 'tests/test_g11_running_gear_v32.gd'
      - 'tests/test_g11_running_gear_v32_capture.gd'
      - '.github/workflows/g11-v32-gear-qa.yml'
  pull_request:
    paths:
      - 'scripts/ui/G11RunningGearV32.gd'
      - 'scripts/ui/G11MobileLOD.gd'
      - 'scripts/ui/G11VisualRig3D.gd'
      - 'scripts/ui/G11BattleActionsV29.gd'
      - 'tests/test_g11_running_gear_v32.gd'
      - 'tests/test_g11_running_gear_v32_capture.gd'
  workflow_dispatch:

jobs:
  g11-v32-motion-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify original 92 treads, twelve mobile wheels and real slope/turn motion
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 205s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_running_gear_v32.gd 2>&1 | tee /tmp/g11_v32.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v32.log; then
            echo 'G11 V32 real wheel/chain/suspension clearance failed'; exit 1
          fi
          grep -F 'PASS G11 V32:' /tmp/g11_v32.log
      - name: Render 20 actual Godot images of hero wheels and live four-biome turns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g11-v32-gear
          timeout --signal=TERM --kill-after=5s 205s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G11_V32_CAPTURE_DIR=/tmp/g11-v32-gear \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_running_gear_v32_capture.gd 2>&1 | tee /tmp/g11_v32_capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_v32_capture.log; then
            echo 'G11 V32 real tire/chain 3D screenshot failed'; exit 1
          fi
          grep -F 'PASS G11 V32 CAPTURE:' /tmp/g11_v32_capture.log
          test "$(find /tmp/g11-v32-gear -name '*.png' | wc -l)" -eq 20
      - name: Upload authentic G11 V32 wheel, track and slope comparison frames
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-g11-v32-20-wheel-track-suspension-turn-slope-frames
          path: /tmp/g11-v32-gear/*.png
          retention-days: 14
