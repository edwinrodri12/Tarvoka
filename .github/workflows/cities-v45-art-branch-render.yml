name: TARVOKA V45 - Render de ciudades en rama de arte

on:
  push:
    branches:
      - art/cities-v8-rear-facades-rooftops-20261117
    paths:
      - ".github/workflows/cities-v45-art-branch-render.yml"
      - "scripts/ui/CivilianCity*.gd"
      - "scenes/CivilianCityDesignStudioV43.tscn"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarvoka-city-v45-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-proof:
    name: Compilar Godot y revisar 24 tomas
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Obtener exactamente el commit de arte
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Godot 4.3 y Mesa GL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libglu1-mesa
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot-v45.zip
          unzip -qo /tmp/godot-v45.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          mkdir -p build/city-v44-evidence
          test -s scripts/ui/CivilianCityVisualProofV44.gd
          test -s scripts/ui/CivilianCityArtEvidenceV43.gd
          test -s scenes/CivilianCityDesignStudioV43.tscn
          echo "Source SHA: $GITHUB_SHA" | tee build/city-v44-evidence/source-commit.txt

      - name: Importar y validar recursos Godot
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit \
            2>&1 | tee build/city-v44-evidence/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed loading resource:' \
              build/city-v44-evidence/godot-import.log; then
            exit 1
          fi

      - name: Renderizar 24 vistas nativas con pantalla OpenGL real
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-method gl_compatibility \
            --script res://scripts/ui/CivilianCityVisualProofV44.gd \
            2>&1 | tee build/city-v44-evidence/godot-render.log
          count=$(find build/city-v44-evidence -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Capturas de Godot: $count/24"
          test "$count" -eq 24
          test -s build/city-v44-evidence/manifest.json
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed loading resource:' \
              build/city-v44-evidence/godot-render.log; then
            exit 1
          fi

      - name: Generar índice de imágenes y diagnóstico, incluso tras fallos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html,json
          folder=Path('build/city-v44-evidence')
          folder.mkdir(parents=True,exist_ok=True)
          metadata={}
          try:
              metadata=json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
          except (OSError,ValueError):
              pass
          entries={x.get('png'):x for x in metadata.get('screenshots',[]) if isinstance(x,dict)}
          cards=[]
          for tier in ('Villa','Ciudad','Metropoli'):
              for damage in range(5):
                  for suffix in (('',) if damage not in (0,2,4) else ('','_reverse')):
                      fname=f'{tier}_D{damage}{suffix}.png'
                      item=entries.get(fname,{})
                      image=(f'<img src="{fname}" alt="{fname}">' if (folder/fname).is_file()
                             else '<p>Imagen no generada: revisar registros</p>')
                      detail=html.escape('; '.join(filter(None,[
                          str(item.get('geometry_messages','')),
                          str(item.get('art_messages',''))])))
                      cards.append(f'<article><h2>{fname}</h2>{image}'
                                   f'<p>Imagen no vacía: {item.get("nonempty","sin datos")}</p>'
                                   f'<p>{detail}</p></article>')
          index=('<html lang="es"><meta charset="utf-8">'
                 '<meta name="viewport" content="width=device-width,initial-scale=1">'
                 '<title>TARVOKA V45 · Evidencia 3D</title>'
                 '<style>body{background:#101e26;color:#eee;font:14px system-ui;padding:18px}'
                 'main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}'
                 'article{background:#233743;padding:12px;border-radius:8px}'
                 'img{width:100%;height:auto;border-radius:4px}</style>'
                 '<h1>TARVOKA · 24 perspectivas Godot</h1>'
                 '<p>Inspección artística pendiente. Esto no supone aprobación del modelo.</p>'
                 '<main>'+''.join(cards)+'</main></html>')
          (folder/'index.html').write_text(index,encoding='utf-8')
          PY

      - name: Montar comparativas 3D con las capturas reales disponibles
        if: always()
        shell: bash
        run: |
          python3 -m pip install -q --disable-pip-version-check Pillow || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("build/city-v44-evidence")
          root.mkdir(parents=True,exist_ok=True)
          try:
              from PIL import Image, ImageDraw
          except ImportError:
              (root/"contact-sheet-status.txt").write_text(
                  "Pillow unavailable: individual PNG files and index.html remain available",
                  encoding="utf-8")
              raise SystemExit(0)
          entries=[]
          for tier in ("Villa","Ciudad","Metropoli"):
              for damage in range(5):
                  for suffix in (("",) if damage not in (0,2,4) else ("","_reverse")):
                      entries.append((tier,damage,suffix))
          # Contact sheet is an arrangement of genuine engine screenshots,
          # never an illustration or a synthetic model preview.
          cell_w,cell_h=390,250
          sheet=Image.new("RGB",(cell_w*4,cell_h*6),(18,30,40))
          draw=ImageDraw.Draw(sheet)
          for i,(tier,damage,suffix) in enumerate(entries):
              x=(i%4)*cell_w
              y=(i//4)*cell_h
              filename=f"{tier}_D{damage}{suffix}.png"
              draw.text((x+10,y+5),f"{tier} | D{damage} | {'POSTERIOR' if suffix else 'PRINCIPAL'}",
                        fill=(245,220,163))
              path=root/filename
              if not path.exists():
                  draw.text((x+14,y+70),"SIN CAPTURA - REVISAR LOGS",fill=(239,140,122))
                  continue
              try:
                  with Image.open(path) as frame:
                      frame=frame.convert("RGB")
                      frame.thumbnail((cell_w-18,cell_h-40))
                      sheet.paste(frame,(x+(cell_w-frame.width)//2,y+25))
              except (OSError,ValueError):
                  draw.text((x+14,y+70),"PNG INVALIDO",fill=(239,140,122))
          sheet.save(root/"comparativa-24-vistas.png")
          # Three level-specific sheets, easier to inspect at full size.
          for tindex,tier in enumerate(("Villa","Ciudad","Metropoli")):
              out=Image.new("RGB",(cell_w*3,cell_h*3),(18,30,40))
              d=ImageDraw.Draw(out)
              group=[(dd,ss) for name,dd,ss in entries if name==tier]
              for k,(damage,suffix) in enumerate(group):
                  x=(k%3)*cell_w
                  y=(k//3)*cell_h
                  d.text((x+10,y+5),f"{tier} D{damage} {'POSTERIOR' if suffix else 'PRINCIPAL'}",
                         fill=(245,220,163))
                  pic=root/f"{tier}_D{damage}{suffix}.png"
                  if pic.is_file():
                      try:
                          with Image.open(pic) as frame:
                              frame=frame.convert("RGB")
                              frame.thumbnail((cell_w-18,cell_h-40))
                              out.paste(frame,(x+(cell_w-frame.width)//2,y+25))
                      except (OSError,ValueError):
                          d.text((x+14,y+70),"PNG INVALIDO",fill=(239,140,122))
                  else:
                      d.text((x+14,y+70),"SIN CAPTURA",fill=(239,140,122))
              out.save(root/f"comparativa-{tier.lower()}.png")
          print("V47: montage created from actual Godot images; no artificial rendering")
          PY

      - name: Mostrar resumen de las 24 vistas y su encuadre
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          folder=Path('build/city-v44-evidence')
          screenshots=list(folder.glob('*.png'))
          print('## TARVOKA V45 — Arte de ciudades')
          print('')
          import os
          print(f'Commit: `{os.environ.get("GITHUB_SHA","desconocido")}`')
          print(f'Capturas encontradas: **{len(screenshots)}/24**.')
          try:
              data=json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
              print(f'Avisos detectados: **{data.get("errors","?")}**.')
              framing=[p for p in data.get('screenshots',[]) if p.get('framing_warning')]
              print(f'Perspectivas con posible problema de encuadre: **{len(framing)}**.')
              for shot in framing:
                  print(f'- {shot.get("tier","?")} D{shot.get("damage","?")} '
                        f'({shot.get("camera","?")}): contenido central '
                        f'{float(shot.get("center_coverage",0)):.1%}')
          except (OSError,ValueError):
              print('Manifest no disponible: revisar godot-import.log y godot-render.log.')
          print('La aprobación artística final continúa pendiente de inspección humana.')
          PY

      - name: Conservar artefactos y registros, aunque falle la compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-v45-capturas-ciudades
          path: build/city-v44-evidence/
          if-no-files-found: warn
          retention-days: 14
