name: TARVOKA Infantry V1 Native 3D QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/InfantrySculptFinishV2.gd'
      - 'scripts/ui/InfantryVariantsV4.gd'
      - 'tests/test_infantry_family_v2.gd'
      - 'scripts/ui/BattleTerrain3D.gd'
      - 'tests/test_guardia_v15_live_battle.gd'
      - 'scripts/ui/GuardiaBattleActionsV16.gd'
      - 'scripts/ui/Battle3DMapView.gd'
      - 'tests/test_immersive_battle_3d_hud.gd'
      - 'scripts/ui/InfantryEngineerOuterArmorV17.gd'
      - 'tests/test_engineer_v17_outer_armor.gd'
      - '.github/workflows/infantry-family-native-3d-qa.yml'
  pull_request:
    paths:
      - 'scripts/ui/InfantryFamilyV1.gd'
      - 'scripts/ui/InfantrySculptFinishV2.gd'
      - 'scripts/ui/InfantryVariantsV4.gd'
      - 'scripts/ui/InfantryEngineerSilhouetteV5.gd'
      - 'scripts/ui/InfantryEngineerFinishV6.gd'
      - 'scripts/ui/InfantryEngineerCompletenessV7.gd'
      - 'scripts/ui/InfantryEngineerPremiumV8.gd'
      - 'scripts/ui/InfantryEngineerFinishV9.gd'
      - 'scripts/ui/InfantryEngineerAnatomyV10.gd'
      - 'scripts/ui/InfantryEngineerMechanicsV11.gd'
      - 'scripts/ui/InfantryEngineerDorsalV12.gd'
      - 'scripts/ui/InfantryEngineerSmoothV13.gd'
      - 'scripts/ui/InfantryEngineerContourV14.gd'
      - 'scripts/ui/InfantryEngineerGearV15.gd'
      - 'scripts/ui/InfantryEngineerSilhouetteV16.gd'
      - 'scripts/ui/InfantryEngineerOuterArmorV17.gd'
      - 'tests/test_infantry_engineer_v12_finish.gd'
      - 'tests/test_engineer_v123_opaque_closure.gd'
      - 'tests/test_engineer_v13_smooth_finish.gd'
      - 'tests/test_engineer_v14_anatomic_finish.gd'
      - 'tests/test_engineer_v15_rounded_gear.gd'
      - 'tests/test_engineer_v16_silhouette.gd'
      - 'tests/test_engineer_v17_outer_armor.gd'
      - 'scripts/ui/InfantryCampRosterV1.gd'
      - 'tests/test_infantry_camp_roster.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_infantry_family_v1.gd'
      - 'tests/test_infantry_family_v2.gd'
      - 'scripts/ui/BattleTerrain3D.gd'
      - 'tests/test_guardia_v15_live_battle.gd'
      - 'scripts/ui/GuardiaBattleActionsV16.gd'
      - 'scripts/ui/Battle3DMapView.gd'
      - 'tests/test_immersive_battle_3d_hud.gd'
      - 'tests/test_infantry_engineer_v6_360.gd'
      - '.github/workflows/infantry-family-native-3d-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infantry-native-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and headless renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri unzip
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Inspect native integration without changing tactical arsenal
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/ui/InfantryFamilyV1.gd
          test -s scripts/ui/InfantrySculptFinishV2.gd
          test -s scripts/ui/InfantryVariantsV4.gd
          test -s scripts/ui/InfantryEngineerSilhouetteV5.gd
          test -s scripts/ui/InfantryEngineerFinishV6.gd
          test -s scripts/ui/InfantryEngineerCompletenessV7.gd
          test -s scripts/ui/InfantryEngineerPremiumV8.gd
          test -s scripts/ui/InfantryEngineerFinishV9.gd
          test -s scripts/ui/InfantryEngineerAnatomyV10.gd
          test -s scripts/ui/InfantryEngineerMechanicsV11.gd
          test -s scripts/ui/InfantryEngineerDorsalV12.gd
          test -s scripts/ui/InfantryEngineerSmoothV13.gd
          test -s scripts/ui/InfantryEngineerContourV14.gd
          test -s scripts/ui/InfantryEngineerGearV15.gd
          test -s scripts/ui/InfantryEngineerSilhouetteV16.gd
          test -s scripts/ui/InfantryEngineerOuterArmorV17.gd
          test -s tests/test_engineer_v17_outer_armor.gd
          test -s tests/test_engineer_v16_silhouette.gd
          test -s tests/test_engineer_v15_rounded_gear.gd
          test -s tests/test_engineer_v14_anatomic_finish.gd
          test -s tests/test_engineer_v13_smooth_finish.gd
          test -s tests/test_infantry_engineer_v12_finish.gd
          test -s tests/test_engineer_v123_opaque_closure.gd
          test -s tests/test_infantry_engineer_v6_360.gd
          test -s scripts/ui/InfantryCampRosterV1.gd
          test -s tests/test_infantry_family_v2.gd
          test -s tests/test_infantry_family_v1.gd
          grep -Fq 'InfantryFamily.build' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV5.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV6.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV7.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV8.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV9.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV9.sync' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV10.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV11.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV12.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV13.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV14.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV15.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV16.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV17.apply' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryEngineerV6.pose' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryFamily.pose' scripts/ui/UnitModels3D.gd
          grep -Fq 'InfantryV1.supports' scripts/ui/BastionStudioAdapter.gd
          grep -Fq 'InfantryFamilyV1.gd' .github/workflows/tarvoka-3d-pages.yml
          git diff --exit-code HEAD -- scripts/core/ModernArsenal.gd
      - name: Import Godot 4.3; exclude publish-only Studio subclass
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f scripts/ui/CombinedArtStudioWeb.gd && test -f scripts/ui/BastionStudioAdapter.gd; then
            mkdir -p /tmp/infantry-published-studio
            mv scripts/ui/BastionStudioAdapter.gd /tmp/infantry-published-studio/
          fi
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/infantry-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Import failed' /tmp/infantry-import.log; then exit 1; fi
      - name: Verify six agreed infantry roles and four exclusive camp links
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_camp_roster.gd 2>&1 | tee /tmp/infantry-core-six.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' /tmp/infantry-core-six.log; then exit 1; fi
          grep -Fq 'PASS INFANTRY CORE SIX:' /tmp/infantry-core-six.log
      - name: Test 160 native sculpt combinations; capture 17 genuine Godot V1 PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/infantry-v1
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_family_v1.gd 2>&1 | tee /tmp/infantry-native.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/infantry-native.log; then exit 1; fi
          grep -Fq 'PASS INFANTRY V1 NATIVE 3D:' /tmp/infantry-native.log
          test "$(find build/qa/infantry-v1 -name '*.png' | wc -l)" -eq 17
      - name: Verify 6 approved core designs + archived art, 8 facciones and 140 native renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/infantry-v2
          timeout --signal=TERM --kill-after=5s 270s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_family_v2.gd 2>&1 | tee /tmp/infantry-v2-native.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/infantry-v2-native.log; then exit 1; fi
          grep -Fq 'PASS INFANTRY V2 NATIVE 3D:' /tmp/infantry-v2-native.log
          test "$(find build/qa/infantry-v2 -name '*.png' | wc -l)" -eq 140
      - name: Verify current Guardia LOD8 in actual 3D battle, fog, shared budget and performance receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/guardia-live-battle
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x800x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_guardia_v15_live_battle.gd 2>&1 | tee /tmp/guardia-live-battle.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/guardia-live-battle.log; then exit 1; fi
          grep -Fq 'PASS GUARDIA LIVE BATTLE:' /tmp/guardia-live-battle.log
          test "$(find build/qa/guardia-live-battle -name '*.png' | wc -l)" -eq 4
          test -s build/qa/guardia-live-battle/metrics.json
      - name: Verify actual two-tap Guardia order starts visual animation only after confirmation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x800x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_immersive_battle_3d_hud.gd 2>&1 | tee /tmp/guardia-order-confirmation.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/guardia-order-confirmation.log; then exit 1; fi
          grep -Fq 'PASS immersive 3D HUD V16:' /tmp/guardia-order-confirmation.log
      - name: Verify Engineer V6-V11 pressed closed torso, anchored hip and coaxial shield hinges in 34 Godot QA images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/infantry-v6
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_engineer_v6_360.gd 2>&1 | tee /tmp/infantry-v6-360.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/infantry-v6-360.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V6 360:' /tmp/infantry-v6-360.log
          test "$(find build/qa/infantry-v6 -name '*.png' | wc -l)" -eq 34
      - name: Verify Engineer V12.1 sculpted cases, chamfered shield and eight Godot PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/infantry-v12
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_engineer_v12_finish.gd 2>&1 | tee /tmp/infantry-v12-native.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/infantry-v12-native.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V12:' /tmp/infantry-v12-native.log
          test "$(find build/qa/infantry-v12 -name '*.png' | wc -l)" -eq 8
      - name: Verify Engineer V12.3 opaque human core, 15 solid seals, outward normals and ten 3D comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/infantry-v123-opaque
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v123_opaque_closure.gd 2>&1 | tee /tmp/infantry-v123-opaque.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/infantry-v123-opaque.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V12.3 OPAQUE:' /tmp/infantry-v123-opaque.log
          test "$(find build/qa/infantry-v123-opaque -name '*.png' | wc -l)" -eq 10
      - name: Verify V13 true smooth closed armor, spline limb normals and ten Godot comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/engineer-v13
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v13_smooth_finish.gd 2>&1 | tee /tmp/engineer-v13-smooth.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/engineer-v13-smooth.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V13:' /tmp/engineer-v13-smooth.log
          test "$(find build/qa/engineer-v13 -name '*.png' | wc -l)" -eq 10
      - name: Verify V14 real anatomical helmet/neck, deltoid and chest proportions with 10 Godot photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/engineer-v14
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v14_anatomic_finish.gd 2>&1 | tee /tmp/engineer-v14-anatomy.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/engineer-v14-anatomy.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V14:' /tmp/engineer-v14-anatomy.log
          test "$(find build/qa/engineer-v14 -name '*.png' | wc -l)" -eq 10
      - name: Verify V15 real rounded gear anatomy and 10 Godot same-camera PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/engineer-v15
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v15_rounded_gear.gd 2>&1 | tee /tmp/engineer-v15-gear.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/engineer-v15-gear.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V15:' /tmp/engineer-v15-gear.log
          test "$(find build/qa/engineer-v15 -name '*.png' | wc -l)" -eq 10
      - name: Verify V16 sealed anatomical full-body silhouette and ten real Godot before/after views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/engineer-v16
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v16_silhouette.gd 2>&1 | tee /tmp/engineer-v16-silhouette.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/engineer-v16-silhouette.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V16:' /tmp/engineer-v16-silhouette.log
          test "$(find build/qa/engineer-v16 -name '*.png' | wc -l)" -eq 10
      - name: Verify V17 closed anatomy, thirty-seven native views, animated contacts, damage and instanced effects
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/engineer-v17
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_engineer_v17_outer_armor.gd 2>&1 | tee /tmp/engineer-v17-armor.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/engineer-v17-armor.log; then exit 1; fi
          grep -Fq 'PASS ENGINEER V17:' /tmp/engineer-v17-armor.log
          test "$(find build/qa/engineer-v17 -name '*.png' | wc -l)" -eq 37
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarvoka-infantry-v1-godot-native-review
          path: |
            build/qa/infantry-v1/*.png
            build/qa/infantry-v2/*.png
            build/qa/guardia-live-battle/
            build/qa/infantry-v6/*.png
            build/qa/infantry-v12/*.png
            build/qa/infantry-v123-opaque/*.png
            build/qa/engineer-v13/*.png
            build/qa/engineer-v14/*.png
            build/qa/engineer-v15/*.png
            build/qa/engineer-v16/*.png
            build/qa/engineer-v17/*.png
          if-no-files-found: warn
          retention-days: 14
