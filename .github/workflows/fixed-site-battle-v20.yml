name: TARVOKA real playable territory battle screen v2.0

on:
  pull_request:
    paths:
      - "scripts/ui/FixedSiteBattleV20.gd"
      - "scripts/ui/FixedSiteMapV20.gd"
      - "scripts/ui/Main.gd"
      - "scripts/ui/HomeMenu.gd"
      - "tests/test_fixed_site_battle_ui_v20.gd"
      - ".github/workflows/fixed-site-battle-v20.yml"
  workflow_dispatch:

jobs:
  territory_battle:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run real battle HUD and territorial action regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_fixed_site_battle_ui_v20.gd \
            2>&1 | tee /tmp/tarvoka-territory-screen-v20.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-territory-screen-v20.log; then exit 1; fi
          grep -Fq 'PASS fixed site battle UI v20:' /tmp/tarvoka-territory-screen-v20.log
      - name: Repeat v19 camp+base engine checks
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_fixed_site_orders_v19.gd \
            2>&1 | tee /tmp/tarvoka-territory-v19-regression.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-territory-v19-regression.log; then exit 1; fi
          grep -Fq 'PASS fixed site orders v19:' /tmp/tarvoka-territory-v19-regression.log
      - name: Keep logs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-territory-battle-v20
          path: |
            /tmp/tarvoka-territory-screen-v20.log
            /tmp/tarvoka-territory-v19-regression.log
          retention-days: 30
          if-no-files-found: ignore
