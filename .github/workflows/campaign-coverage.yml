name: TARVOKA campaign mechanics coverage
on:
  pull_request:
    paths:
      - 'scripts/core/CampaignCatalog.gd'
      - 'scripts/core/UrbanEconomy.gd'
      - 'tests/test_campaign_catalog.gd'
      - '.github/workflows/campaign-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/core/CampaignCatalog.gd'
      - 'scripts/core/UrbanEconomy.gd'
      - 'tests/test_campaign_catalog.gd'
      - '.github/workflows/campaign-coverage.yml'
  workflow_dispatch:
jobs:
  campaign_coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot-campaign.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot-campaign.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate 50 story contracts and real capture rules
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 75s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_campaign_catalog.gd 2>&1 | tee /tmp/campaign-coverage.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/campaign-coverage.log; then
            echo 'Campaign mechanic coverage regression'; exit 1
          fi
          grep -F 'Campaign catalog: 50 chapters, mechanics coverage, 24 unlocks and infantry capture PASS.' /tmp/campaign-coverage.log
