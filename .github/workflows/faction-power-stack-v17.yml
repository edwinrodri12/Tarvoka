name: TARVOKA v17 cross-balance factions XP powers and rounding

on:
  pull_request:
    paths:
      - "scripts/experiments/FactionPowerBalanceV17.gd"
      - "tests/test_faction_power_stack_v17.gd"
      - ".github/workflows/faction-power-stack-v17.yml"
  workflow_dispatch:

jobs:
  battle_balance:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Cross-audit all eight faction candidates and veteran/technology breakpoints
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 150s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_faction_power_stack_v17.gd \
            2>&1 | tee /tmp/faction-stack-v17.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/faction-stack-v17.log; then exit 1; fi
          grep -Fq 'PASS faction power stack audit v17:' /tmp/faction-stack-v17.log
      - name: Check original 32-role battlefield baseline
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_full_combat_balance_v07.gd \
            2>&1 | tee /tmp/combat-base-v07.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/combat-base-v07.log; then exit 1; fi
          grep -Fq 'PASS full combat balance v07:' /tmp/combat-base-v07.log
      - name: Check original 32 veterancy trajectories
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_unit_veterancy_v14.gd \
            2>&1 | tee /tmp/unit-levels-v14.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/unit-levels-v14.log; then exit 1; fi
          grep -Fq 'PASS unit veterancy v14:' /tmp/unit-levels-v14.log
      - name: Preserve verifiable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-balance-commanders-v17
          path: |
            /tmp/faction-stack-v17.log
            /tmp/combat-base-v07.log
            /tmp/unit-levels-v14.log
          retention-days: 30
          if-no-files-found: ignore
