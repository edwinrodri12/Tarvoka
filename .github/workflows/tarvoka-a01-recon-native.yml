name: TARVOKA A01 Recon UAV V3 Native Visual QA

on:
  pull_request:
    paths:
      - ".github/workflows/tarvoka-a01-recon-native.yml"
      - "scripts/ui/A01Recon*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/BastionStudioAdapter.gd"
      - "tests/test_a01_recon*.gd"
      - "docs/A01_V1_NATIVE_RECON_UAV.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a01-recon-v3-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-a01-recon:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly this A01 PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install software rendering tools and Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri unzip
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot-a01.zip
          unzip -q /tmp/godot-a01.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version

      - name: Import native scenes and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/a01-v1
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --headless --path . --editor --quit \
            2>&1 | tee /tmp/a01-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open file|Failed loading resource' /tmp/a01-import.log; then
            echo "::error::Godot native source import failed"
            exit 1
          fi

      - name: Validate 8 factions in Android and hero LOD and 16 authentic renders
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_drone_v1.gd \
            2>&1 | tee /tmp/a01-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-native.log; then
            echo "::error::A01 native visual or safety tests failed"
            exit 1
          fi
          grep -F 'PASS A01 RECON UAV V3:' /tmp/a01-native.log
          test "$(find build/qa/a01-v1 -maxdepth 1 -name 'a01-f*-lod*.png' | wc -l)" -eq 16
          find build/qa/a01-v1 -name 'a01-f*-lod*.png' -size +2k | wc -l | grep -qx '16'

      # Mainline includes the real A01 geometry, but the original 3D Web
      # showroom scene is intentionally maintained on the pinned Studio
      # release branch. Reconstruct that SAME scene with this PR's sources
      # rather than substituting an unrelated or fabricated viewer.
      - name: Checkout the original shared native 3D Studio scene
        uses: actions/checkout@v4
        with:
          ref: feat/infantry-barracks-v5-final-corner-clearance-20261116
          path: shared-studio
          persist-credentials: false

      - name: Assemble the shared studio with exactly this PR's native modules
        shell: bash
        run: |
          set -euo pipefail
          test -s shared-studio/scenes/UnitArtStudioWeb.tscn
          test -s scripts/ui/BastionStudioAdapter.gd
          test -s scripts/ui/A01ReconFinishV3.gd
          cp -a scripts/. shared-studio/scripts/
          if [[ -d assets ]]; then
            mkdir -p shared-studio/assets
            cp -a assets/. shared-studio/assets/
          fi
          mkdir -p shared-studio/tests shared-studio/build/qa/a01-v1
          cp tests/test_a01_recon_shared_studio.gd shared-studio/tests/
          # Restore the original model selector/subviewport, with the same
          # BastionStudioAdapter used by the unified Pages publisher.
          sed -i 's|res://scripts/ui/CombinedArtStudioWeb.gd|res://scripts/ui/BastionStudioAdapter.gd|' shared-studio/scenes/UnitArtStudioWeb.tscn
          grep -Fq 'res://scripts/ui/BastionStudioAdapter.gd' shared-studio/scenes/UnitArtStudioWeb.tscn
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --headless --path shared-studio --editor --quit \
            2>&1 | tee /tmp/a01-original-studio-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open file|Failed loading resource' /tmp/a01-original-studio-import.log; then
            echo "::error::Pinned native unified TARVOKA Studio source import failed"
            exit 1
          fi

      - name: Exercise the SAME existing shared TARVOKA 3D studio
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path shared-studio --script res://tests/test_a01_recon_shared_studio.gd \
            2>&1 | tee /tmp/a01-shared-studio.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-shared-studio.log; then
            echo "::error::Shared studio A01 faction/selector/camera inspection failed"
            exit 1
          fi
          grep -F 'PASS A01 V3 SHARED STUDIO:' /tmp/a01-shared-studio.log
          test -s shared-studio/build/qa/a01-v1/a01-unified-studio.png

      - name: Upload real Godot visual evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-a01-v3-native-visual-evidence
          path: |
            build/qa/a01-v1/*.png
            shared-studio/build/qa/a01-v1/*.png
          if-no-files-found: warn
          retention-days: 14
