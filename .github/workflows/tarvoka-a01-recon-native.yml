name: TARVOKA A01 Recon UAV V14 Native Visual QA

on:
  pull_request:
    paths:
      - ".github/workflows/tarvoka-a01-recon-native.yml"
      - "scripts/ui/A01Recon*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/BastionStudioAdapter.gd"
      - "tests/test_a01_recon*.gd"
      - "docs/A01_V1_NATIVE_RECON_UAV.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a01-recon-v14-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-a01-recon:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly this A01 PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install software rendering tools and Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri unzip
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot-a01.zip
          unzip -q /tmp/godot-a01.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version

      - name: Import native scenes and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/a01-v1
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --headless --path . --editor --quit \
            2>&1 | tee /tmp/a01-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open file|Failed loading resource' /tmp/a01-import.log; then
            echo "::error::Godot native source import failed"
            exit 1
          fi

      - name: Validate 8 factions in Android and hero LOD and 16 authentic renders
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_drone_v1.gd \
            2>&1 | tee /tmp/a01-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-native.log; then
            echo "::error::A01 native visual or safety tests failed"
            exit 1
          fi
          grep -F 'PASS A01 RECON UAV V5:' /tmp/a01-native.log
          test "$(find build/qa/a01-v1 -maxdepth 1 -name 'a01-f*-lod*.png' | wc -l)" -eq 16
          find build/qa/a01-v1 -name 'a01-f*-lod*.png' -size +2k | wc -l | grep -qx '16'

      - name: Validate five cumulative damage stages and genuine repair in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_damage_v6.gd \
            2>&1 | tee /tmp/a01-v6-damage.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v6-damage.log; then
            echo "::error::A01 visual D0-D4 repair test failed"
            exit 1
          fi
          grep -F 'PASS A01 V6 NATIVE DAMAGE:' /tmp/a01-v6-damage.log
          test "$(find build/qa/a01-v6 -maxdepth 1 -name 'a01-v6-d*.png' | wc -l)" -eq 5

      - name: Stress test Android LOD8 — 12 real UAV meshes and D0-D4
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_mobile_budget_v7.gd \
            2>&1 | tee /tmp/a01-v7-mobile-budget.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v7-mobile-budget.log; then
            echo "::error::A01 V7 Android LOD mesh/triangle or 12-model stress proxy failed"
            exit 1
          fi
          grep -F 'PASS A01 V7 MOBILE BUDGET:' /tmp/a01-v7-mobile-budget.log
          test "$(find build/qa/a01-v7 -maxdepth 1 -name 'a01-v7-12-*.png' | wc -l)" -eq 2

      - name: Verify closed tapered V8 wingtips and 5 real Godot angle captures
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_winglet_v8.gd \
            2>&1 | tee /tmp/a01-v8-wings.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v8-wings.log; then
            echo "::error::A01 V8 watertight winglet or eight-faction paint failed"
            exit 1
          fi
          grep -F 'PASS A01 V8 WINGLETS:' /tmp/a01-v8-wings.log
          test "$(find build/qa/a01-v8 -maxdepth 1 -name 'a01-v8-*.png' | wc -l)" -eq 5

      - name: Validate V9 conformal faction enamel, root fairings and 5 new renders
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_winglet_v9.gd \
            2>&1 | tee /tmp/a01-v9-conformal.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v9-conformal.log; then
            echo "::error::A01 V9 conformal paint, joint geometry or Godot render failed"
            exit 1
          fi
          grep -F 'PASS A01 V9 CONFORMAL FINISH:' /tmp/a01-v9-conformal.log
          test "$(find build/qa/a01-v9 -maxdepth 1 -name 'a01-v9-*.png' | wc -l)" -eq 5

      - name: Validate V10 sculpted nose, moving EOIR guard and mobile damage budget
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_nose_optics_v10.gd \
            2>&1 | tee /tmp/a01-v10-nose.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v10-nose.log; then
            echo "::error::A01 V10 physical optics, nose or Android budget failed"
            exit 1
          fi
          grep -F 'PASS A01 V10 NOSE OPTICS:' /tmp/a01-v10-nose.log
          test "$(find build/qa/a01-v10 -maxdepth 1 -name 'a01-v10-*.png' | wc -l)" -eq 13

      - name: V11 sculpted airframe, sealed paint and eight native Godot views incl. root closeups
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_airframe_v11.gd \
            2>&1 | tee /tmp/a01-v11-airframe.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v11-airframe.log; then
            echo "::error::A01 V11 closed fuselage, exterior paint or geometry budget failed"
            exit 1
          fi
          grep -F 'PASS A01 V11 AERODYNAMIC BODY:' /tmp/a01-v11-airframe.log
          test "$(find build/qa/a01-v11 -maxdepth 1 -name 'a01-v11-*.png' | wc -l)" -eq 6

      - name: V12 watertight left and right wing root fairings and eight Godot angles incl. two root closeups
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_wing_root_v12.gd \
            2>&1 | tee /tmp/a01-v12-wings.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v12-wings.log; then
            echo "::error::A01 V12 root geometry, mirrored normals, LOD or damage regression"
            exit 1
          fi
          grep -F 'PASS A01 V12 WING ROOTS:' /tmp/a01-v12-wings.log
          test "$(find build/qa/a01-v12 -maxdepth 1 -name 'a01-v12-*.png' | wc -l)" -eq 8

      - name: V13 tail and EOIR physical surfaces with eight original Godot captures
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_tail_optics_v13.gd \
            2>&1 | tee /tmp/a01-v13-tail-eoir.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v13-tail-eoir.log; then
            echo "::error::A01 V13 optical skirt, V-tail topology or tactical safety failed"
            exit 1
          fi
          grep -F 'PASS A01 V13 TAIL EOIR:' /tmp/a01-v13-tail-eoir.log
          test "$(find build/qa/a01-v13 -maxdepth 1 -name 'a01-v13-*.png' | wc -l)" -eq 8

      - name: V14 sealed physical three-blade pusher and eight native Godot views
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_pusher_v14.gd \
            2>&1 | tee /tmp/a01-v14-pusher.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v14-pusher.log; then
            echo "::error::A01 V14 propeller closed geometry, motor animation or D4 regression"
            exit 1
          fi
          grep -F 'PASS A01 V14 PUSHER MOTOR:' /tmp/a01-v14-pusher.log
          test "$(find build/qa/a01-v14 -maxdepth 1 -name 'a01-v14-*.png' | wc -l)" -eq 8

      # This CI job deliberately validates ONLY the model and 21 actual
      # Godot renders. The shared Studio has many pinned building source
      # dependencies not contained in main; copying one scene here would
      # falsely fail unrelated missing class preloads. Its REAL integration
      # test runs under tarvoka-3d-pages.yml after assembling all sources.
      - name: Enforce same-viewer QA in the full native Studio publisher
        shell: bash
        run: |
          set -euo pipefail
          test -s tests/test_a01_recon_shared_studio.gd
          grep -Fq "test_a01_recon_shared_studio.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "PASS A01 V10 SHARED STUDIO:" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "A01NoseOpticsV10.has_model" scripts/ui/BastionStudioAdapter.gd
          grep -Fq "test_a01_recon_winglet_v8.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "test_a01_recon_winglet_v9.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "test_a01_recon_nose_optics_v10.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "test_a01_recon_airframe_v11.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "test_a01_recon_wing_root_v12.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "A01WingRootV12.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "A01TailOpticsV13.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "A01PusherV14.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "test_a01_recon_pusher_v14.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "PASS A01 V14 SHARED STUDIO:" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "test_a01_recon_tail_optics_v13.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "PASS A01 V13 SHARED STUDIO:" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "A01AirframeV11.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "test_a01_recon_damage_v6.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq 'faction_picker.select(_faction)' scripts/ui/BastionStudioAdapter.gd

      - name: Upload real Godot visual evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-a01-v14-pusher-visual-evidence
          path: |
            build/qa/a01-v1/*.png
            build/qa/a01-v6/*.png
            build/qa/a01-v7/*.png
            build/qa/a01-v8/*.png
            build/qa/a01-v9/*.png
            build/qa/a01-v10/*.png
            build/qa/a01-v11/*.png
            build/qa/a01-v12/*.png
            build/qa/a01-v13/*.png
            build/qa/a01-v14/*.png
          if-no-files-found: warn
          retention-days: 14
