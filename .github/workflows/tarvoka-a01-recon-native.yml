name: TARVOKA A01 Recon UAV V6 Native Visual QA

on:
  pull_request:
    paths:
      - ".github/workflows/tarvoka-a01-recon-native.yml"
      - "scripts/ui/A01Recon*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/BastionStudioAdapter.gd"
      - "tests/test_a01_recon*.gd"
      - "docs/A01_V1_NATIVE_RECON_UAV.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a01-recon-v6-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-a01-recon:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly this A01 PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install software rendering tools and Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri unzip
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot-a01.zip
          unzip -q /tmp/godot-a01.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version

      - name: Import native scenes and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/a01-v1
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --headless --path . --editor --quit \
            2>&1 | tee /tmp/a01-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open file|Failed loading resource' /tmp/a01-import.log; then
            echo "::error::Godot native source import failed"
            exit 1
          fi

      - name: Validate 8 factions in Android and hero LOD and 16 authentic renders
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_drone_v1.gd \
            2>&1 | tee /tmp/a01-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-native.log; then
            echo "::error::A01 native visual or safety tests failed"
            exit 1
          fi
          grep -F 'PASS A01 RECON UAV V5:' /tmp/a01-native.log
          test "$(find build/qa/a01-v1 -maxdepth 1 -name 'a01-f*-lod*.png' | wc -l)" -eq 16
          find build/qa/a01-v1 -name 'a01-f*-lod*.png' -size +2k | wc -l | grep -qx '16'

      - name: Validate five cumulative damage stages and genuine repair in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_a01_recon_damage_v6.gd \
            2>&1 | tee /tmp/a01-v6-damage.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a01-v6-damage.log; then
            echo "::error::A01 visual D0-D4 repair test failed"
            exit 1
          fi
          grep -F 'PASS A01 V6 NATIVE DAMAGE:' /tmp/a01-v6-damage.log
          test "$(find build/qa/a01-v6 -maxdepth 1 -name 'a01-v6-d*.png' | wc -l)" -eq 5

      # This CI job deliberately validates ONLY the model and 21 actual
      # Godot renders. The shared Studio has many pinned building source
      # dependencies not contained in main; copying one scene here would
      # falsely fail unrelated missing class preloads. Its REAL integration
      # test runs under tarvoka-3d-pages.yml after assembling all sources.
      - name: Enforce same-viewer QA in the full native Studio publisher
        shell: bash
        run: |
          set -euo pipefail
          test -s tests/test_a01_recon_shared_studio.gd
          grep -Fq "test_a01_recon_shared_studio.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "PASS A01 V6 SHARED STUDIO:" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq "A01DamageV6.has_model" scripts/ui/BastionStudioAdapter.gd
          grep -Fq "test_a01_recon_damage_v6.gd" .github/workflows/tarvoka-3d-pages.yml
          grep -Fq 'faction_picker.select(_faction)' scripts/ui/BastionStudioAdapter.gd

      - name: Upload real Godot visual evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-a01-v6-native-and-damage-evidence
          path: |
            build/qa/a01-v1/*.png
            build/qa/a01-v6/*.png
          if-no-files-found: warn
          retention-days: 14
