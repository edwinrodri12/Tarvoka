name: TARVOKA A01 attack helicopter V1 native QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/AttackHelicopterV1.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_attack_helicopter_v1.gd'
      - '.github/workflows/a01-helicopter-qa.yml'
  pull_request:
    paths:
      - 'scripts/ui/AttackHelicopterV1.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_attack_helicopter_v1.gd'
      - '.github/workflows/a01-helicopter-qa.yml'
  workflow_dispatch:

jobs:
  a01-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: A01 faction, geometry, animation and old battle model regression
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless \
            --path . --script res://tests/test_attack_helicopter_v1.gd
