name: TARVOKA 3D mesh budget audit
on:
  pull_request:
    paths:
      - 'scripts/tools/MeshBudgetAudit.gd'
      - 'tests/test_mesh_budget_audit.gd'
      - '.github/workflows/mesh-budget-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tools/MeshBudgetAudit.gd'
      - 'tests/test_mesh_budget_audit.gd'
      - '.github/workflows/mesh-budget-audit.yml'
  workflow_dispatch:

jobs:
  geometry-census:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test mesh census with strict engine-error detection
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 80s xvfb-run -a -s "-screen 0 1280x800x24" /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/test_mesh_budget_audit.gd 2>&1 | tee /tmp/mesh-budget-audit.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/mesh-budget-audit.log; then
            echo 'Godot mesh audit errors detected' >&2
            exit 1
          fi
          grep -F 'MESH_BUDGET_AUDIT_PASS' /tmp/mesh-budget-audit.log
