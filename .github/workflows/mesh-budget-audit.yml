name: TARVOKA 3D mesh budget audit
on:
  pull_request:
    paths:
      - 'scripts/tools/MeshBudgetAudit.gd'
      - 'tests/test_mesh_budget_audit.gd'
      - 'tests/audit_production_scene.gd'
      - 'tools/find_3d_census_scenes.py'
      - 'tests/fixtures/mesh_budget_box.tscn'
      - '.github/workflows/mesh-budget-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tools/MeshBudgetAudit.gd'
      - 'tests/test_mesh_budget_audit.gd'
      - '.github/workflows/mesh-budget-audit.yml'
  workflow_dispatch:

jobs:
  geometry-census:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test mesh census with strict engine-error detection
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 80s xvfb-run -a -s "-screen 0 1280x800x24" /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/test_mesh_budget_audit.gd 2>&1 | tee /tmp/mesh-budget-audit.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/mesh-budget-audit.log; then
            echo 'Godot mesh audit errors detected' >&2
            exit 1
          fi
          grep -F 'MESH_BUDGET_AUDIT_PASS' /tmp/mesh-budget-audit.log
      - name: Smoke-test real PackedScene census CLI
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 80s xvfb-run -a -s "-screen 0 1280x800x24" /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/audit_production_scene.gd -- res://tests/fixtures/mesh_budget_box.tscn 2>&1 | tee /tmp/mesh-production-census.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/mesh-production-census.log; then
            echo 'Godot production census errors detected' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("/tmp/mesh-production-census.log").read_text().splitlines()
          records = [json.loads(line.split("MESH_PRODUCTION_CENSUS ", 1)[1]) for line in lines if line.startswith("MESH_PRODUCTION_CENSUS ")]
          assert len(records) == 1, f"Expected one census report, got {len(records)}"
          assert records[0]["scene"] == "res://tests/fixtures/mesh_budget_box.tscn"
          report = records[0]["report"]
          assert report["triangles"] == 12, report
          assert report["instances"] == 1, report
          assert report["mesh_nodes"] == 1, report
          print("MESH_PRODUCTION_CENSUS_SMOKE_PASS")
          PY
      - name: Discover and census a production 3D scene (not the fixture)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarvoka-census
          python3 tools/find_3d_census_scenes.py . > /tmp/tarvoka-census/candidates.txt || status=$?
          if [ "${status:-0}" -ne 0 ] && [ ! -s /tmp/tarvoka-census/candidates.txt ]; then
            echo "NO_PRODUCTION_3D_SCENE_CANDIDATE" | tee /tmp/tarvoka-census/status.txt
            exit 0
          fi
          scene="$(head -n 1 /tmp/tarvoka-census/candidates.txt)"
          echo "Auditing production scene: $scene"
          timeout --signal=TERM --kill-after=5s 100s xvfb-run -a -s "-screen 0 1280x800x24" /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/audit_production_scene.gd -- "$scene" 2>&1 | tee /tmp/tarvoka-census/production.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/tarvoka-census/production.log; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("/tmp/tarvoka-census/production.log").read_text().splitlines()
          records = [json.loads(line.split("MESH_PRODUCTION_CENSUS ", 1)[1]) for line in lines if line.startswith("MESH_PRODUCTION_CENSUS ")]
          assert len(records) == 1, f"Expected exactly one production report, got {len(records)}"
          report = records[0]["report"]
          assert isinstance(report.get("triangles"), int) and report["triangles"] >= 0
          Path("/tmp/tarvoka-census/production.json").write_text(json.dumps(records[0], indent=2) + "\n")
          print("PRODUCTION_3D_CENSUS_PASS", records[0]["scene"], report["triangles"])
          PY
      - name: Upload production census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-3d-census
          path: /tmp/tarvoka-census/
          if-no-files-found: warn
