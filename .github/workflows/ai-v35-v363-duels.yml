name: TARVOKA IA v3.5 vs v3.6.3 paired complete-battle telemetry

on:
  pull_request:
    paths:
      - "scripts/core/BasicAI.gd"
      - "scripts/core/NextTurnThreatV36.gd"
      - "scripts/core/RiskRewardV363.gd"
      - "tests/test_ai_v35_v363_full_matches.gd"
      - "tests/test_ai_risk_reward_v363.gd"
      - "tests/aggregate_ai_v363_matches.py"
      - "tests/test_ai_v363_log_parser.py"
      - ".github/workflows/ai-v35-v363-duels.yml"
  workflow_dispatch:

jobs:
  matched_duels:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10, 12]
        map: [0, 2]
        fog: ["false", "true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run four swapped-side and swapped-initiative complete sessions
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_v35_v363_full_matches.gd \
            2>&1 | tee /tmp/v35-v363-duels.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v35-v363-duels.log; then exit 1; fi
          grep -Fq 'PASS AI v35-v363 matched full-session battle telemetry:' /tmp/v35-v363-duels.log
          grep -Fq 'AB363_SUMMARY ' /tmp/v35-v363-duels.log
          test "$(grep -c '^AB363_MATCH ' /tmp/v35-v363-duels.log)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-ab-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/v35-v363-duels.log
          retention-days: 30
          if-no-files-found: ignore

  discipline_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Protect wounded infantry and capture objectives with economic tradeoff
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 450s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_risk_reward_v363.gd \
            2>&1 | tee /tmp/v363-discipline.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v363-discipline.log; then exit 1; fi
          grep -Fq 'PASS AI v363 risk reward:' /tmp/v363-discipline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v363-discipline-contract
          path: /tmp/v363-discipline.log
          retention-days: 30
          if-no-files-found: ignore

  aggregate_results:
    needs: [matched_duels]
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download all 8 evidence logs without overwriting them
        uses: actions/download-artifact@v4
        with:
          pattern: ai-ab-*
          path: .ci-duel-logs
          merge-multiple: false
      - name: Verify log parser ignores GitHub command echoes
        run: |
          set -euo pipefail
          python3 tests/test_ai_v363_log_parser.py
      - name: Validate exactly 32 battles and produce comparable summary
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_v363_matches.py .ci-duel-logs
          cat reports/ai_v363_ab_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive inspectable A/B summary
        uses: actions/upload-artifact@v4
        with:
          name: ai-v363-32-battle-summary
          path: |
            reports/ai_v363_ab_summary.json
            reports/ai_v363_ab_summary.md
          retention-days: 30
