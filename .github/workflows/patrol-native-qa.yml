name: TARVOKA M01 patrol native 3D QA
on:
  pull_request:
    paths:
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_patrol_v1.gd'
      - '.github/workflows/patrol-native-qa.yml'
  push:
    branches: [main, art/m01-patrol-v1-20261126]
    paths:
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_patrol_v1.gd'
      - '.github/workflows/patrol-native-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patrol:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Import project
        run: |
          set -euo pipefail
          if test ! -f scripts/ui/CombinedArtStudioWeb.gd && test -f scripts/ui/BastionStudioAdapter.gd; then
            mv scripts/ui/BastionStudioAdapter.gd /tmp/
          fi
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/patrol-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Import failed' /tmp/patrol-import.log; then exit 1; fi
      - name: Check 18 variants and render sixteen native images
        run: |
          set -euo pipefail
          timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/test_patrol_v1.gd 2>&1 | tee /tmp/patrol.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/patrol.log; then exit 1; fi
          grep -F 'PASS M01 PATROL V1.2: 18 variants, 16 PNGs' /tmp/patrol.log
          test "$(find build/qa/patrol-v1 -name '*.png' | wc -l)" -eq 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarvoka-patrol-v12-native
          path: build/qa/patrol-v1/*.png
