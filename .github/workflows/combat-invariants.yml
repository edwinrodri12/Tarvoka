name: Combat invariant regression
on:
  pull_request:
    paths:
      - 'scripts/core/Combat.gd'
      - 'tests/test_combat_invariants.gd'
      - '.github/workflows/combat-invariants.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/core/Combat.gd'
      - 'tests/test_combat_invariants.gd'
      - '.github/workflows/combat-invariants.yml'
  workflow_dispatch:

jobs:
  combat-invariants:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify bounded combat invariants
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_combat_invariants.gd 2>&1 | tee /tmp/combat-invariants.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/combat-invariants.log; then exit 1; fi
          grep -F 'PASS: combat invariants' /tmp/combat-invariants.log
