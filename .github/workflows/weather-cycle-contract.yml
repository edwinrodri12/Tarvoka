name: Weather cycle state contract
on:
  pull_request:
    paths:
      - 'scripts/core/Weather.gd'
      - 'tests/test_weather_cycle_state_contract.gd'
      - '.github/workflows/weather-cycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/core/Weather.gd'
      - 'tests/test_weather_cycle_state_contract.gd'
      - '.github/workflows/weather-cycle-contract.yml'
  workflow_dispatch:

jobs:
  weather-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Verify deterministic weather and legacy saves
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_weather_cycle_state_contract.gd 2>&1 | tee /tmp/weather-contract.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/weather-contract.log; then
            echo 'Weather state regression failed'; exit 1
          fi
          grep -F 'PASS: deterministic weather cycle and legacy preservation' /tmp/weather-contract.log
