name: TARVOKA Base Aerea V2 Hangar and Animated Gates GPU QA

on:
  push:
    branches:
      - feat/airbase-v2-hangar-doors-studio-20261114
    paths:
      - "scripts/ui/Airbase3DV1.gd"
      - "scripts/ui/AirbaseHangarV2.gd"
      - "scripts/ui/AirbaseDoorRigV2.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_airbase_v2_hangar_doors_gpu.gd"
      - ".github/workflows/airbase-v2-hangar-gates-gpu.yml"
  pull_request:
    paths:
      - "scripts/ui/Airbase3DV1.gd"
      - "scripts/ui/AirbaseHangarV2.gd"
      - "scripts/ui/AirbaseDoorRigV2.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_airbase_v2_hangar_doors_gpu.gd"
      - ".github/workflows/airbase-v2-hangar-gates-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Bring the actual V15 PNGs from the Android game
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-android
          persist-credentials: false
      - name: Copy precisely nine approved PNGs and isolate Android code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "source-android/assets/buildings/hq_v15/hq_${i}.png"
            cp "source-android/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s source-android/assets/buildings/hq_v15/hq_neutral.png
          cp source-android/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          rm -rf source-android
          test "$(find assets/buildings/hq_v15 -name '*.png' | wc -l)" -eq 9
      - name: Install native Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/airbase2-godot.zip
          unzip -q /tmp/airbase2-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          timeout --signal=TERM --kill-after=5s 120s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/airbase2-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/airbase2-import.log; then
            echo "Airbase V2 architectural lighting import failed" >&2; exit 1
          fi
      - name: Native GPU verify native airbase, 8 factions, damage, weather and editor controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_airbase_v2_hangar_doors_gpu.gd 2>&1 | tee /tmp/airbase2-gpu.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/airbase2-gpu.log; then
            echo "Airbase V2 architecture regression" >&2; exit 1
          fi
          grep -q "PASS AIRBASE V2:" /tmp/airbase2-gpu.log
          for image in \
            tarvoka_airbase_v2_level1_closed.png \
            tarvoka_airbase_v2_level1_open.png \
            tarvoka_airbase_v2_interior_inspection.png \
            tarvoka_airbase_v2_half_open.png \
            tarvoka_airbase_v2_level3_open.png \
            tarvoka_airbase_v2_turquoise_open.png \
            tarvoka_airbase_v2_damage_jammed.png \
            tarvoka_airbase_v2_critical.png \
            tarvoka_airbase_v2_destroyed.png \
            tarvoka_airbase_v2_snow.png; do
            test -s "artifacts/$image"
          done
      - name: Archive real GPU visuals
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Airbase-V2-Hangar-Gates-Godot-GPU
          retention-days: 30
          if-no-files-found: error
          path: artifacts/tarvoka_airbase_v2_*.png
