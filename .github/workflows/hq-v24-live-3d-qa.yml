name: TARVOKA HQ V24 real 3D battle QA
on:
  push:
    branches: [feat/hq-v24-live-battle-3d-20261121]
    paths:
      - "scripts/ui/HeadquartersMapLOD3D.gd"
      - "scripts/ui/HeadquartersBattle3D.gd"
      - "scripts/ui/HeadquartersCurvedRoof3D.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "tests/test_hq_v24_live_battle_3d.gd"
      - "tests/test_hq_v24_visual_gallery.gd"
      - ".github/workflows/hq-v24-live-3d-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ui/HeadquartersMapLOD3D.gd"
      - "scripts/ui/HeadquartersBattle3D.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "tests/test_hq_v24_live_battle_3d.gd"
      - ".github/workflows/hq-v24-live-3d-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headquarters-real-battle:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original Godot 4.3 GL Compatibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/hq-v24-godot.zip
          unzip -oq /tmp/hq-v24-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Parse gameplay project (exclude unrelated Web adapters)
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ui/BastionStudioAdapter.gd scripts/ui/ArmoredWorkshopStudioAdapterV1.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/hq-v24-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/hq-v24-import.log; then exit 1; fi
      - name: Test real battle capitals, eight factions, progressive damage, neutral fog
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 100s \
            xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_hq_v24_live_battle_3d.gd \
            2>&1 | tee /tmp/hq-v24-3d-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/hq-v24-3d-test.log; then exit 1; fi
          grep -F 'PASS HQ V24 LIVE 3D:' /tmp/hq-v24-3d-test.log
      - name: Capture actual Godot GL 3D battle and architecture screenshots
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 100s \
            xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_hq_v24_visual_gallery.gd \
            2>&1 | tee /tmp/hq-v24-visual.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/hq-v24-visual.log; then exit 1; fi
          grep -F 'PASS HQ V24 VISUAL GALLERY:' /tmp/hq-v24-visual.log
      - name: Publish native QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-hq-v24-native-3d-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/hq-v24-import.log
            /tmp/hq-v24-3d-test.log
            /tmp/hq-v24-visual.log
            artifacts/hq_v24_native/*.png
