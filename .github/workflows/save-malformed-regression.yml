name: TARVOKA malformed save regression
on:
  pull_request:
    paths:
      - 'tests/test_save_malformed_regression.gd'
      - 'scripts/core/SaveCodec.gd'
      - '.github/workflows/save-malformed-regression.yml'
  workflow_dispatch:
jobs:
  save-malformed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip'
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Reject malformed saves and preserve valid snapshot
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/test_save_malformed_regression.gd 2>&1 | tee /tmp/save-malformed.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' /tmp/save-malformed.log; then
            echo 'Godot reported a regression failure' >&2
            exit 1
          fi
          grep -Fq 'PASS save malformed regression: 9 corruptions rejected and baseline intact' /tmp/save-malformed.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-malformed-godot-log
          path: /tmp/save-malformed.log
          if-no-files-found: ignore
