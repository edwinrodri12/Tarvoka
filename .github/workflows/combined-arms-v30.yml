name: TARVOKA v30 combined arms vs recruitment timing

on:
  pull_request:
    paths:
      - "scripts/experiments/StrategicMatchBalanceV21.gd"
      - "tests/test_combined_arms_barracks_v30.gd"
      - ".github/workflows/combined-arms-v30.yml"
  workflow_dispatch:

jobs:
  combined_arms:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: [small_open, medium_open, medium_forest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test 16 legal pairs with separate recruit timing and APC support levers
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_combined_arms_barracks_v30.gd \
            -- ${{ matrix.scenario }} \
            2>&1 | tee /tmp/v30-combined.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v30-combined.log; then exit 1; fi
          grep -Fq 'PASS v30 combined arms and purchase timing:' /tmp/v30-combined.log
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-v30-${{ matrix.scenario }}
          path: /tmp/v30-combined.log
          retention-days: 30
          if-no-files-found: ignore
