name: TARVOKA specialist camps and fixed-site HUD contracts v1.9

on:
  pull_request:
    paths:
      - "scripts/experiments/FixedSiteOrdersV19.gd"
      - "tests/test_fixed_site_orders_v19.gd"
      - ".github/workflows/fixed-site-orders-v19.yml"
  workflow_dispatch:

jobs:
  fixed_site_orders:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test specialist camp orders, fixed-site read models and independent saves
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_fixed_site_orders_v19.gd \
            2>&1 | tee /tmp/tarvoka-fixed-site-v19.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-fixed-site-v19.log; then exit 1; fi
          grep -Fq 'PASS fixed site orders v19:' /tmp/tarvoka-fixed-site-v19.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-fixed-site-orders-v19
          path: /tmp/tarvoka-fixed-site-v19.log
          retention-days: 30
          if-no-files-found: ignore
