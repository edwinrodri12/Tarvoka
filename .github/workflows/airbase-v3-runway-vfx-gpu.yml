name: TARVOKA Base Aerea V3 Aligned Runway and Combat VFX GPU QA

on:
  push:
    branches:
      - feat/airbase-v3-aligned-runway-combat-vfx-20261114
    paths:
      - "scripts/ui/Airbase3DV1.gd"
      - "scripts/ui/AirbaseHangarV2.gd"
      - "scripts/ui/AirbaseDamageFXV3.gd"
      - "scripts/ui/AirbaseImpactV3.gd"
      - "scripts/ui/HeadquartersImpactV21.gd"
      - "assets/shaders/hq_volumetric_smoke_v23.gdshader"
      - "scripts/ui/AirbaseDoorRigV2.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_airbase_v3_aligned_runway_vfx_gpu.gd"
      - ".github/workflows/airbase-v3-runway-vfx-gpu.yml"
  pull_request:
    paths:
      - "scripts/ui/Airbase3DV1.gd"
      - "scripts/ui/AirbaseHangarV2.gd"
      - "scripts/ui/AirbaseDamageFXV3.gd"
      - "scripts/ui/AirbaseImpactV3.gd"
      - "scripts/ui/HeadquartersImpactV21.gd"
      - "assets/shaders/hq_volumetric_smoke_v23.gdshader"
      - "scripts/ui/AirbaseDoorRigV2.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_airbase_v3_aligned_runway_vfx_gpu.gd"
      - ".github/workflows/airbase-v3-runway-vfx-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Bring the actual V15 PNGs from the Android game
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-android
          persist-credentials: false
      - name: Copy precisely nine approved PNGs and isolate Android code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "source-android/assets/buildings/hq_v15/hq_${i}.png"
            cp "source-android/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s source-android/assets/buildings/hq_v15/hq_neutral.png
          cp source-android/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          rm -rf source-android
          test "$(find assets/buildings/hq_v15 -name '*.png' | wc -l)" -eq 9
      - name: Install native Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/airbase3-godot.zip
          unzip -q /tmp/airbase3-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          timeout --signal=TERM --kill-after=5s 120s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/airbase3-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/airbase3-import.log; then
            echo "Airbase V3 architectural lighting import failed" >&2; exit 1
          fi
      - name: Native GPU verify native airbase, 8 factions, damage, weather and editor controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_airbase_v3_aligned_runway_vfx_gpu.gd 2>&1 | tee /tmp/airbase3-gpu.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/airbase3-gpu.log; then
            echo "Airbase V3 architecture regression" >&2; exit 1
          fi
          grep -q "PASS AIRBASE V3:" /tmp/airbase3-gpu.log
          for image in \
            tarvoka_airbase_v3_aligned_runway.png \
            tarvoka_airbase_v3_runway_open_hangar.png \
            tarvoka_airbase_v3_bullet_hit.png \
            tarvoka_airbase_v3_explosion_hit.png \
            tarvoka_airbase_v3_medium_smoke.png \
            tarvoka_airbase_v3_critical_fire.png \
            tarvoka_airbase_v3_ruins.png \
            tarvoka_airbase_v3_aligned_turquoise.png \
            tarvoka_airbase_v3_runway_snow.png; do
            test -s "artifacts/$image"
          done
      - name: Archive real GPU visuals
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Airbase-V3-Runway-Combat-GPU
          retention-days: 30
          if-no-files-found: error
          path: artifacts/tarvoka_airbase_v3_*.png
