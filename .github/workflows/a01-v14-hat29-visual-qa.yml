name: TARVOKA HAT-29 V14 faction identity and ballistic animations

on:
  pull_request:
    paths:
      - 'scripts/ui/AttackHelicopterFactionV14.gd'
      - 'scripts/ui/AttackHelicopterCombatFXV14.gd'
      - 'scripts/ui/AttackHelicopterNightStudioV144.gd'
      - 'scripts/ui/AttackHelicopterRotorMountV145.gd'
      - 'scripts/ui/AttackHelicopterRotorDampersV146.gd'
      - 'scripts/ui/AttackHelicopterDamperFinishV147.gd'
      - 'scripts/ui/AttackHelicopterPitchHingesV148.gd'
      - 'scripts/ui/AttackHelicopterRotorAnchorsV149.gd'
      - 'scripts/ui/AttackHelicopterRotorContactV1410.gd'
      - 'scripts/ui/AttackHelicopterBladeRootsV1411.gd'
      - 'scripts/ui/AttackHelicopterBladeSeamV1412.gd'
      - 'scripts/ui/AttackHelicopterHubCrownV1413.gd'
      - 'scripts/ui/AttackHelicopterHubWreckV1414.gd'
      - 'scripts/ui/AttackHelicopterHubCutFinishV1415.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_attack_helicopter_v9_studio.gd'
      - 'tests/test_attack_helicopter_v14.gd'
      - 'tests/test_attack_helicopter_v14_capture.gd'
      - 'tests/test_attack_helicopter_v14_13_motion.gd'
      - 'tests/test_attack_helicopter_v14_14_wreck.gd'
      - 'tests/test_attack_helicopter_v14_15_cut_finish.gd'
      - '.github/workflows/a01-v14-hat29-visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ui/AttackHelicopterFactionV14.gd'
      - 'scripts/ui/AttackHelicopterCombatFXV14.gd'
      - 'scripts/ui/AttackHelicopterPitchHingesV148.gd'
      - 'scripts/ui/AttackHelicopterRotorAnchorsV149.gd'
      - 'scripts/ui/AttackHelicopterRotorContactV1410.gd'
      - 'scripts/ui/AttackHelicopterBladeRootsV1411.gd'
      - 'scripts/ui/AttackHelicopterBladeSeamV1412.gd'
      - 'scripts/ui/AttackHelicopterHubCrownV1413.gd'
      - 'scripts/ui/AttackHelicopterHubWreckV1414.gd'
      - 'scripts/ui/AttackHelicopterHubCutFinishV1415.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_attack_helicopter_v14.gd'
      - 'tests/test_attack_helicopter_v14_capture.gd'
      - 'tests/test_attack_helicopter_v14_13_motion.gd'
      - 'tests/test_attack_helicopter_v14_14_wreck.gd'
      - 'tests/test_attack_helicopter_v14_15_cut_finish.gd'
      - '.github/workflows/a01-v14-hat29-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hat29-real-godot:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete proposed HAT-29 Godot source
        uses: actions/checkout@v4
      - name: Install actual Godot 4.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test eight armies, visual missiles and reversible destruction
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v14.gd \
            2>&1 | tee /tmp/hat29-v14.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/hat29-v14.log; then
            echo "Godot V14 regression failed"; exit 1
          fi
          grep -F 'PASS HAT29 V14.12:' /tmp/hat29-v14.log
      - name: Test 384 actual animated rotor poses, missiles, crash and repair on 8 factions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v14_13_motion.gd \
            2>&1 | tee /tmp/hat29-v1413-motion.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/hat29-v1413-motion.log; then
            echo "V14.13 live rotor continuity and crash regression failed"; exit 1
          fi
          grep -F 'PASS HAT29 V14.13 MOTION:' /tmp/hat29-v1413-motion.log

      - name: Test eight real V13 rotor hub wreck and repair cycles with V14.14 shards
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v14_14_wreck.gd \
            2>&1 | tee /tmp/hat29-v1414-wreck.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/hat29-v1414-wreck.log; then
            echo "V14.14 rotor hub wreck continuity failed"; exit 1
          fi
          grep -F 'PASS HAT29 V14.14 WRECK:' /tmp/hat29-v1414-wreck.log

      - name: Validate two watertight 3D metal fracture cuts in 8 HAT-29 factions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v14_15_cut_finish.gd \
            2>&1 | tee /tmp/hat29-v1415-cuts.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/hat29-v1415-cuts.log; then
            echo "V14.15 physically sealed cut-edge regression failed"; exit 1
          fi
          grep -F 'PASS HAT29 V14.15 CUT FINISH:' /tmp/hat29-v1415-cuts.log

      - name: Generate 93 real HAT-29 frames with V14.15 open/closed metal cuts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hat29-v14-images
          timeout --signal=TERM --kill-after=5s 320s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 HAT29_CAPTURE_DIR=/tmp/hat29-v14-images \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v14_capture.gd \
            2>&1 | tee /tmp/hat29-v14-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/hat29-v14-capture.log; then
            echo "Godot V14 image capture failed"; exit 1
          fi
          grep -F 'PASS HAT29 V14 CAPTURE:' /tmp/hat29-v14-capture.log
          test "$(find /tmp/hat29-v14-images -maxdepth 1 -name '*.png' | wc -l)" -eq 93
      - name: Upload actual Godot 3D screenshots of all factions and animation states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-hat29-v14-15-godot-93-frames
          path: |
            /tmp/hat29-v14-images/*.png
            /tmp/hat29-v14.log
            /tmp/hat29-v1413-motion.log
            /tmp/hat29-v1414-wreck.log
            /tmp/hat29-v1415-cuts.log
            /tmp/hat29-v14-capture.log
          if-no-files-found: warn
          retention-days: 14
