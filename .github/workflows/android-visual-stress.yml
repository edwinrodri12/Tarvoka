name: TARVOKA Android Visual Stress QA

on:
  pull_request:
    paths:
      - "scripts/ui/StressBenchmark.gd"
      - "scripts/ui/Main.gd"
      - "tests/test_android_visual_stress.gd"
      - ".github/workflows/android-visual-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot43.zip
          unzip -q /tmp/godot43.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit \
            2>&1 | tee /tmp/tarvoka_stress_import.log
          if grep -E 'SCRIPT ERROR:|Import failed' /tmp/tarvoka_stress_import.log; then exit 1; fi
      - name: Stress structure and rendering in CI headless (NOT Android FPS)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_android_visual_stress.gd \
            2>&1 | tee /tmp/tarvoka_stress_headless.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/tarvoka_stress_headless.log; then exit 1; fi
          grep -q "PASS TARVOKA Android stress QA:" /tmp/tarvoka_stress_headless.log
      - name: Rendering with virtual desktop GPU (NOT Android FPS)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_android_visual_stress.gd \
            2>&1 | tee /tmp/tarvoka_stress_desktop.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/tarvoka_stress_desktop.log; then exit 1; fi
          grep -q "PASS TARVOKA Android stress QA:" /tmp/tarvoka_stress_desktop.log
      - name: Collect run logs, not phone benchmarks
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          for kind in import headless desktop; do
            if test -f "/tmp/tarvoka_stress_$kind.log"; then
              cp "/tmp/tarvoka_stress_$kind.log" "artifacts/tarvoka_stress_$kind.log"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TARVOKA-Visual-Stress-QA-Linux-Logs
          retention-days: 21
          if-no-files-found: warn
          path: artifacts/tarvoka_stress_*.log
