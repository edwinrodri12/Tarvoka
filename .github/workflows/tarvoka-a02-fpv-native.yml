name: TARVOKA A02 FPV V1 native visual QA

on:
  pull_request:
    paths:
      - ".github/workflows/tarvoka-a02-fpv-native.yml"
      - "scripts/ui/A02Fpv*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/BastionStudioAdapter.gd"
      - "tests/test_a02_fpv*.gd"
      - "docs/A02_FPV_ART_V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a02-fpv-v1-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-a02-fpv:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly this A02 PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install software rendering tools and Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri unzip python3-pil
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot-a01.zip
          unzip -q /tmp/godot-a01.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version

      - name: Import native scenes and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/a02-v1
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --headless --path . --editor --quit \
            2>&1 | tee /tmp/a01-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open file|Failed loading resource' /tmp/a01-import.log; then
            echo "::error::Godot native source import failed"
            exit 1
          fi

      - name: Validate native A02 and 52 inspection renders
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/test_a02_fpv_art_v1.gd 2>&1 | tee /tmp/a02-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a02-native.log; then exit 1; fi
          grep -F 'PASS A02 FPV ART V1:' /tmp/a02-native.log
          test "$(find build/qa/a02-v1 -name 'a02-f*-lod*.png' -size +2k | wc -l)" -eq 16
          test "$(find build/qa/a02-v1 -name 'a02-v2-*.png' -size +2k | wc -l)" -eq 7
          test "$(find build/qa/a02-v1 -name 'a02-v8-d*.png' -size +2k | wc -l)" -eq 5
          test -s build/qa/a02-v1/a02-v10-workload.json
      - name: Verify complete A02 visual evidence and nonempty rendered pixels
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import hashlib
          import json
          root = Path('build/qa/a02-v1')
          expected = {f'a02-f{f}-lod{lod}.png' for f in range(8) for lod in (8, 13)}
          expected |= {f'a02-v2-{view}.png' for view in ('front','rear','top','bottom','front-detail','rear-iso','side')}
          expected |= {f'a02-v8-d{d}.png' for d in range(5)}
          expected |= {f'a02-v14-orbit-{a:03d}.png' for a in range(0, 360, 30)}
          expected |= {f'a02-v14-{kind}-{step}.png' for kind in ('move','hover','hit','wreck') for step in range(3)}
          actual = {p.name for p in root.glob('*.png')}
          assert len(expected) == 52 and actual == expected, f'Missing {expected-actual}; extra {actual-expected}'
          frames = []
          for name in sorted(expected):
              path = root / name
              with Image.open(path) as raw:
                  assert raw.format == 'PNG' and raw.size == (960, 680), name
                  image = raw.convert('RGB')
              difference = ImageChops.difference(image, Image.new('RGB', image.size, image.getpixel((0, 0))))
              mask = difference.convert('L').point(lambda x: 255 if x > 6 else 0)
              ratio = mask.histogram()[255] / (image.width * image.height)
              bounds = mask.getbbox()
              assert bounds and 0.02 < ratio < 0.70, f'Empty or suspect frame {name}: {ratio}'
              frames.append({'file': name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'visible_pixel_ratio': round(ratio, 5), 'bounds': bounds})
          inventory = json.loads((root / 'a02-v10-workload.json').read_text())
          states = inventory['states']
          matrix = {(row['faction'], row['lod'], row['damage']) for row in states}
          assert len(states) == 80 and matrix == {(f,l,d) for f in range(8) for l in (8,13) for d in range(5)}
          (root / 'a02-v15-evidence.json').write_text(json.dumps({
              'expected_frames': 52, 'actual_frames': len(frames), 'states': len(matrix),
              'measurement': 'PNG foreground coverage is a rendering sanity check, not aesthetic approval',
              'frames': frames}, indent=2) + '\n')
          print('PASS A02 52 real nonempty PNGs and 80 unique resource states')
          PY
      - name: Exercise actual unified Godot Studio A02 controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/test_a02_fpv_shared_studio_v16.gd 2>&1 | tee /tmp/a02-studio.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|Assertion failed' /tmp/a02-studio.log; then exit 1; fi
          grep -F 'PASS A02 V16 SHARED STUDIO:' /tmp/a02-studio.log
          test "$(find build/qa/a02-shared-studio -name '*.png' -size +2k | wc -l)" -eq 3
      - name: Archive authentic A02 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-a02-v1-native-visual-evidence
          path: |
            build/qa/a02-v1/*.png
            build/qa/a02-v1/a02-v10-workload.json
            build/qa/a02-v1/a02-v15-evidence.json
            build/qa/a02-shared-studio/*.png
