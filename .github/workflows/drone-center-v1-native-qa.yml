name: TARVOKA Drone Center V1 native playable 3D QA
on:
  push:
    branches: [feat/drone-center-v1-native-battle-studio-20261121]
    paths:
      - "scripts/ui/DroneCenter*.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "scripts/ui/City3DPerfProbeV7.gd"
      - "tests/test_drone_center_v1_native.gd"
      - ".github/workflows/drone-center-v1-native-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ui/DroneCenter*.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "scripts/ui/City3DPerfProbeV7.gd"
      - "tests/test_drone_center_v1_native.gd"
      - ".github/workflows/drone-center-v1-native-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drone-center-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-drone-center:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot-drone.zip
          unzip -oq /tmp/godot-drone.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          command -v xvfb-run
      - name: Validate Godot imports
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ui/BastionStudioAdapter.gd scripts/ui/ArmoredWorkshopStudioAdapterV1.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/drone-center-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/drone-center-import.log; then exit 1; fi
      - name: Native battle, 120 model variants, screenshots and fog
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_drone_center_v1_native.gd \
            2>&1 | tee /tmp/drone-center-v1.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/drone-center-v1.log; then exit 1; fi
          grep -F 'PASS DRONE CENTER V1 NATIVE:' /tmp/drone-center-v1.log
          test -s artifacts/drone_center_native_v1/report.json
          test "$(find artifacts/drone_center_native_v1 -name '*.png' | wc -l)" -eq 2
      - name: Upload real Godot images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drone-center-native-v1-mesa
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/drone_center_native_v1/
            /tmp/drone-center-import.log
            /tmp/drone-center-v1.log
