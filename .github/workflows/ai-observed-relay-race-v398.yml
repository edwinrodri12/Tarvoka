name: TARVOKA v398 observed relay race AI holdout

on:
  pull_request:
    paths:
      - "scripts/core/BasicAI.gd"
      - "tests/test_ai_observed_relay_race_v398.gd"
      - "tests/test_ai_observed_relay_race_micro_v398.gd"
      - "tests/test_ai_observed_relay_contest_v398.gd"
      - "tests/aggregate_ai_observed_relay_race_v398.py"
      - ".github/workflows/ai-observed-relay-race-v398.yml"
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Check exact unchanged default and observed-only safe legal action
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_observed_relay_race_micro_v398.gd \
            2>&1 | tee /tmp/micro398.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/micro398.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v398 micro:' /tmp/micro398.log
      - name: Validate actual contested relay move and exact road ETA
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_observed_relay_contest_v398.gd \
            2>&1 | tee /tmp/contest398.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/contest398.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v398 contested relay:' /tmp/contest398.log

  pair:
    needs: [micro]
    runs-on: ubuntu-22.04
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed_index: [0,1,2,3,4,5,6,7]
        fog: ["false","true"]
    env:
      TARVOKA_V398_SEED_INDEX: ${{ matrix.seed_index }}
      TARVOKA_V398_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Official opening with AI flag OFF and ON plus exact mirrored replay
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3350s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_observed_relay_race_v398.gd \
            2>&1 | tee /tmp/race398.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:|RACE398_MIRROR_FAILURE' /tmp/race398.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v398: 2 official-opening starters' /tmp/race398.log
          test "$(grep -c '^RACE398_RESULT ' /tmp/race398.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v398-seed${{ matrix.seed_index }}-fog${{ matrix.fog }}
          path: /tmp/race398.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [pair]
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v398-seed*
          path: .ci-v398-logs
      - name: Aggregate 32 original paired cases, 128 exact mirror games
        run: |
          set -euo pipefail
          python3 -m py_compile tests/aggregate_ai_observed_relay_race_v398.py
          python3 tests/aggregate_ai_observed_relay_race_v398.py .ci-v398-logs
          cat reports/ai_v398_observed_relay_race.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v398-observed-relay-race-report
          path: reports/ai_v398_observed_relay_race.*
          if-no-files-found: ignore
          retention-days: 30
