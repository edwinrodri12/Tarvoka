name: TARVOKA v372 relay geometry and full-round scoring (320 actual battles)

on:
  pull_request:
    paths:
      - "tests/test_ai_relay_geometry_v372.gd"
      - "tests/test_relay_fairness_contract_v372.gd"
      - "scripts/core/RelayControl.gd"
      - "tests/aggregate_ai_relay_geometry_v372.py"
      - ".github/workflows/ai-relay-fairness-v372.yml"
  workflow_dispatch:

jobs:
  self_mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10,12]
        map: [0,1,2,3]
        fog: ["false","true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run twenty self-play battles comparing five relay geometry/threshold variants
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_relay_geometry_v372.gd \
            2>&1 | tee /tmp/ai-v372-relay.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v372-relay.log; then exit 1; fi
          grep -Fq 'PASS AI relay v372:' /tmp/ai-v372-relay.log
          test "$(grep -c '^RELAY372_MATCH ' /tmp/ai-v372-relay.log)" -eq 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v372-relay-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/ai-v372-relay.log
          if-no-files-found: ignore
          retention-days: 30

  relay_round_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify 80 full-round relay score/tie contracts, both sides and saved games
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_relay_fairness_contract_v372.gd \
            2>&1 | tee /tmp/ai-v372-contract.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v372-contract.log; then exit 1; fi
          grep -Fq 'PASS relay v372 contract:' /tmp/ai-v372-contract.log
          test "$(grep -c '^RELAY372_CONTRACT ' /tmp/ai-v372-contract.log)" -eq 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v372-contract
          path: /tmp/ai-v372-contract.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [self_mirrors, relay_round_contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v372-relay-L*
          path: .ci-v372-logs
          merge-multiple: false
      - name: Aggregate 320 actual games, relay-timing traces and both original-income baselines
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_relay_geometry_v372.py .ci-v372-logs
          cat reports/ai_v372_relay_layouts.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v372-relay-layout-report
          path: reports/ai_v372_relay_layouts.*
          if-no-files-found: ignore
          retention-days: 30
