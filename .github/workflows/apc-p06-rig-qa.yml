name: TARVOKA P06 Bastion native 3D rig QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionDamage3D.gd'
      - 'scripts/ui/BastionVisualRig3D.gd'
      - 'tests/test_bastion_visual_damage.gd'
      - 'tests/test_bastion_visual_rig.gd'
      - 'tests/test_bastion_v5_studio.gd'
      - 'scripts/ui/APCArtV1.gd'
      - 'scripts/ui/APCArmorV2.gd'
      - 'scripts/ui/APCBatchingV4.gd'
      - 'scripts/ui/APCFinishV3.gd'
      - 'scripts/ui/APCDetailV5.gd'
      - 'scripts/ui/APCFinishV6.gd'
      - 'scripts/ui/APCMachineGunV7.gd'
      - 'scripts/ui/APCDamageV7.gd'
      - 'scripts/ui/APCRearDesignV10.gd'
      - 'scripts/ui/APCExteriorV11.gd'
      - 'scripts/ui/APCTurretV12.gd'
      - 'scripts/ui/APCSurfaceV13.gd'
      - 'scripts/ui/APCWheelV14.gd'
      - 'scripts/ui/APCUndercarriageV15.gd'
      - 'tests/test_bastion_v15_undercarriage.gd'
      - 'tests/test_bastion_v14_wheel_sculpt.gd'
      - 'tests/test_bastion_v13_materials.gd'
      - 'tests/test_bastion_v12_turret.gd'
      - 'tests/test_bastion_v11_exterior.gd'
      - 'tests/test_bastion_v10_rear_design.gd'
      - 'scripts/ui/APCTacticalLOD8.gd'
      - 'scripts/ui/APCDistanceLODControllerV9.gd'
      - 'scripts/ui/BattleTerrain3D.gd'
      - 'tests/test_bastion_v9_distance_motion.gd'
      - 'scripts/ui/APCWeaponAudioV8.gd'
      - 'tests/test_bastion_v8_audio.gd'
      - 'scripts/ui/BattleTerrain3D.gd'
      - 'tests/test_bastion_v8_mobile_stress.gd'
      - 'tests/test_bastion_v7_machinegun_damage.gd'
      - 'tests/test_bastion_v6_finish.gd'
      - 'scripts/ui/APCVisualRigV1.gd'
      - '.github/workflows/apc-p06-rig-qa.yml'
  workflow_dispatch:

jobs:
  native-rig:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 official Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate Bastion damage and six-wheel rig in native Godot
        shell: bash
        run: |
          set -euo pipefail
          for entry in test_bastion_visual_damage test_bastion_visual_rig test_bastion_v5_studio test_bastion_v6_finish test_bastion_v7_machinegun_damage test_bastion_v8_mobile_stress test_bastion_v8_audio test_bastion_v9_distance_motion test_bastion_v10_rear_design test_bastion_v11_exterior test_bastion_v12_turret test_bastion_v13_materials test_bastion_v14_wheel_sculpt test_bastion_v15_undercarriage; do
            # Use Mesa software OpenGL via Xvfb instead of the null headless
            # renderer (whose mesh teardown emits 'Parameter m is null').
            timeout --signal=TERM --kill-after=5s 90s \
              xvfb-run -a -s '-screen 0 1280x720x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              /tmp/Godot_v4.3-stable_linux.x86_64 \
              --rendering-method gl_compatibility --audio-driver Dummy --path . \
              --script "res://tests/${entry}.gd" 2>&1 | tee "/tmp/${entry}.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' "/tmp/${entry}.log"; then
              echo "P06 visual regression: ${entry}"; exit 1
            fi
            grep -F 'PASS ' "/tmp/${entry}.log"
          done
