name: TARVOKA AI balanced opening and initiative fairness audit

on:
  pull_request:
    paths:
      - "tests/test_ai_balanced_opening_audit_v363.gd"
      - "tests/aggregate_ai_balanced_opening_v363.py"
      - ".github/workflows/ai-balanced-opening-v363.yml"
  workflow_dispatch:

jobs:
  matched_and_mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10, 12]
        map: [0, 2]
        fog: ["false", "true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run balanced-opening crossed and self-mirrored sessions
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_balanced_opening_audit_v363.gd \
            2>&1 | tee /tmp/ai-balanced-audit.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-balanced-audit.log; then exit 1; fi
          grep -Fq 'PASS AI balanced opening v363 audit:' /tmp/ai-balanced-audit.log
          grep -Fq 'BAL363_SUMMARY ' /tmp/ai-balanced-audit.log
          test "$(grep -c '^BAL363_MATCH ' /tmp/ai-balanced-audit.log)" -eq 4
          test "$(grep -c '^BAL363_MIRROR ' /tmp/ai-balanced-audit.log)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-balanced-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/ai-balanced-audit.log
          retention-days: 30
          if-no-files-found: ignore

  assessment:
    needs: [matched_and_mirrors]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-balanced-*
          path: .ci-balanced-logs
          merge-multiple: false
      - name: Validate all 64 real games and publish initiative results
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_balanced_opening_v363.py .ci-balanced-logs
          cat reports/ai_balanced_opening_v363.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-balanced-opening-v363-study
          path: reports/ai_balanced_opening_v363.*
          retention-days: 30
          if-no-files-found: ignore
