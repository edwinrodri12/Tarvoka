name: TARVOKA A01 V9 landscape mobile Studio browser QA

on:
  pull_request:
    paths:
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'scripts/ui/AttackHelicopterTailV11.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_attack_helicopter_v9_studio.gd'
      - '.github/workflows/a01-v9-studio-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_attack_helicopter_v9_studio.gd'
      - '.github/workflows/a01-v9-studio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-studio-v9:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - name: Checkout exact published 3D Studio parent project with real scene and combined architecture
        uses: actions/checkout@v4
        with:
          ref: feat/infantry-barracks-v1-three-distinct-levels-20261116
          persist-credentials: false
      - name: Checkout proposed A01 mobile layout and published mainline 3D components
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a01-head
          persist-credentials: false
      - name: Assemble the exact published Studio inheritance and all current models
        shell: bash
        run: |
          set -euo pipefail
          # The unified Studio exists on the parent branch until it is
          # published. Overlay every current model script from this PR.
          # A stale hand-curated copy list omitted G13 and A01 V11 preloads,
          # causing false import failures unrelated to the 3D geometry.
          cp -a a01-head/scripts/ui/. scripts/ui/
          test -s scripts/ui/CombinedArtStudioWeb.gd
          test -s scripts/ui/AttackHelicopterTailV11.gd
          test -s scripts/ui/G13BodyFinishV11.gd
          cp a01-head/tests/test_attack_helicopter_v9_studio.gd tests/test_attack_helicopter_v9_studio.gd
          cp a01-head/tests/test_g13_studio_web_v1.gd tests/test_g13_studio_web_v1.gd
          sed -i 's|res://scripts/ui/CombinedArtStudioWeb.gd|res://scripts/ui/BastionStudioAdapter.gd|' scenes/UnitArtStudioWeb.tscn
          grep -F 'res://scripts/ui/BastionStudioAdapter.gd' scenes/UnitArtStudioWeb.tscn
          grep -F 'A01V9_AccesoHorizontalAndroid' scripts/ui/BastionStudioAdapter.gd
          grep -F 'AttackHelicopterSilhouetteV8.apply' scripts/ui/UnitModels3D.gd
      - name: Install actual Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip' -o /tmp/a01-godot.zip
          unzip -q /tmp/a01-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Import registered Godot 4.3 editor classes and combined Studio resources before running SceneTree QA
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --headless --editor --path . --import --quit \
            2>&1 | tee /tmp/a01-v9-editor-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed|Parse Error' /tmp/a01-v9-editor-import.log; then
            echo 'Combined Godot Studio editor import failed'; exit 1
          fi
          test -d .godot/imported
      - name: Test live Android screen rotation and capture real Godot 3D Studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a01-v9-mobile
          timeout --signal=TERM --kill-after=5s 190s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 A01_V9_CAPTURE_DIR=/tmp/a01-v9-mobile \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --resolution 960x540 --path . \
            --script res://tests/test_attack_helicopter_v9_studio.gd \
            2>&1 | tee /tmp/a01-v9-studio.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error' /tmp/a01-v9-studio.log; then
            echo 'V9 mobile Studio native Godot test failed'; exit 1
          fi
          grep -F 'PASS A01 V9 WEB MOBILE:' /tmp/a01-v9-studio.log
          test "$(find /tmp/a01-v9-mobile -maxdepth 1 -name '*.png' | wc -l)" -eq 4
      - name: Verify G13 V1 appears and articulates in the same mobile Studio
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 190s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --resolution 960x540 --path . \
            --script res://tests/test_g13_studio_web_v1.gd \
            2>&1 | tee /tmp/g13-v1-studio.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error' /tmp/g13-v1-studio.log; then
            echo 'G13 V1 mobile Studio selector/native model failed'; exit 1
          fi
          grep -F 'PASS G13 V1 LIVE STUDIO:' /tmp/g13-v1-studio.log
      - name: Archive four authentic 960x540 and 540x960 Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-v9-android-landscape-and-portrait-godot
          path: |
            /tmp/a01-v9-mobile/*.png
            /tmp/a01-v9-studio.log
            /tmp/a01-v9-editor-import.log
          retention-days: 14
          if-no-files-found: warn
