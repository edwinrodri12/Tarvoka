name: TARVOKA v371 symmetric first income opt-in backward compatibility

on:
  pull_request:
    paths:
      - "scripts/core/UrbanEconomy.gd"
      - "scripts/core/BattleSession.gd"
      - "tests/test_symmetric_first_income_optin_v371.gd"
      - ".github/workflows/symmetric-first-income-optin-v371.yml"
  workflow_dispatch:

jobs:
  optional_income_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate optional symmetric first-income rule over 32 actual cases
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_symmetric_first_income_optin_v371.gd \
            2>&1 | tee /tmp/equal-income-v371.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/equal-income-v371.log; then exit 1; fi
          grep -Fq 'PASS symmetric income opt-in v371:' /tmp/equal-income-v371.log
          test "$(grep -c '^EQUAL371_CONTRACT ' /tmp/equal-income-v371.log)" -eq 32
      - name: Retest existing SaveCodec contract with legacy default
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_save_codec.gd \
            2>&1 | tee /tmp/legacy-codec-v371.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/legacy-codec-v371.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symmetric-first-income-v371-verification
          path: |
            /tmp/equal-income-v371.log
            /tmp/legacy-codec-v371.log
          if-no-files-found: ignore
          retention-days: 30
