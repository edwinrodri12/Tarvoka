name: TARVOKA A01 V11 tail mechanics and launchers native QA

on:
  pull_request:
    paths:
      - 'scripts/ui/AttackHelicopterTailV11.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_attack_helicopter_v11.gd'
      - 'tests/test_attack_helicopter_v11_capture.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - '.github/workflows/a01-v11-tail-qa.yml'
  push:
    branches: [main, 'art/a01-v13-integration-20261117']
    paths:
      - 'scripts/ui/AttackHelicopterTailV11.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_attack_helicopter_v11.gd'
      - 'tests/test_attack_helicopter_v11_capture.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - '.github/workflows/a01-v11-tail-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a01-v11-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install original Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate V11 gearbox, articulated pitch links, pylon retainers and mobile compatibility
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 125s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v11.gd \
            2>&1 | tee /tmp/a01-v11-qa.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/a01-v11-qa.log; then
            echo 'Native V11 QA failed'; exit 1
          fi
          grep -F 'PASS A01 V11:' /tmp/a01-v11-qa.log
      - name: Capture 8 V11 angles, 4 exact V10 baselines and 4 real tail/launcher closeups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a01-v11-review
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x960x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 A01_CAPTURE_DIR=/tmp/a01-v11-review \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_attack_helicopter_v11_capture.gd \
            2>&1 | tee /tmp/a01-v11-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' /tmp/a01-v11-capture.log; then
            echo 'Native V11 16-frame rendering failed'; exit 1
          fi
          grep -F 'PASS A01 V11 CAPTURE:' /tmp/a01-v11-capture.log
          test "$(find /tmp/a01-v11-review -maxdepth 1 -name '*.png' | wc -l)" -eq 16
      - name: Archive 16 genuine Godot V11 rotor and launcher review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-a01-v11-real-godot-16-frame-review
          path: |
            /tmp/a01-v11-review/*.png
            /tmp/a01-v11-qa.log
            /tmp/a01-v11-capture.log
          if-no-files-found: warn
          retention-days: 14
