name: TARVOKA conquered fixed bases playable production and saves v1.8

on:
  pull_request:
    paths:
      - "scripts/experiments/CapturableProductionV18.gd"
      - "scripts/experiments/StrategicMapSitesV17.gd"
      - "tests/test_capturable_production_v18.gd"
      - "tests/test_fixed_producer_sites_v17.gd"
      - ".github/workflows/capturable-production-v18.yml"
  workflow_dispatch:

jobs:
  playable_capture_and_production:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Check real capture and production across fixed facilities
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_capturable_production_v18.gd \
            2>&1 | tee /tmp/tarvoka-captured-production-v18.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-captured-production-v18.log; then exit 1; fi
          grep -Fq 'PASS capturable production v18:' /tmp/tarvoka-captured-production-v18.log
      - name: Confirm updated waterfront capture without infantry on water
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_fixed_producer_sites_v17.gd \
            2>&1 | tee /tmp/tarvoka-shore-access-v18.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-shore-access-v18.log; then exit 1; fi
          grep -Fq 'PASS fixed producer sites v17:' /tmp/tarvoka-shore-access-v18.log
      - name: Archive production and shore capture verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-capturable-production-v18
          path: |
            /tmp/tarvoka-captured-production-v18.log
            /tmp/tarvoka-shore-access-v18.log
          retention-days: 30
          if-no-files-found: ignore
