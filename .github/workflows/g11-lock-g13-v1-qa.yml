name: TARVOKA G11 final art approval + G13 native mobile AA 3D V1

on:
  push:
    branches: [main, feat/g11-final-art-lock-g13-aa-visual-prototype-v1]
    paths:
      - 'scripts/ui/G13MobileAirDefenseV1.gd'
      - 'scripts/ui/G13DualDomainVisualV2.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_g11_final_lock_g13_v1.gd'
      - 'tests/test_g13_native_v1_capture.gd'
      - 'G11_FINAL_ART_APPROVAL_V33.md'
      - '.github/workflows/g11-lock-g13-v1-qa.yml'
  pull_request:
    paths:
      - 'scripts/ui/G13MobileAirDefenseV1.gd'
      - 'scripts/ui/G13DualDomainVisualV2.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/BastionStudioAdapter.gd'
      - 'tests/test_g11_final_lock_g13_v1.gd'
      - 'tests/test_g13_native_v1_capture.gd'
  workflow_dispatch:

jobs:
  approved-g11-new-g13-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Confirm final V33 and all eight G13 AA 3D faction variants
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 220s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_final_lock_g13_v1.gd 2>&1 | tee /tmp/g13_v1_native.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g13_v1_native.log; then
            echo 'G11 approval or G13 real 3D geometry/rig regression'; exit 1
          fi
          grep -F 'PASS G11 LOCK + G13 V1:' /tmp/g13_v1_native.log
      - name: Render 16 actual G13 V1 eight-faction poses and angles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v1-gallery
          timeout --signal=TERM --kill-after=5s 220s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V1_CAPTURE_DIR=/tmp/g13-v1-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g13_native_v1_capture.gd 2>&1 | tee /tmp/g13_v1_capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g13_v1_capture.log; then
            echo 'Native G13 original eight-faction render failed'; exit 1
          fi
          grep -F 'PASS G13 V1 CAPTURE:' /tmp/g13_v1_capture.log
          test "$(find /tmp/g13-v1-gallery -name '*.png' | wc -l)" -eq 16
      - name: Upload actual G13 3D concept inspection snapshots
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-g13-v1-16-godot-native-3d-faction-and-articulation-shots
          path: /tmp/g13-v1-gallery/*.png
          retention-days: 14
