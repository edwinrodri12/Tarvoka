name: TARVOKA Android landscape config contract

on:
  pull_request:
    paths:
      - "project.godot"
      - "tests/test_android_landscape_config.py"
      - ".github/workflows/android-landscape-config.yml"
  workflow_dispatch:

jobs:
  landscape-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate landscape and mobile rendering settings
        run: python3 -m unittest discover -s tests -p 'test_android_landscape_config.py' -v
