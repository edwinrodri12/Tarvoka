name: TARVOKA v29 adaptive antiarmor composition tournament

on:
  pull_request:
    paths:
      - "scripts/experiments/StrategicMatchBalanceV21.gd"
      - "tests/test_adaptive_counter_army_v29.gd"
      - ".github/workflows/adaptive-counter-v29.yml"
  workflow_dispatch:

jobs:
  adaptive_counter_matches:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: [small_open, medium_open, medium_forest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: 12 mirrored normal vs spam vs conditional-counter battles
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_adaptive_counter_army_v29.gd \
            -- ${{ matrix.scenario }} \
            2>&1 | tee /tmp/v29-adaptive.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v29-adaptive.log; then exit 1; fi
          grep -Fq 'PASS v29 adaptive Rompedor AI tournament:' /tmp/v29-adaptive.log
      - name: Save per-battle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-v29-${{ matrix.scenario }}
          path: /tmp/v29-adaptive.log
          retention-days: 30
          if-no-files-found: ignore
