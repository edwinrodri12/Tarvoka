name: TARVOKA v400 opportunity-cost strategic AI holdout

on:
  pull_request:
    paths:
      - "scripts/core/BasicAI.gd"
      - "scripts/core/OpportunityCostV400.gd"
      - "tests/test_ai_opportunity_cost_micro_v400.gd"
      - "tests/test_ai_opportunity_cost_holdout_v400.gd"
      - "tests/aggregate_ai_opportunity_cost_v400.py"
      - ".github/workflows/ai-opportunity-cost-v400.yml"
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3 stable
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify city income/relay emergency/recruit, default OFF, save and mirrors
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 680s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_opportunity_cost_micro_v400.gd \
            2>&1 | tee /tmp/opportunity-v400-micro.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/opportunity-v400-micro.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v400 micro:' /tmp/opportunity-v400-micro.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v400-micro-diagnostic
          path: /tmp/opportunity-v400-micro.log
          if-no-files-found: ignore
          retention-days: 30

  pair:
    needs: [micro]
    runs-on: ubuntu-22.04
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed_index: [0,1,2,3,4,5,6,7]
        fog: ["false","true"]
    env:
      TARVOKA_V400_SEED_INDEX: ${{ matrix.seed_index }}
      TARVOKA_V400_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Official, raw relay and economic arbitration on original/true mirrored battles
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3360s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_opportunity_cost_holdout_v400.gd \
            2>&1 | tee /tmp/opportunity-v400.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:|MIRROR_FAILURE' /tmp/opportunity-v400.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v400: 3 matched AI policies' /tmp/opportunity-v400.log
          test "$(grep -c '^OPPORTUNITY400_RESULT ' /tmp/opportunity-v400.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v400-seed${{ matrix.seed_index }}-fog${{ matrix.fog }}
          path: /tmp/opportunity-v400.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [pair]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v400-seed*
          path: .ci-v400-logs
      - name: Strictly audit 32 new paired cases with three AI policies
        run: |
          set -euo pipefail
          python3 -m py_compile tests/aggregate_ai_opportunity_cost_v400.py
          python3 tests/aggregate_ai_opportunity_cost_v400.py .ci-v400-logs
          cat reports/ai_v400_opportunity_cost.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v400-opportunity-cost-report
          path: reports/ai_v400_opportunity_cost.*
          if-no-files-found: ignore
          retention-days: 30
