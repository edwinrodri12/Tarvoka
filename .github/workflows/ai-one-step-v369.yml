name: TARVOKA v369 one-tile fourth move research (96 real battles)

on:
  pull_request:
    paths:
      - "tests/test_ai_one_step_opening_v369.gd"
      - "tests/test_ai_one_step_contract_v369.gd"
      - "tests/LimitedFourthStepV369.gd"
      - "tests/aggregate_ai_one_step_v369.py"
      - ".github/workflows/ai-one-step-v369.yml"
  workflow_dispatch:

jobs:
  self_mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10,12]
        map: [0,2]
        fog: ["false","true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run twelve real self-play games with a one-cell fourth order
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_one_step_opening_v369.gd \
            2>&1 | tee /tmp/ai-v369-one-step.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v369-one-step.log; then exit 1; fi
          grep -Fq 'PASS AI one-step v369:' /tmp/ai-v369-one-step.log
          test "$(grep -c '^STEP369_MATCH ' /tmp/ai-v369-one-step.log)" -eq 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v369-step-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/ai-v369-one-step.log
          if-no-files-found: ignore
          retention-days: 30

  opening_budget_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Check one-cell move legality in both maps, fog and both first players
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_one_step_contract_v369.gd \
            2>&1 | tee /tmp/ai-v369-contract.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v369-contract.log; then exit 1; fi
          grep -Fq 'PASS AI one-step v369 contract:' /tmp/ai-v369-contract.log
          test "$(grep -c '^STEP369_CONTRACT ' /tmp/ai-v369-contract.log)" -eq 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v369-contract
          path: /tmp/ai-v369-contract.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [self_mirrors, opening_budget_contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v369-step-L*
          path: .ci-v369-logs
          merge-multiple: false
      - name: Aggregate 96 genuine one-cell fights, first3 parity and cap3/cap4 baselines
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_one_step_v369.py .ci-v369-logs
          cat reports/ai_v369_one_step.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v369-one-step-report
          path: reports/ai_v369_one_step.*
          if-no-files-found: ignore
          retention-days: 30
