name: TARVOKA experimental defensive capture AI v0.2

on:
  pull_request:
    paths:
      - "scripts/experiments/CaptureExperimentV01.gd"
      - "scripts/experiments/CaptureThreatsV02.gd"
      - "scripts/experiments/CaptureAwareAIV01.gd"
      - "scripts/experiments/CaptureDefensiveAIV02.gd"
      - "tests/test_capture_defense_v02.gd"
      - ".github/workflows/capture-defense-v02.yml"
  workflow_dispatch:

jobs:
  defend_capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify defender decisions and reset of substituted capture holder
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 480s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_capture_defense_v02.gd \
            2>&1 | tee /tmp/tarvoka-capture-defense-v02.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-capture-defense-v02.log; then
            echo 'Capture defensive AI experiment failed'; exit 1
          fi
          grep -Fq 'PASS capture defense v02:' /tmp/tarvoka-capture-defense-v02.log
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-capture-defense-v02
          path: /tmp/tarvoka-capture-defense-v02.log
          retention-days: 30
          if-no-files-found: ignore
