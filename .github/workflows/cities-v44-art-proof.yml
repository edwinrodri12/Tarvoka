name: TARVOKA V49 — ciudades 3D aisladas con evidencias reales

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cities-v44-art-proof.yml"
  workflow_run:
    workflows:
      - Publish TARVOKA native 3D art studio
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-native-city-art:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Leer modelos 3D nativos de la rama de arte
        uses: actions/checkout@v4
        with:
          ref: art/cities-v8-rear-facades-rooftops-20261117

      - name: Registrar la revisión exacta de las ciudades (V46)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/city-v44-evidence
          git rev-parse HEAD | tee build/city-v44-evidence/source-art-commit.txt
          printf 'source branch: %s\n' "$(git branch --show-current)" >> build/city-v44-evidence/source-art-commit.txt
          printf 'event: %s\n' "$GITHUB_EVENT_NAME" >> build/city-v44-evidence/source-art-commit.txt
          echo "ART_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Preparar Godot 4.3 y renderizador Mesa GL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libglu1-mesa
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot-v44.zip
          unzip -qo /tmp/godot-v44.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          test -x /tmp/Godot_v4.3-stable_linux.x86_64
          test -s scripts/ui/CivilianCityArtReviewV42.gd
          test -s scripts/ui/CivilianCityArtEvidenceV43.gd
          test -s scripts/ui/CivilianCityVisualProofV44.gd
          test -s scripts/ui/CivilianCityDesignStudioV43.gd
          test -s scenes/CivilianCityDesignStudioV43.tscn

      - name: Construir sandbox Godot V49 solo con ciudades civiles
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/ci/civilian_city_render_sandbox_v49.py
          python3 scripts/ci/civilian_city_render_sandbox_v49.py
          test -s build/city-v49-sandbox/project.godot
          echo "CITY_REVIEW_PROJECT=$PWD/build/city-v49-sandbox" >> "$GITHUB_ENV"

      - name: Comprobar importación y compilación de scripts de Godot
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path "$CITY_REVIEW_PROJECT" --import --quit \
            2>&1 | tee build/city-v44-evidence/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed loading resource:|ERROR:.*(Parse|Script|Resource)' \
              build/city-v44-evidence/godot-import.log; then
            exit 1
          fi

      - name: Capturar Villa Ciudad y Metrópoli D0-D4 (no jugabilidad)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --path "$CITY_REVIEW_PROJECT" --rendering-method gl_compatibility \
            --script res://scripts/ui/CivilianCityVisualProofV44.gd \
            2>&1 | tee build/city-v44-evidence/godot-render.log
          engine_result=${PIPESTATUS[0]}
          set -e
          if [ -d "$CITY_REVIEW_PROJECT/build/city-v44-evidence" ]; then
            cp -a "$CITY_REVIEW_PROJECT/build/city-v44-evidence/." build/city-v44-evidence/
          fi
          if [ "$engine_result" -ne 0 ]; then
            echo "::error::Isolated Godot city render failed ($engine_result)"
            exit "$engine_result"
          fi
          test "$(find build/city-v44-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 24
          test -s build/city-v44-evidence/manifest.json
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed loading resource:|ERROR:.*(Parse|Script|Resource)' \
              build/city-v44-evidence/godot-render.log; then
            exit 1
          fi

      - name: Preparar galería para revisión humana, incluso con fallos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json

          folder=Path("build/city-v44-evidence")
          folder.mkdir(parents=True, exist_ok=True)
          manifest=folder/"manifest.json"
          data={}
          if manifest.exists():
              try:
                  data=json.loads(manifest.read_text(encoding="utf-8"))
              except (ValueError, OSError):
                  pass
          items={(str(i.get("tier")),int(i.get("damage",-1))):i
                 for i in data.get("screenshots",[])
                 if isinstance(i,dict)}
          cards=[]
          for tier in ("Villa","Ciudad","Metropoli"):
              for damage in range(5):
                  cameras=[("","Vista táctica")]
                  if damage in (0,2,4):
                      cameras.append(("_reverse","Vista posterior"))
                  for suffix,label in cameras:
                      png=f"{tier}_D{damage}{suffix}.png"
                      entry=next((i for i in data.get("screenshots",[])
                                  if i.get("png")==png),{})
                      if not (folder/png).exists():
                          cards.append(f'<section><h2>{tier} D{damage}: {label}</h2><p>Sin captura — revisar registros</p></section>')
                          continue
                      metrics=(f'Cobertura: {float(entry.get("coverage",0)):.2%} · '
                               f'Varianza: {float(entry.get("variance",0)):.5f} · '
                               f'Alertas: {entry.get("v42_geometry_findings","?")} / '
                               f'{entry.get("v43_art_findings","?")}')
                      findings='; '.join(v for v in
                          (entry.get("geometry_messages",""),entry.get("art_messages",""))
                          if v)
                      cards.append(f'<section><h2>{tier} D{damage} · {label}</h2>'
                                   f'<img alt="{tier} D{damage} {label}" src="{png}">'
                                   f'<p>{html.escape(metrics)}</p>'
                                   f'<p>{html.escape(findings)}</p></section>')
          page=('<html lang="es"><meta charset="utf-8"><meta name="viewport" '
                'content="width=device-width,initial-scale=1"><title>TARVOKA V44</title>'
                '<style>body{font:15px system-ui;background:#13202a;color:#eef3f5;'
                'padding:20px}main{display:grid;grid-template-columns:'
                'repeat(auto-fit,minmax(280px,1fr));gap:16px}'
                'section{padding:12px;background:#223744;border-radius:10px}'
                'img{width:100%;border-radius:6px}p{font-size:13px}</style>'
                '<h1>TARVOKA · CIUDADES V44 · EVIDENCIA VISUAL</h1>'
                '<p>Capturas reales de Godot, sin aprobación artística automática. '
                'Revisar las 24 imágenes antes de finalizar los modelos.</p><main>'
                +''.join(cards)+'</main></html>')
          (folder/"index.html").write_text(page,encoding="utf-8")
          PY

      - name: Montar comparativas 3D con las capturas reales disponibles
        if: always()
        shell: bash
        run: |
          python3 -m pip install -q --disable-pip-version-check Pillow || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("build/city-v44-evidence")
          root.mkdir(parents=True,exist_ok=True)
          try:
              from PIL import Image, ImageDraw
          except ImportError:
              (root/"contact-sheet-status.txt").write_text(
                  "Pillow unavailable: individual PNG files and index.html remain available",
                  encoding="utf-8")
              raise SystemExit(0)
          entries=[]
          for tier in ("Villa","Ciudad","Metropoli"):
              for damage in range(5):
                  for suffix in (("",) if damage not in (0,2,4) else ("","_reverse")):
                      entries.append((tier,damage,suffix))
          # Contact sheet is an arrangement of genuine engine screenshots,
          # never an illustration or a synthetic model preview.
          cell_w,cell_h=390,250
          sheet=Image.new("RGB",(cell_w*4,cell_h*6),(18,30,40))
          draw=ImageDraw.Draw(sheet)
          for i,(tier,damage,suffix) in enumerate(entries):
              x=(i%4)*cell_w
              y=(i//4)*cell_h
              filename=f"{tier}_D{damage}{suffix}.png"
              draw.text((x+10,y+5),f"{tier} | D{damage} | {'POSTERIOR' if suffix else 'PRINCIPAL'}",
                        fill=(245,220,163))
              path=root/filename
              if not path.exists():
                  draw.text((x+14,y+70),"SIN CAPTURA - REVISAR LOGS",fill=(239,140,122))
                  continue
              try:
                  with Image.open(path) as frame:
                      frame=frame.convert("RGB")
                      frame.thumbnail((cell_w-18,cell_h-40))
                      sheet.paste(frame,(x+(cell_w-frame.width)//2,y+25))
              except (OSError,ValueError):
                  draw.text((x+14,y+70),"PNG INVALIDO",fill=(239,140,122))
          sheet.save(root/"comparativa-24-vistas.png")
          # Three level-specific sheets, easier to inspect at full size.
          for tindex,tier in enumerate(("Villa","Ciudad","Metropoli")):
              out=Image.new("RGB",(cell_w*3,cell_h*3),(18,30,40))
              d=ImageDraw.Draw(out)
              group=[(dd,ss) for name,dd,ss in entries if name==tier]
              for k,(damage,suffix) in enumerate(group):
                  x=(k%3)*cell_w
                  y=(k//3)*cell_h
                  d.text((x+10,y+5),f"{tier} D{damage} {'POSTERIOR' if suffix else 'PRINCIPAL'}",
                         fill=(245,220,163))
                  pic=root/f"{tier}_D{damage}{suffix}.png"
                  if pic.is_file():
                      try:
                          with Image.open(pic) as frame:
                              frame=frame.convert("RGB")
                              frame.thumbnail((cell_w-18,cell_h-40))
                              out.paste(frame,(x+(cell_w-frame.width)//2,y+25))
                      except (OSError,ValueError):
                          d.text((x+14,y+70),"PNG INVALIDO",fill=(239,140,122))
                  else:
                      d.text((x+14,y+70),"SIN CAPTURA",fill=(239,140,122))
              out.save(root/f"comparativa-{tier.lower()}.png")
          print("V47: montage created from actual Godot images; no artificial rendering")
          PY

      - name: Mostrar resumen de 24 vistas y errores en GitHub Actions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          folder=Path("build/city-v44-evidence")
          file=folder/"manifest.json"
          import os
          print("## TARVOKA · Ciudades V46 · Evidencia de Godot 4.3")
          print("")
          source=folder/"source-art-commit.txt"
          print("Fuente artística: `"+(source.read_text(encoding="utf-8").splitlines()[0] if source.exists() else "No disponible")+"`")
          print("Ejecución: `"+os.getenv("GITHUB_RUN_ID","desconocida")+"`")
          print("")
          print("**Estado: pendiente de revisión artística humana, sin aprobación automática.**")
          print("")
          if not file.exists():
              print("No se generó el manifiesto. Revisar godot-import.log y godot-render.log en el artefacto.")
              for name in ("godot-import.log","godot-render.log"):
                  log=folder/name
                  if log.exists():
                      print("\n### Últimos errores de "+name)
                      lines=log.read_text(encoding="utf-8",errors="replace").splitlines()
                      for line in [x for x in lines if any(word in x for word in ("ERROR","Parse Error","SCRIPT ERROR","Failed loading"))][-12:]:
                          print("- "+line[:300])
          else:
              try:
                  data=json.loads(file.read_text(encoding="utf-8"))
              except (ValueError,OSError) as exc:
                  print("Manifiesto ilegible:",str(exc))
              else:
                  print(f'Capturas: {data.get("count",0)} / 24 · Errores: {data.get("errors","?")}')
                  print("")
                  print("| Modelo | Daño | Cámara | Imagen válida | Alertas geométricas | Alertas artísticas |")
                  print("|---|---|---|---|---:|---:|")
                  for img in data.get("screenshots",[]):
                      if img.get("framing_warning"):
                          print(f'**POSIBLE ERROR DE ENCUADRE:** {img.get("tier")} D{img.get("damage")} / {img.get("camera")} (centro {float(img.get("center_coverage",0)):.1%})')
                      print(f'| {img.get("tier","?")} | D{img.get("damage","?")} | '
                            f'{img.get("camera","?")} | '
                            f'{"Sí" if img.get("nonempty") else "No"} | '
                            f'{img.get("v42_geometry_findings","?")} | '
                            f'{img.get("v43_art_findings","?")} |')
          print("")
          print("Las capturas y la galería index.html están en el artefacto ciudades-v44-godot-capturas-arte.")
          PY

      - name: Guardar capturas, galería, manifest y registros aunque haya fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudades-v44-godot-capturas-arte
          path: build/city-v44-evidence/
          if-no-files-found: warn
          retention-days: 14
