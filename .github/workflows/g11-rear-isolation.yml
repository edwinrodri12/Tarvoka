name: TARVOKA G11 isolate rear square plate

on:
  push:
    branches: [feat/g11-v30-rear-track-clearance-and-rocket-trails]
    paths:
      - 'tests/test_g11_rear_isolation_v30_capture.gd'
      - '.github/workflows/g11-rear-isolation.yml'
  workflow_dispatch:

jobs:
  isolate-rear-parts:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Render 30 isolated source meshes at identical real camera angles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g11-rear-isolation
          timeout --signal=TERM --kill-after=5s 185s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G11_REAR_ISOLATE_DIR=/tmp/g11-rear-isolation \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g11_rear_isolation_v30_capture.gd 2>&1 | tee /tmp/g11_rear_isolation.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/g11_rear_isolation.log; then
            echo 'G11 rear forensic geometry capture failed'; exit 1
          fi
          grep -F 'PASS G11 REAR ISOLATION:' /tmp/g11_rear_isolation.log
          test "$(find /tmp/g11-rear-isolation -name '*.png' | wc -l)" -eq 30
      - name: Upload real rear geometry comparison
        uses: actions/upload-artifact@v4
        with:
          name: g11-v30-30-rear-part-isolation-captures
          path: /tmp/g11-rear-isolation/*.png
          retention-days: 7
