name: TARVOKA armored workshop playable battle visual QA
on:
  push:
    branches:
      - art/armored-workshop-v1-20261119
    paths:
      - "scripts/ui/ArmoredWorkshopBattle3D.gd"
      - "scripts/ui/ArmoredWorkshopBattleLOD.gd"
      - "scripts/ui/BattleTerrain3D.gd"
      - "scripts/ui/ArmoredWorkshopMobileLOD3D.gd"
      - "scripts/ui/ArmoredWorkshop3DV2.gd"
      - "tests/test_armored_workshop_live_battle_v1.gd"
      - "tests/capture_armored_workshop_live_battle_v1.gd"
      - ".github/workflows/armored-workshop-live-battle-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-live-battle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-modern-map:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Godot 4.3 and software OpenGL
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/tarvoka-godot.zip
          unzip -oq /tmp/tarvoka-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          command -v xvfb-run
      - name: Import real 3D modern battle with workshop art
        run: |
          set -euo pipefail
          # The shared multi-branch Web adapter extends scripts that are
          # assembled during Pages export. It is irrelevant to battle QA.
          rm -f scripts/ui/ArmoredWorkshopStudioAdapterV1.gd scripts/ui/BastionStudioAdapter.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 \
            --headless --editor --path . --import --quit \
            2>&1 | tee /tmp/workshop-live-import.log
      - name: Test actual modern armor_plant with fog, 3 visual tiers and 5 damage stages
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_armored_workshop_live_battle_v1.gd \
            2>&1 | tee /tmp/workshop-live-battle.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' \
              /tmp/workshop-live-battle.log; then exit 1; fi
          grep -F 'PASS WORKSHOP LIVE BATTLE:' /tmp/workshop-live-battle.log
      - name: Capture seven screenshots of REAL existing 3D battle armor sites
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/capture_armored_workshop_live_battle_v1.gd \
            2>&1 | tee /tmp/workshop-live-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' \
              /tmp/workshop-live-capture.log; then exit 1; fi
          grep -F 'PASS WORKSHOP LIVE BATTLE SCREENSHOTS:' /tmp/workshop-live-capture.log
          test "$(find qa_artifacts/armored_workshop_real_battle -name '*.png' | wc -l)" -eq 7
          test -s qa_artifacts/armored_workshop_real_battle/manifest.json
      - name: Upload inspectable real-battle 3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armored-workshop-live-battle-seven-real-scenes
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa_artifacts/armored_workshop_real_battle/
            /tmp/workshop-live-import.log
            /tmp/workshop-live-battle.log
            /tmp/workshop-live-capture.log
