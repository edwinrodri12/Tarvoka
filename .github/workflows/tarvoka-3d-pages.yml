jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    outputs:
      studio_source: ${{ steps.studio_identity.outputs.source_commit }}
      studio_bundle: ${{ steps.studio_identity.outputs.bundle_sha256 }}
    steps:
      - name: Check out native HQ V21 complete rear geometry and staged hit animation studio with nine original Android HQ V15 sprites
        uses: actions/checkout@v4
        with:
          ref: feat/infantry-barracks-v5-final-corner-clearance-20261116
          persist-credentials: false
      - name: Retrieve the exact nine V15 sprites shipped by Android
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.ref == 'refs/heads/main' && github.event_name != 'workflow_run' || github.ref == 'refs/heads/feat/campamentos-visor-integrado-20261123' || github.ref == 'refs/heads/art/camp-supply-v4-20261124' || github.ref == 'refs/heads/art/camp-recon-v3-20261124' || github.ref == 'refs/heads/art/camp-defense-v3-20261125' || github.ref == 'refs/heads/art/camp-medical-v3-20261125' || github.ref == 'refs/heads/art/destroyer-hull-v1-20261125' || github.ref == 'refs/heads/art/m01-patrol-v1-20261126') && github.sha || 'main' }}
          path: hq-android-v15
          persist-credentials: false
      - name: Include V15 source PNGs in the HQ 3D showroom before import
        shell: bash
        run: |
          set -euo pipefail
          # Never silently suppress missing model or test files: print the
          # exact command if any source used by the combined Studio is absent.
          trap 'echo "::error::3D studio source-preparation failure at line $LINENO: $BASH_COMMAND" >&2' ERR
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png"
            cp "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s hq-android-v15/assets/buildings/hq_v15/hq_neutral.png
          cp hq-android-v15/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          # The publisher keeps the complete HQ/Airbase/G09 web studio from its
          # release branch. Only P06 model/animation files and an additive
          # subclass adapter come from main; no building assets are replaced.
          for item in UnitModels3D.gd InfantryFamilyV1.gd InfantrySculptFinishV2.gd InfantryVariantsV4.gd InfantryEngineerSilhouetteV5.gd InfantryEngineerFinishV6.gd InfantryEngineerCompletenessV7.gd InfantryEngineerPremiumV8.gd InfantryEngineerFinishV9.gd InfantryEngineerAnatomyV10.gd InfantryEngineerMechanicsV11.gd InfantryEngineerDorsalV12.gd InfantryEngineerSmoothV13.gd InfantryEngineerContourV14.gd InfantryEngineerGearV15.gd InfantryEngineerSilhouetteV16.gd InfantryEngineerOuterArmorV17.gd InfantryCampRosterV1.gd AttackHelicopterV1.gd AttackHelicopterCabinV2.gd AttackHelicopterRotorV3.gd AttackHelicopterEnginesV4.gd AttackHelicopterLandingV5.gd AttackHelicopterLandingFinishV6.gd AttackHelicopterReadabilityV7.gd AttackHelicopterSilhouetteV8.gd AttackHelicopterFinishV10.gd AttackHelicopterTailV11.gd AttackHelicopterNoseV12.gd AttackHelicopterDamageV13.gd AttackHelicopterFactionV14.gd AttackHelicopterCombatFXV14.gd AttackHelicopterNightStudioV144.gd AttackHelicopterRotorMountV145.gd AttackHelicopterRotorDampersV146.gd AttackHelicopterDamperFinishV147.gd AttackHelicopterPitchHingesV148.gd AttackHelicopterRotorAnchorsV149.gd AttackHelicopterRotorContactV1410.gd AttackHelicopterBladeRootsV1411.gd AttackHelicopterBladeSeamV1412.gd AttackHelicopterHubCrownV1413.gd AttackHelicopterHubWreckV1414.gd AttackHelicopterHubCutFinishV1415.gd BastionVisualRig3D.gd BastionDamage3D.gd BastionStudioAdapter.gd APCArtV1.gd APCArmorV2.gd APCBatchingV4.gd APCFinishV3.gd APCDetailV5.gd APCFinishV6.gd APCMachineGunV7.gd APCDamageV7.gd APCRearDesignV10.gd APCExteriorV11.gd APCTurretV12.gd APCSurfaceV13.gd APCWheelV14.gd APCUndercarriageV15.gd APCJointFinishV16.gd APCContourV17.gd APCWheelwellV18.gd APCUnifiedFlankV19.gd APCMicrodetailV20.gd APCMaterialFinishV21.gd APCWeatherFinishV22.gd APCTireFinishV23.gd APCRubberArchV24.gd APCClosedTiresV25.gd APCTacticalLOD8.gd APCDistanceLODControllerV9.gd APCWeaponAudioV8.gd APCVisualRigV1.gd G11Art3D.gd G11VisualRig3D.gd G11FinishV2.gd G11SurfaceV3.gd G11GeometryV4.gd G11MechanicsV5.gd G11DamageSculptV6.gd G11DamageAtmosphereV7.gd G11SequentialSalvoV8.gd G11ExhaustV9.gd G11CooldownV10.gd G11ArmorFinishV11.gd G11CabChassisV12.gd G11TracksFactionV13.gd G11MechanicalDetailV14.gd G11AftPodFinishV15.gd G11FrontFrameV16.gd G11SurfaceWeatherV17.gd G11TrackAssemblyV18.gd G11TrackFinishV19.gd G11WheelSuspensionV20.gd G11ShockMountFinishV21.gd G11SuspensionJointsV22.gd G11JointFinishV23.gd G11MobileLOD.gd G11TacticalReadabilityV24.gd G11BattleLODControllerV25.gd G11BattleContextV25.gd G11RocketFaceReadabilityV25.gd G11TacticalPaintReadabilityV27.gd G11CameraIdentityV28.gd G11BattleActionsV29.gd G11RearUndercarriageV30.gd G11RocketTrailsV30.gd G11RocketFlightV31.gd G11RunningGearV32.gd G11FinalAuditV33.gd G13MobileAirDefenseV1.gd G13DetailV2.gd G13GroundAirFinishV4.gd G13UndercarriageV6.gd G13WheelFinishV7.gd G13SurfaceFinishV8.gd G13SilhouetteV10.gd InfantryBarracksBattle3D.gd InfantryBarracksWindowShadeV11.gd VisualStyle.gd FactionIdentity.gd CommandCityArtV14.gd HeadquartersBattle3D.gd HeadquartersCurvedRoof3D.gd HeadquartersBattleAccents3D.gd HeadquartersMapLOD3D.gd BattleTerrain3D.gd TerrainVisualMapBridge3D.gd TerrainSurfaceFinish3D.gd TerrainSurfaceSampler3D.gd TerrainStudioRoadShore3D.gd TerrainStudioSnowPaletteV15.gd WinterBattleBiome.gd; do
            if [ ! -s "hq-android-v15/scripts/ui/${item}" ]; then echo "::error::Missing combined Studio file: ${item}"; exit 1; fi
            cp "hq-android-v15/scripts/ui/${item}" "scripts/ui/${item}"
          done
          # The pinned HQ 3D release scene predates the Workshop battle
          # integration. Its Studio adapter now preloads these two real
          # mainline battle/LOD scripts. Ship them from the SAME tested main
          # snapshot as the infantry V2 models; otherwise web export fails
          # with missing ArmoredWorkshopBattle3D and BattleLOD.
          # Current unified Workshop Studio adapter preloads newer playable
          # production buildings. Preserve the whole dependency closure from
          # the SAME main/PR checkout (never from pinned old HQ branch).
          for battle_part in ArmoredWorkshopBattle3D.gd ArmoredWorkshopBattleLOD.gd AirbaseMapLODV4.gd AirbaseBattle3D.gd AirbaseBattleLOD.gd NavalBaseTactical3D.gd NavalBaseBattle3D.gd NavalBaseBattleLOD.gd DroneCenterModel3D.gd DroneCenterBattle3D.gd DroneCenterBattleLOD.gd; do
            test -s "hq-android-v15/scripts/ui/$battle_part"
            cp "hq-android-v15/scripts/ui/$battle_part" "scripts/ui/$battle_part"
            test -s "scripts/ui/$battle_part"
          done
          # HQ V24 in MAIN introduced HeadquartersBattle3D as a dependency of
          # the real map's BattleTerrain3D. The pinned Studio release checkout
          # predates HQ V24: importing the now-current BattleTerrain3D without
          # its 4 related HQ scripts made the *main push* Pages build fail,
          # although the PR isolated build succeeded. Ship the whole closure
          # from the same source commit as the current battle renderer.
          # Older PR snapshots legitimately have no HeadquartersBattle3D
          # reference; leave their existing HQ V21 Studio art unmodified.
          if grep -Fq 'res://scripts/ui/HeadquartersBattle3D.gd' scripts/ui/BattleTerrain3D.gd; then
            for hq_part in HeadquartersBattle3D.gd HeadquartersMapLOD3D.gd HeadquartersCurvedRoof3D.gd HeadquartersBattleAccents3D.gd CommandCityArtV14.gd; do
              test -s "hq-android-v15/scripts/ui/$hq_part"
              cp "hq-android-v15/scripts/ui/$hq_part" "scripts/ui/$hq_part"
              test -s "scripts/ui/$hq_part"
            done
            test -s scripts/ui/HeadquartersMapLOD3D.gd
            test -s scripts/ui/FactionIdentity.gd
          fi
          test -s scripts/ui/ArmoredWorkshopBattle3D.gd
          test -s scripts/ui/ArmoredWorkshopBattleLOD.gd
          test -s scripts/ui/InfantryFamilyV1.gd
          test -s scripts/ui/InfantrySculptFinishV2.gd
          test -s scripts/ui/InfantryVariantsV4.gd
          test -s scripts/ui/InfantryEngineerSilhouetteV5.gd
          test -s scripts/ui/InfantryEngineerFinishV6.gd
          test -s scripts/ui/InfantryEngineerCompletenessV7.gd
          test -s scripts/ui/InfantryEngineerPremiumV8.gd
          test -s scripts/ui/InfantryEngineerFinishV9.gd
          test -s scripts/ui/InfantryEngineerAnatomyV10.gd
          test -s scripts/ui/InfantryEngineerMechanicsV11.gd
          test -s scripts/ui/InfantryEngineerDorsalV12.gd
          test -s scripts/ui/InfantryEngineerSmoothV13.gd
          test -s scripts/ui/InfantryEngineerContourV14.gd
          test -s scripts/ui/InfantryEngineerGearV15.gd
          test -s scripts/ui/InfantryEngineerSilhouetteV16.gd
          test -s scripts/ui/InfantryEngineerOuterArmorV17.gd
          test -s scripts/ui/InfantryCampRosterV1.gd
          test -s hq-android-v15/tests/test_infantry_family_v2.gd
          cp hq-android-v15/tests/test_infantry_family_v2.gd tests/test_infantry_family_v2.gd
          test -s hq-android-v15/tests/test_infantry_studio_v2_review.gd
          cp hq-android-v15/tests/test_infantry_studio_v2_review.gd tests/test_infantry_studio_v2_review.gd
          test -s hq-android-v15/tests/test_infantry_family_v1.gd
          cp hq-android-v15/tests/test_infantry_family_v1.gd tests/test_infantry_family_v1.gd
          grep -Fq "InfantryFamily.build" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryFinishV2.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV6.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV7.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV8.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV9.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV10.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV11.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV12.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV16.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV17.apply" scripts/ui/UnitModels3D.gd
          grep -Fq "InfantryEngineerV9.sync" scripts/ui/UnitModels3D.gd
          grep -Fq "EngineerFinishV6.pose" scripts/ui/BastionStudioAdapter.gd
          grep -Fq "InfantryV1.supports" scripts/ui/BastionStudioAdapter.gd
          # G13 is actively evolving. A fixed V1/V4/V8 file list leaves
          # newest sculpt/rig modules (such as G13SilhouetteV10.gd) missing
          # after UnitModels3D.gd from main references them. Overlay every
          # versioned G13 native script from the exact same main snapshot.
          # Import ALL current A01 components as a cohesive set. A fixed
          # v14.13 list caused missing preloads when later hub parts landed
          # in main, breaking every combined G13 Studio test on web export.
          for heli_source in hq-android-v15/scripts/ui/AttackHelicopter*.gd; do
            test -s "$heli_source"
            cp "$heli_source" scripts/ui/
          done
          for g13_source in hq-android-v15/scripts/ui/G13*.gd; do
            test -s "$g13_source"
            cp "$g13_source" scripts/ui/
          done
          # G16 supply art must be shipped alongside the current model
          # factory/Studio adapter. Keep the regular unified inspector.
          for g16_source in hq-android-v15/scripts/ui/G16*.gd; do
            test -s "$g16_source"
            cp "$g16_source" scripts/ui/
          done
          # A01 uses the identical original Godot 3D catalogue, but a
          # distinct unarmed reconnaissance mesh. Bring PR/main revisions
          # from the same checkout as UnitModels3D and BastionStudioAdapter.
          test -s hq-android-v15/scripts/ui/A01ReconDroneV1.gd
          test -s hq-android-v15/scripts/ui/A01ReconFinishV2.gd
          test -s hq-android-v15/scripts/ui/A01ReconFinishV3.gd
          test -s hq-android-v15/scripts/ui/A01ReconAirfoilV4.gd
          test -s hq-android-v15/scripts/ui/A01ReconTailV5.gd
          test -s hq-android-v15/scripts/ui/A01ReconDamageV6.gd
          test -s hq-android-v15/scripts/ui/A01ReconAtmosphereV15.gd
          test -s hq-android-v15/scripts/ui/A01ReconWingletV8.gd
          test -s hq-android-v15/scripts/ui/A01ReconWingletV9.gd
          test -s hq-android-v15/scripts/ui/A01ReconNoseOpticsV10.gd
          test -s hq-android-v15/scripts/ui/A01ReconAirframeV11.gd
          test -s hq-android-v15/scripts/ui/A01ReconWingRootV12.gd
          test -s hq-android-v15/scripts/ui/A01ReconTailOpticsV13.gd
          test -s hq-android-v15/scripts/ui/A01ReconDamageFinishV14.gd
          test -s hq-android-v15/scripts/ui/A02FpvArtV1.gd
          cp hq-android-v15/scripts/ui/A02FpvArtV1.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconDroneV1.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconFinishV2.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconFinishV3.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconAirfoilV4.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconTailV5.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconDamageV6.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconAtmosphereV15.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconWingletV8.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconWingletV9.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconNoseOpticsV10.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconAirframeV11.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconWingRootV12.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconTailOpticsV13.gd scripts/ui/
          cp hq-android-v15/scripts/ui/A01ReconDamageFinishV14.gd scripts/ui/
          test -s hq-android-v15/tests/test_a01_recon_drone_v1.gd
          cp hq-android-v15/tests/test_a01_recon_drone_v1.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_shared_studio.gd
          cp hq-android-v15/tests/test_a01_recon_shared_studio.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_damage_v6.gd
          cp hq-android-v15/tests/test_a01_recon_damage_v6.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_mobile_budget_v7.gd
          cp hq-android-v15/tests/test_a01_recon_mobile_budget_v7.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_winglet_v8.gd
          cp hq-android-v15/tests/test_a01_recon_winglet_v8.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_winglet_v9.gd
          cp hq-android-v15/tests/test_a01_recon_winglet_v9.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_nose_optics_v10.gd
          cp hq-android-v15/tests/test_a01_recon_nose_optics_v10.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_airframe_v11.gd
          cp hq-android-v15/tests/test_a01_recon_airframe_v11.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_wing_root_v12.gd
          cp hq-android-v15/tests/test_a01_recon_wing_root_v12.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_tail_optics_v13.gd
          cp hq-android-v15/tests/test_a01_recon_tail_optics_v13.gd tests/
          test -s hq-android-v15/tests/test_a01_recon_damage_finish_v14.gd
          cp hq-android-v15/tests/test_a01_recon_damage_finish_v14.gd tests/
