      # /apc/ MUST serve the same QA-tested, CURRENT Godot 3D studio that
      # passed test_bastion_studio_web_ui.gd above. Never export the pinned
      # 2026-11-14 APC V3 branch over the current V25 root bundle again.
      # Copy root index.* after sibling exports have been isolated in their
      # own paths; this keeps .pck, .js, .wasm, HTML and optional icons paired.
      - name: Publish current QA-tested Bastión P06 under /apc/
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/ui/APCClosedTiresV25.gd
          test -s scripts/ui/APCRubberArchV24.gd
          grep -q 'BastionP06_V25_CarcasasCerradas' scripts/ui/BastionStudioAdapter.gd
          grep -q 'PASS BASTION V25 LIVE WEB STUDIO:' /tmp/bastion-studio-smoke.log
          for asset in index.html index.js index.pck index.wasm; do
            test -s "build/web/${asset}"
          done
          rm -rf build/web/apc
          mkdir -p build/web/apc
          cp -a build/web/index.* build/web/apc/
          # Guard against stale V3 assets in a newly published APC folder.
          for asset in index.js index.pck index.wasm; do
            cmp -s "build/web/${asset}" "build/web/apc/${asset}"
          done
          python3 - <<'PY'
          from pathlib import Path
          import html
          import os
          import re

          source = Path('scripts/ui/BastionStudioAdapter.gd').read_text(encoding='utf-8')
          match = re.search(r'role_picker\.set_item_text\(idx,"([^"]+)"\)', source)
          assert match and 'Bastión P06 · V25' in match.group(1), 'Current APC selection missing'
          revision = os.environ['GITHUB_SHA'][:12]
          viewer = Path('build/web/apc/index.html')
          content = viewer.read_text(encoding='utf-8')
          assert content.count('</body>') == 1
          badge = (
              '<div id="tarvoka-apc-build" role="status" '
              'style="position:fixed;right:8px;bottom:8px;z-index:950;'
              'padding:4px 7px;border-radius:6px;'
              'background:#14202acc;color:#ffe3a5;'
              'font:600 11px system-ui,Arial,sans-serif;pointer-events:none">'
              + html.escape(match.group(1)) + ' · ' + revision + '</div>'
          )
          viewer.write_text(
              content.replace('</body>', badge + '\n</body>'),
