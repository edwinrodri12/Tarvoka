          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' project.godot
          # Godot 4.3 single-thread WebGL has a confirmed culling bug with
          # >1000 MeshInstance3D objects. V43 complete cities and metropolises
          # exceed it; preserve every detail by keeping visibility single-threaded.
          # This checkout only builds the WEB Studio, not the Android gameplay.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project.godot")
          source=p.read_text(encoding="utf-8")
          key="limits/spatial_indexer/threaded_cull_minimum_instances="
          if key in source:
              import re
              source=re.sub(r"(?m)^"+re.escape(key)+r".*$",key+"1000000",source)
          elif "[rendering]\n" in source:
              source=source.replace("[rendering]\n","[rendering]\n"+key+"1000000\n",1)
          else:
              source+="\n[rendering]\n"+key+"1000000\n"
          p.write_text(source,encoding="utf-8")
          assert source.count(key)==1
          PY
          grep -F 'limits/spatial_indexer/threaded_cull_minimum_instances=1000000' project.godot
