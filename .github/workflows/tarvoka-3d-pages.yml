      # The main terrain visualizer already imports civilian city V5 types,
      # but city V5 lives in its separate pending PR. The publisher's pinned
      # HQ base does not include these script files. Copy just their 3D
      # compile dependencies into the temporary web export, without merging
      # the unfinished city feature into game/main or changing its gameplay.
      - name: Check out pinned city 3D scripts required by terrain import
        uses: actions/checkout@v4
        with:
          ref: 8f0ece79f17ef2d0c2b7d7589e6726bf5a84d344
          path: city-web-compile-deps
          persist-credentials: false
      - name: Supply isolated civilian-city script dependencies to web export
        shell: bash
        run: |
          set -euo pipefail
          for name in CivilianCity3DV1 CivilianCityFacadeV2 CivilianCityPublicSpaceV3 CivilianCityTacticalLOD4 CivilianCityBattle3D CivilianCityDistanceLODV6; do
            test -s "city-web-compile-deps/scripts/ui/$name.gd"
            if test ! -s "scripts/ui/$name.gd"; then
              cp "city-web-compile-deps/scripts/ui/$name.gd" "scripts/ui/$name.gd"
            fi
          done
          grep -F 'CivilianCityBattle3D.gd' scripts/ui/BattleTerrain3D.gd
          grep -F 'CivilianCityDistanceLODV6.gd' scripts/ui/BattleTerrain3D.gd
          rm -rf city-web-compile-deps
      # Merge the approved tank into the EXISTING single native Godot scene.
      # This copy occurs AFTER the pinned buildings/APC setup, BEFORE import
      # and export. Keep the building catalogue and all other unit meshes.
      - name: Check out approved G09 V32 for unified studio
        uses: actions/checkout@v4
        with:
          ref: feat/g09-v32-studio-final-animation-20261114
          path: g09-unified-source
          persist-credentials: false
      - name: Integrate G09 V32 native model and controls in central engine
        shell: bash
        run: |
          set -euo pipefail
          test -s g09-unified-source/tests/test_g09_animation_final_v32.gd
          test -s g09-unified-source/scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/CombinedArtStudioWeb.gd
          test -s scripts/ui/BastionStudioAdapter.gd
          # Only the tank-specific modules and the compatible base inspector
          # are exchanged. HQ, naval base, airbase, barracks, APC, G11 and
          # helicopter modules retain their existing tested implementations.
          cp g09-unified-source/scripts/ui/Tank*.gd scripts/ui/
          # Keep the latest main catalogue, including APC, G11 and G13.
          # Bring the approved G09 geometry+animations only; never replace
          # modern UnitModels3D.gd with a 2026-11-14 snapshot.
          cp g09-unified-source/scripts/ui/UnitArtStudioWeb.gd scripts/ui/UnitArtStudioWeb.gd
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          main_path = Path('scripts/ui/UnitModels3D.gd')
          approved_path = Path('g09-unified-source/scripts/ui/UnitModels3D.gd')
          current = main_path.read_text()
          approved = approved_path.read_text()
          
          # Integrate ONLY approved tank geometry passes. Never replace the newer
          # P06, G11, A01, G13 or battle rendering logic with an old role catalogue.
          tank_preloads = [
              line for line in approved.splitlines()
              if re.match(r'^const Tank[A-Za-z0-9_]+ = preload\(', line)
              and line not in current
          ]
          anchor = 'const TankArmorV10 = preload("res://scripts/ui/TankArmorV10.gd")'
          assert current.count(anchor) == 1, 'New tank preload anchor moved'
          current = current.replace(anchor, anchor + ''.join('\n' + line for line in tank_preloads), 1)
          
          tank_anchor = '    if role == "tank":\n        # Physical finish'
          approved_start = approved.index(tank_anchor, approved.index('static func build('))
          approved_end = approved.index('    return model\n', approved_start)
          approved_tank = approved[approved_start:approved_end]
          assert 'TankTrackAlignmentV31.apply(model)' in approved_tank
          
          start = current.index(tank_anchor, current.index('static func build('))
          end = current.index('    return model\n', start)
          legacy_chunk = current[start:end]
          # Keep the current P06 post-build setup, not the V32 branch's older APC.
          apc_pos = legacy_chunk.rfind('    elif role == "apc":\n')
          assert apc_pos >= 0, 'Current P06 post-build logic not found'
          apc_tail = legacy_chunk[apc_pos:]
          assert 'BastionDamage.prepare' in apc_tail
          current = current[:start] + approved_tank + apc_tail + current[end:]
          assert current.count(tank_anchor) == 1, 'Duplicate G09 build stages remain'
          for preserved in ['const G13AA = preload(', 'const G11Art = preload(',
                            'const G16LogisticsV1 = preload(', 'const G16ExteriorV2 = preload(',
                            'const G16MechanicsV3 = preload(', 'const G16SculptV4 = preload(',
                            'const G16MaterialsV5 = preload(', 'const G16ServiceV6 = preload(',
                            'const APCClosedTiresV25 = preload(', 'G13DetailV2.apply',
                            'G11Art.build', 'APCClosedTiresV25.apply',
                            'static func pose_model(', 'static func restore_model_pose(']:
              assert preserved in current, 'Lost newer unit feature: ' + preserved
          main_path.write_text(current)
          print('PASS G09 NATIVE MERGE: V32 sculpt in current P06/G11/G13/A01 catalogue')
          PY
          test -s scripts/ui/G13MobileAirDefenseV1.gd
          test -s scripts/ui/G13GroundAirFinishV4.gd
          test -s scripts/ui/G13DetailV2.gd
          test -s scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/TankHitReactionV30.gd
          grep -q 'var _v31_preview := false' scripts/ui/UnitArtStudioWeb.gd
          grep -q 'TankTrackAlignmentV31.apply' scripts/ui/UnitModels3D.gd
          grep -q 'Tanque G09 · V32 FINAL' scripts/ui/BastionStudioAdapter.gd
          grep -q 'Estudio3D_MenuUnificado' scripts/ui/BastionStudioAdapter.gd
          grep -q 'G09_HistorialComparaciones' scripts/ui/BastionStudioAdapter.gd
          grep -q 'Estudio3D_DetallesPorUnidad' scripts/ui/BastionStudioAdapter.gd
          grep -q 'func _studio_quick_action' scripts/ui/BastionStudioAdapter.gd
          grep -q 'CatalogoCompletoDeAnimaciones' scripts/ui/BastionStudioAdapter.gd
          grep -q 'G09 V32 · Visor final separado' scripts/ui/BastionStudioAdapter.gd
          test -s tests/test_studio_full_animation_inventory.gd
