          # leaves all three false on a new selection, so it renders V10.
          # Select the ALREADY APPROVED V31/V32 preview by default. This
          # changes no tank mesh/animation/physics source and leaves all
          # explicit earlier-version comparison controls available.
          python3 - <<'PY'
          from pathlib import Path
          tank=Path("scripts/ui/BastionStudioAdapter.gd")
          source=tank.read_text(encoding="utf-8")
          inspector=Path("scripts/ui/UnitArtStudioWeb.gd").read_text(encoding="utf-8")
          for member in ("_v25_preview", "_v30_preview", "_v31_preview"):
              assert ("var "+member) in inspector,member
          anchor="func _ready() -> void:\n    super._ready()\n"
          assert source.count(anchor)==1,"Bastion native ready anchor moved"
          source=source.replace(anchor,anchor+(
              "    # Default to existing APPROVED G09 geometry V31 / animation V32.\n"
              "    # Users may still choose earlier geometry in the inspector.\n"
              "    _v25_preview=true\n"
              "    _v30_preview=true\n"
              "    _v31_preview=true\n"),1)
          tank.write_text(source,encoding="utf-8")
