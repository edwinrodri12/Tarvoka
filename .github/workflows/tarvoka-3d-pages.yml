  deploy:
    # Preview branch builds never update the public site.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - name: Publish native 3D studio
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Studio revision and actual served Godot bundle
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ needs.build.outputs.studio_source }}
          EXPECTED_BUNDLE: ${{ needs.build.outputs.studio_bundle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          source = os.environ['EXPECTED_SOURCE']
          digest = os.environ['EXPECTED_BUNDLE']
          assert re.fullmatch('[a-f0-9]{40}', source)
          assert re.fullmatch('[a-f0-9]{64}', digest)
          base = 'https://edwinrodri12.github.io/Tarvoka/'
          def fetch(path, attempt):
              url = base + path + '?rev=' + source + '&qa=' + str(attempt)
              return urllib.request.urlopen(urllib.request.Request(url, headers={
                  'Cache-Control': 'no-cache', 'User-Agent': 'TARVOKA-Pages-QA'
              }), timeout=45)
          for attempt in range(1, 13):
              try:
                  with fetch('studio-version.json', attempt) as response:
                      manifest = json.load(response)
                  assert manifest['source_commit'] == source, 'Wrong deployed source'
                  assert manifest['bundle_sha256'] == digest, 'Wrong deployed manifest hash'
                  with fetch('index.html', attempt) as response:
                      page = response.read().decode('utf-8')
                  assert source[:12] in page and 'tarvoka-engineer-build' in page
                  assert 'href="?unidad=a02"' in page, 'Missing public A02 entry link'
                  assert 'tarvoka-a02-compact-nav' in page, 'Missing compact A02 inspection menu'
                  with fetch('index.pck', attempt) as response:
                      actual = hashlib.sha256()
                      for chunk in iter(lambda: response.read(1024 * 1024), b''):
                          actual.update(chunk)
                  assert actual.hexdigest() == digest, 'Public Godot package differs from tested package'
                  print('PASS PUBLIC STUDIO SOURCE AND PACKAGE:', source, digest)
                  break
              except Exception as exc:
                  print('Public revision check', attempt, str(exc), flush=True)
                  if attempt == 12:
                      raise
                  time.sleep(10)
          PY
