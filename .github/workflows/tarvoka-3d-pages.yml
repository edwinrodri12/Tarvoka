          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' apc-p06-source/project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' apc-p06-source/project.godot
