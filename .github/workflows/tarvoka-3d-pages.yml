              if(info.role!=='infantry_engineer'||info.edition!=='V17'||info.visible_meshes<20)
                throw Error('Actual WebGL entry does not load current G05');
              await page.waitForTimeout(1500);
              const png=await page.screenshot({path:'build/qa/engineer-browser/g05-v17-real-webgl.png'});
              const image=PNG.sync.read(png);
              if(image.width!==1280||image.height!==720)throw Error('Bad screenshot dimensions');
