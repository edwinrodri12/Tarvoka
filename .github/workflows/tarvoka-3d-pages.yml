      # Single-site publication. The current root scene stays the same:
      # BastionStudioAdapter -> CombinedArtStudioWeb. Only infantry-only
      # sections of that parent are upgraded; never replace the whole editor.
      - name: Check out QA-tested Infantry Barracks V9 3D art layers
        uses: actions/checkout@v4
        with:
          ref: b6026561326865d06d97da10a0ca58afe7127d10
          path: infantry-v9-approved
          persist-credentials: false
      - name: Integrate Infantry V9 into the SAME native Godot Studio
        shell: bash
        run: |
          set -euo pipefail
          for name in InfantryBarracks3DV1 InfantryBarracksFinishV2 InfantryBarracksMaterialsV3 InfantryBarracksRearFacadeV4 InfantryBarracksEntranceYardV5 InfantryBarracksRoofCommandV6 InfantryBarracksSideTowersV7 InfantryBarracksTowerFinishV8 InfantryBarracksFinalAccessV9 InfantryBarracksFrontWindowV10; do
            test -s "infantry-v9-approved/scripts/ui/$name.gd"
            cp "infantry-v9-approved/scripts/ui/$name.gd" "scripts/ui/$name.gd"
          done
          cp infantry-v9-approved/tests/test_infantry_barracks_v10_gpu.gd tests/test_infantry_barracks_v10_gpu.gd
          # Keep the original V10 facade/tower/door checks, but let the
          # unified Studio contain additional approved city buildings.
          # The old pinned test assumes EXACTLY four category entries;
          # this became false once civilian cities were added.
          python3 - <<'PY'
          from pathlib import Path
          check=Path("tests/test_infantry_barracks_v10_gpu.gd")
          content=check.read_text()
          exact="assert(studio.building_picker.item_count==4)"
          assert content.count(exact)==1, "V10 native test anchor moved"
          check.write_text(content.replace(
              exact,"assert(studio.building_picker.item_count>=4)"))
          print("PASS V10 test adapted to additive unified building catalogue")
          PY
          python3 - <<'PY'
          from pathlib import Path

          current=Path("scripts/ui/CombinedArtStudioWeb.gd")
          old=current.read_text(encoding="utf-8")
          updated=Path("infantry-v9-approved/scripts/ui/CombinedArtStudioWeb.gd").read_text(encoding="utf-8")
          original=old

          def transplant(studio,source,start,stop):
              # Match whole declaration lines, not partial names: V1 is
              # a prefix of V10, so string.count('const ...V1') is unsafe.
              import re
              anchor=re.compile(r'(?m)^'+re.escape(start)+r'(?![A-Za-z0-9_])')
              dest=list(anchor.finditer(studio))
              src=list(anchor.finditer(source))
              assert len(dest)==1,(start,len(dest))
              assert len(src)==1,(start,len(src))
              p=dest[0].start()
              a=src[0].start()
              q=studio.index(stop,p+len(start))
              b=source.index(stop,a+len(start))
              assert p<q and a<b,(start,stop)
              return studio[:p]+source[a:b]+studio[q:]

          # Only infantry preloads and controls are exchanged. All HQ,
          # Naval, Airbase, APC, G09, G11, G13 and A01 routines remain
          # byte-for-byte from the existing approved published code.
          for start,stop in [
              ("const InfantryBarracksV1","const AirbaseHangarV2"),
              ("var infantry_controls:","var naval_detail_v2_toggle:"),
              ("func _add_infantry_controls()","func _change_selected_building("),
              ("func _update_camera() -> void:\n",'    if _role=="naval_base":'),
              ("func _update_details() -> void:\n",'    if _role=="naval_base" and model_root!=null:')
          ]:
              old=transplant(old,updated,start,stop)

          former='    building_picker.add_item("Cuartel de Infantería · V5 · uniones y remates 360°")'
          newer='    building_picker.add_item("Cuartel de Infantería · V10 · ventanas frontales 3D")'
          assert old.count(former)==1
          old=old.replace(former,newer)
          for critical in [
              "InfantryBarracksV10.apply", "InfantryBarracksV9.apply", "InfantryBarracksV8.apply",
              "func _toggle_infantry_access_v9",
              "func _toggle_infantry_front_v10",
              "func _display_naval_base", "func _display_airbase",
              "HQSmokeV23.build(damage_stage)",
              "func _change_selected_building("
          ]:
              assert critical in old,critical
          # Compare non-infantry landmark functions in the two versions:
          # they must survive the change without being replaced wholesale.
          for func in ["func _display_airbase()", "func _display_naval_base()",
                       "func _display_headquarters()"]:
              assert (func in original)==(func in old),func
          current.write_text(old,encoding="utf-8")
          print("PASS UNIFIED INFANTRY V10 OVERLAY: 10 exact mesh modules, one shared Studio, no replaced external model")
          PY
          rm -rf infantry-v9-approved
          test -s scripts/ui/InfantryBarracksFinalAccessV9.gd
          test -s scripts/ui/InfantryBarracksFrontWindowV10.gd
          test -s scripts/ui/BastionStudioAdapter.gd
          test -s scenes/UnitArtStudioWeb.tscn
          grep -F 'InfantryBarracksV10.apply' scripts/ui/CombinedArtStudioWeb.gd
          grep -F 'Cuartel de Infantería · V10 · ventanas frontales 3D' scripts/ui/CombinedArtStudioWeb.gd
      # The sculpt is still being approved. Bring ONLY civilian art files
