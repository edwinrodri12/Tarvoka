permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Native Godot studio exports and independently scheduled city previews
  # must not evict one another from GitHub's single pending concurrency slot.
  # Keep distinct queued builds; github-pages environment serializes final
  # deployment, and the city preview's workflow_run follows native success.
  # Preserve the dedicated city V16 publish slot and ignored-check isolation.
  group: >-
    ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(studio): ship civilian city V16 unified buildings') && 'tarvoka-city-v16-native-publish' || github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push') && 'tarvoka-pages-ignored-checks' || 'tarvoka-native-3d-studio-build' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out native HQ V21 complete rear geometry and staged hit animation studio with nine original Android HQ V15 sprites
        uses: actions/checkout@v4
        with:
          ref: feat/infantry-barracks-v5-final-corner-clearance-20261116
          persist-credentials: false
      - name: Retrieve the exact nine V15 sprites shipped by Android
        uses: actions/checkout@v4
        with:
          ref: main
          path: hq-android-v15
          persist-credentials: false
      - name: Include V15 source PNGs in the HQ 3D showroom before import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png"
            cp "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s hq-android-v15/assets/buildings/hq_v15/hq_neutral.png
          cp hq-android-v15/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          # The publisher keeps the complete HQ/Airbase/G09 web studio from its
          # release branch. Only P06 model/animation files and an additive
          # subclass adapter come from main; no building assets are replaced.
          for item in UnitModels3D.gd AttackHelicopterV1.gd AttackHelicopterCabinV2.gd AttackHelicopterRotorV3.gd AttackHelicopterEnginesV4.gd AttackHelicopterLandingV5.gd AttackHelicopterLandingFinishV6.gd AttackHelicopterReadabilityV7.gd AttackHelicopterSilhouetteV8.gd AttackHelicopterFinishV10.gd AttackHelicopterTailV11.gd AttackHelicopterNoseV12.gd AttackHelicopterDamageV13.gd AttackHelicopterFactionV14.gd AttackHelicopterCombatFXV14.gd AttackHelicopterNightStudioV144.gd BastionVisualRig3D.gd BastionDamage3D.gd BastionStudioAdapter.gd APCArtV1.gd APCArmorV2.gd APCBatchingV4.gd APCFinishV3.gd APCDetailV5.gd APCFinishV6.gd APCMachineGunV7.gd APCDamageV7.gd APCRearDesignV10.gd APCExteriorV11.gd APCTurretV12.gd APCSurfaceV13.gd APCWheelV14.gd APCUndercarriageV15.gd APCJointFinishV16.gd APCContourV17.gd APCWheelwellV18.gd APCUnifiedFlankV19.gd APCMicrodetailV20.gd APCMaterialFinishV21.gd APCWeatherFinishV22.gd APCTireFinishV23.gd APCRubberArchV24.gd APCClosedTiresV25.gd APCTacticalLOD8.gd APCDistanceLODControllerV9.gd APCWeaponAudioV8.gd APCVisualRigV1.gd G11Art3D.gd G11VisualRig3D.gd G11FinishV2.gd G11SurfaceV3.gd G11GeometryV4.gd G11MechanicsV5.gd G11DamageSculptV6.gd G11DamageAtmosphereV7.gd G11SequentialSalvoV8.gd G11ExhaustV9.gd G11CooldownV10.gd G11ArmorFinishV11.gd G11CabChassisV12.gd G11TracksFactionV13.gd G11MechanicalDetailV14.gd G11AftPodFinishV15.gd G11FrontFrameV16.gd G11SurfaceWeatherV17.gd G11TrackAssemblyV18.gd G11TrackFinishV19.gd G11WheelSuspensionV20.gd G11ShockMountFinishV21.gd G11SuspensionJointsV22.gd G11JointFinishV23.gd G11MobileLOD.gd G11TacticalReadabilityV24.gd G11BattleLODControllerV25.gd G11BattleContextV25.gd G11RocketFaceReadabilityV25.gd G11TacticalPaintReadabilityV27.gd G11CameraIdentityV28.gd G11BattleActionsV29.gd G11RearUndercarriageV30.gd G11RocketTrailsV30.gd G11RocketFlightV31.gd G11RunningGearV32.gd G11FinalAuditV33.gd G13MobileAirDefenseV1.gd G13DetailV2.gd G13GroundAirFinishV4.gd G13UndercarriageV6.gd G13WheelFinishV7.gd G13SurfaceFinishV8.gd G13SilhouetteV10.gd InfantryBarracksBattle3D.gd InfantryBarracksWindowShadeV11.gd FactionIdentity.gd BattleTerrain3D.gd TerrainVisualMapBridge3D.gd TerrainSurfaceFinish3D.gd TerrainSurfaceSampler3D.gd TerrainStudioRoadShore3D.gd TerrainStudioSnowPaletteV15.gd WinterBattleBiome.gd; do
            test -s "hq-android-v15/scripts/ui/${item}"
            cp "hq-android-v15/scripts/ui/${item}" "scripts/ui/${item}"
          done
          # G13 is actively evolving. A fixed V1/V4/V8 file list leaves
          # newest sculpt/rig modules (such as G13SilhouetteV10.gd) missing
          # after UnitModels3D.gd from main references them. Overlay every
          # versioned G13 native script from the exact same main snapshot.
          for g13_source in hq-android-v15/scripts/ui/G13*.gd; do
            test -s "$g13_source"
            cp "$g13_source" scripts/ui/
          done
          test -s scripts/ui/G13SilhouetteV10.gd
          test -s scripts/ui/G13CabRearFinishV11.gd
          test -s scripts/ui/G13BodyFinishV11.gd
          test -s hq-android-v15/tests/test_bastion_studio_web_ui.gd
          cp hq-android-v15/tests/test_bastion_studio_web_ui.gd tests/test_bastion_studio_web_ui.gd
          test -s hq-android-v15/tests/test_g13_studio_web_v1.gd
          cp hq-android-v15/tests/test_g13_studio_web_v1.gd tests/test_g13_studio_web_v1.gd
          test -s hq-android-v15/tests/test_unified_studio_navigation.gd
          cp hq-android-v15/tests/test_unified_studio_navigation.gd tests/test_unified_studio_navigation.gd
          test -s hq-android-v15/tests/test_studio_full_animation_inventory.gd
          cp hq-android-v15/tests/test_studio_full_animation_inventory.gd tests/test_studio_full_animation_inventory.gd
          test -s scenes/UnitArtStudioWeb.tscn
          sed -i 's|res://scripts/ui/CombinedArtStudioWeb.gd|res://scripts/ui/BastionStudioAdapter.gd|' scenes/UnitArtStudioWeb.tscn
          grep -q 'res://scripts/ui/BastionStudioAdapter.gd' scenes/UnitArtStudioWeb.tscn
          rm -rf hq-android-v15
          test "$(find assets/buildings/hq_v15 -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      # The main terrain visualizer already imports civilian city V5 types,
      # but city V5 lives in its separate pending PR. The publisher's pinned
      # HQ base does not include these script files. Copy just their 3D
      # compile dependencies into the temporary web export, without merging
      # the unfinished city feature into game/main or changing its gameplay.
      - name: Check out pinned city 3D scripts required by terrain import
        uses: actions/checkout@v4
        with:
          ref: 8f0ece79f17ef2d0c2b7d7589e6726bf5a84d344
          path: city-web-compile-deps
          persist-credentials: false
      - name: Supply isolated civilian-city script dependencies to web export
        shell: bash
        run: |
          set -euo pipefail
          for name in CivilianCity3DV1 CivilianCityFacadeV2 CivilianCityPublicSpaceV3 CivilianCityTacticalLOD4 CivilianCityBattle3D CivilianCityDistanceLODV6; do
            test -s "city-web-compile-deps/scripts/ui/$name.gd"
            if test ! -s "scripts/ui/$name.gd"; then
              cp "city-web-compile-deps/scripts/ui/$name.gd" "scripts/ui/$name.gd"
            fi
          done
          grep -F 'CivilianCityBattle3D.gd' scripts/ui/BattleTerrain3D.gd
          grep -F 'CivilianCityDistanceLODV6.gd' scripts/ui/BattleTerrain3D.gd
          rm -rf city-web-compile-deps
      # Merge the approved tank into the EXISTING single native Godot scene.
      # This copy occurs AFTER the pinned buildings/APC setup, BEFORE import
      # and export. Keep the building catalogue and all other unit meshes.
      - name: Check out approved G09 V32 for unified studio
        uses: actions/checkout@v4
        with:
          ref: feat/g09-v32-studio-final-animation-20261114
          path: g09-unified-source
          persist-credentials: false
      - name: Integrate G09 V32 native model and controls in central engine
        shell: bash
        run: |
          set -euo pipefail
          test -s g09-unified-source/tests/test_g09_animation_final_v32.gd
          test -s g09-unified-source/scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/CombinedArtStudioWeb.gd
          test -s scripts/ui/BastionStudioAdapter.gd
          # Only the tank-specific modules and the compatible base inspector
          # are exchanged. HQ, naval base, airbase, barracks, APC, G11 and
          # helicopter modules retain their existing tested implementations.
          cp g09-unified-source/scripts/ui/Tank*.gd scripts/ui/
          # Keep the latest main catalogue, including APC, G11 and G13.
          # Bring the approved G09 geometry+animations only; never replace
          # modern UnitModels3D.gd with a 2026-11-14 snapshot.
          cp g09-unified-source/scripts/ui/UnitArtStudioWeb.gd scripts/ui/UnitArtStudioWeb.gd
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          main_path = Path('scripts/ui/UnitModels3D.gd')
          approved_path = Path('g09-unified-source/scripts/ui/UnitModels3D.gd')
          current = main_path.read_text()
          approved = approved_path.read_text()
          
          # Integrate ONLY approved tank geometry passes. Never replace the newer
          # P06, G11, A01, G13 or battle rendering logic with an old role catalogue.
          tank_preloads = [
              line for line in approved.splitlines()
              if re.match(r'^const Tank[A-Za-z0-9_]+ = preload\(', line)
              and line not in current
          ]
          anchor = 'const TankArmorV10 = preload("res://scripts/ui/TankArmorV10.gd")'
          assert current.count(anchor) == 1, 'New tank preload anchor moved'
          current = current.replace(anchor, anchor + ''.join('\n' + line for line in tank_preloads), 1)
          
          tank_anchor = '    if role == "tank":\n        # Physical finish'
          approved_start = approved.index(tank_anchor, approved.index('static func build('))
          approved_end = approved.index('    return model\n', approved_start)
          approved_tank = approved[approved_start:approved_end]
          assert 'TankTrackAlignmentV31.apply(model)' in approved_tank
          
          start = current.index(tank_anchor, current.index('static func build('))
          end = current.index('    return model\n', start)
          legacy_chunk = current[start:end]
          # Keep the current P06 post-build setup, not the V32 branch's older APC.
          apc_pos = legacy_chunk.rfind('    elif role == "apc":\n')
          assert apc_pos >= 0, 'Current P06 post-build logic not found'
          apc_tail = legacy_chunk[apc_pos:]
          assert 'BastionDamage.prepare' in apc_tail
          current = current[:start] + approved_tank + apc_tail + current[end:]
          assert current.count(tank_anchor) == 1, 'Duplicate G09 build stages remain'
          for preserved in ['const G13AA = preload(', 'const G11Art = preload(',
                            'const APCClosedTiresV25 = preload(', 'G13DetailV2.apply',
                            'G11Art.build', 'APCClosedTiresV25.apply',
                            'static func pose_model(', 'static func restore_model_pose(']:
              assert preserved in current, 'Lost newer unit feature: ' + preserved
          main_path.write_text(current)
          print('PASS G09 NATIVE MERGE: V32 sculpt in current P06/G11/G13/A01 catalogue')
          PY
          test -s scripts/ui/G13MobileAirDefenseV1.gd
          test -s scripts/ui/G13GroundAirFinishV4.gd
          test -s scripts/ui/G13DetailV2.gd
          test -s scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/TankHitReactionV30.gd
          grep -q 'var _v31_preview := false' scripts/ui/UnitArtStudioWeb.gd
          grep -q 'TankTrackAlignmentV31.apply' scripts/ui/UnitModels3D.gd
          grep -q 'Tanque G09 · V32 FINAL' scripts/ui/BastionStudioAdapter.gd
          grep -q 'Estudio3D_MenuUnificado' scripts/ui/BastionStudioAdapter.gd
          grep -q 'G09_HistorialComparaciones' scripts/ui/BastionStudioAdapter.gd
          grep -q 'Estudio3D_DetallesPorUnidad' scripts/ui/BastionStudioAdapter.gd
          grep -q 'func _studio_quick_action' scripts/ui/BastionStudioAdapter.gd
