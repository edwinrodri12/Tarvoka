name: Publish TARVOKA native 3D art studio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tarvoka-3d-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["TARVOKA Browser 3D Art Studio", "TARVOKA G09 V31 3D Studio final track QA and GLB", "TARVOKA G09 V31 final inboard track alignment"]
    types: [completed]
    branches:
      - feat/hq-v20-walls-weather-release-android-bench-20261114
      - feat/terrain-v17-battle-seam-blending-20261114
      - feat/g09-v31-studio-inboard-track-alignment-20261114
      - feat/g09-v31-tracks-inboard-alignment-20261114

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep a verified V10 site publication from being cancelled by unrelated
  # model/HQ automation. GitHub serializes page deployments in this group.
  group: tarvoka-public-studio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out fixed HQ V20 complete walls and release-safe weather native studio with nine original Android HQ V15 sprites
        uses: actions/checkout@v4
        with:
          ref: feat/hq-v20-walls-weather-release-android-bench-20261114
          persist-credentials: false
      - name: Retrieve the exact nine V15 sprites shipped by Android
        uses: actions/checkout@v4
        with:
          ref: main
          path: hq-android-v15
          persist-credentials: false
      - name: Include V15 source PNGs in the HQ 3D showroom before import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png"
            cp "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s hq-android-v15/assets/buildings/hq_v15/hq_neutral.png
          cp hq-android-v15/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          rm -rf hq-android-v15
          test "$(find assets/buildings/hq_v15 -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Download Godot 4.3 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$T"
          cp /tmp/godot-templates/templates/web_*.zip "$T/"
          test -s "$T/web_nothreads_release.zip"
          printf '4.3.stable\n' > "$T/version.txt"
      - name: Select native 3D scene and deployed revision watermark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets build/web
          git rev-parse --short=12 HEAD > assets/art_studio_revision.txt
          test "$(git branch --show-current)" = "feat/hq-v20-walls-weather-release-android-bench-20261114" || test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/hq-v20-walls-weather-release-android-bench-20261114)"
          test -s scripts/ui/HeadquartersFinishV8.gd
          test -s scripts/ui/HeadquartersArchitectureV7.gd
          test -s scripts/ui/HeadquartersEmblems3D.gd
          test -s tests/test_headquarters_v8.gd
          test -s scripts/ui/HeadquartersReadabilityV9.gd
          test -s tests/test_headquarters_v9_faction_gallery.gd
          test -s scripts/ui/HeadquartersSurfaceV10.gd
          test -s tests/test_headquarters_v10_surfaces.gd
          test -s scripts/ui/HeadquartersRefinementV11.gd
          test -s tests/test_headquarters_v11_lighting.gd
          test -s scripts/ui/HeadquartersSilhouetteV12.gd
          test -s scripts/ui/HeadquartersProductionV13.gd
          test -s tests/test_headquarters_v13_production.gd
          test -s scripts/ui/HeadquartersSpriteStudioV16.gd
          test -s scripts/ui/HeadquartersClimateV17.gd
          test -s tests/test_hq_v17_weather_terrain.gd
          test -s scripts/ui/HeadquartersWayfindingV18.gd
          test -s tests/test_hq_v18_wayfinding.gd
          test -s scripts/ui/HeadquartersFacadeV19.gd
          test -s tests/test_hq_v19_facade_stress.gd
          test -s tests/test_hq_v20_walls_weather_release.gd
          test -s scripts/ui/HQAndroidPhysicalBench.gd
          grep -q 'MuroContinuoBajoVentanasAlaV20_' scripts/ui/Headquarters3D.gd
          grep -q 'var climate_applied: bool = HQClimateV17.apply(' scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'var applied: bool = HQWayfindingV18.apply(' scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'var applied: bool = HQFacadeV19.apply(' scripts/ui/CombinedArtStudioWeb.gd
          ! grep -q 'assert(HQClimateV17.apply(' scripts/ui/CombinedArtStudioWeb.gd
          ! grep -q 'assert(HQFacadeV19.apply(' scripts/ui/CombinedArtStudioWeb.gd
          ! grep -q 'assert(HQWayfindingV18.apply(' scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'FachadaBiseladaEscudoOficialV19' scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'Escenarios49_100_144CuartelesV19' scripts/ui/CombinedArtStudioWeb.gd
          grep -q "SenalizacionArquitectonicaHQV18" scripts/ui/CombinedArtStudioWeb.gd
          test -s tests/test_hq_v16_sprite_studio.gd
          test -s assets/buildings/hq_v15/hq_0.png
          test -s assets/buildings/hq_v15/hq_7.png
          test -s assets/buildings/hq_v15/hq_neutral.png
          test -s tests/test_headquarters_v12_tactical_night.gd
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' project.godot
      - name: Export native Godot 3D browser studio
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/studio-pages-import.log
          if grep -E "SCRIPT ERROR:|ERROR:|Import failed" /tmp/studio-pages-import.log; then
            echo "Godot HQ V8 atlas import failed" >&2
            exit 1
          fi
          test -d .godot/imported
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --export-release "Web Studio" build/web/index.html 2>&1 | tee /tmp/studio-publish.log
          if grep -E "SCRIPT ERROR:|ERROR:|Export failed" /tmp/studio-publish.log; then
            exit 1
          fi
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.pck
          test -s build/web/index.wasm
          touch build/web/.nojekyll

      # Keep the current HQ V11 gallery as the SAME PUBLIC ROOT.
      # Add the complete tested Battle V8 Studio under /Tarvoka/batalla/.
      # No download or local installation is required for either view.
      - name: Check out V17 native battlefield seamless materials and V16 valley studio
        uses: actions/checkout@v4
        with:
          ref: feat/terrain-v17-battle-seam-blending-20261114
          path: battle-source
          persist-credentials: false
      - name: Export V17 seamless 3D battles and V16 valley landscapes to /batalla/
        shell: bash
        run: |
          set -euo pipefail
          test -s battle-source/scripts/ui/Battle3DMapView.gd
          test -s battle-source/scripts/ui/Battle3DOrders.gd
          test -s battle-source/scripts/ui/BattleTerrain3D.gd
          test -s battle-source/scripts/ui/TerrainStudioDetailV5.gd
          test -s battle-source/scripts/ui/TerrainStudioNaturalV6.gd
          test -s battle-source/scripts/ui/TerrainStudioErosionV7.gd
          test -s battle-source/scripts/ui/TerrainStudioEcotonesV8.gd
          test -s battle-source/scripts/ui/TerrainStudioMaterialsV9.gd
          test -s battle-source/scripts/ui/TerrainStudioRidgeV10.gd
          test -s battle-source/scripts/ui/TerrainStudioFoothillsV11.gd
          test -s battle-source/tests/test_terrain_studio_v15_foothills.gd
          test -s battle-source/scripts/ui/TerrainStudioSedimentsV12.gd
          test -s battle-source/tests/test_terrain_studio_v16_valley.gd
          test -s battle-source/tests/test_battle_terrain_v17_seams.gd
          grep -q '_cached_corner_tint' battle-source/scripts/ui/BattleTerrain3D.gd
          grep -q 'terrain_blend_extra_batches' battle-source/scripts/ui/BattleTerrain3D.gd
          grep -q 'PASS TERRAIN_BATTLE_V17:' battle-source/tests/test_battle_terrain_v17_seams.gd
          grep -q 'ComparadorTerrenoV11V12' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'DepositosAluvialesV12' battle-source/scripts/ui/TerrainStudioSedimentsV12.gd
          grep -q 'ArcenesNaturalesV12' battle-source/scripts/ui/TerrainStudioSedimentsV12.gd
          grep -q 'PASS TERRAIN_STUDIO_V16:' battle-source/tests/test_terrain_studio_v16_valley.gd
          grep -q 'rim_margin' battle-source/scripts/ui/TerrainStudioFoothillsV11.gd
          grep -q 'PASS TERRAIN_STUDIO_V15B:' battle-source/tests/test_terrain_studio_v15_foothills.gd
          grep -q 'ComparadorTerrenoV10V11' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'TaludesTransicionV11' battle-source/scripts/ui/TerrainStudioFoothillsV11.gd
          grep -q 'AfloramientosDeValleV11' battle-source/scripts/ui/TerrainStudioFoothillsV11.gd
          test -s battle-source/tests/test_terrain_studio_v14_silhouettes.gd
          grep -q 'ComparadorTerrenoV9V10' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'VistaPerfilCordilleraV10' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'strongest' battle-source/scripts/ui/TerrainStudioRidgeV10.gd
          test -s battle-source/tests/test_terrain_studio_v13_material_light.gd
          grep -q 'ComparadorTerrenoV8V9' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'VistaDistanciaRealV9' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'daylight_profile' battle-source/scripts/ui/TerrainStudioMaterialsV9.gd
          test -s battle-source/tests/test_terrain_studio_v12_lithology.gd
          grep -q 'ComparadorTerrenoV7V8' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'SotobosqueDeTransicionV8' battle-source/scripts/ui/TerrainStudioEcotonesV8.gd
          test -s battle-source/tests/test_terrain_studio_v11_erosion.gd
          grep -q 'MacizosErosionadosContinuosV7' battle-source/scripts/ui/TerrainStudioErosionV7.gd
          grep -q 'FastNoiseLite' battle-source/scripts/ui/TerrainStudioErosionV7.gd
          grep -q 'too_bright == 0' battle-source/tests/test_terrain_studio_v11_erosion.gd
          grep -q 'SedimentosYOrillasSinParedV7' battle-source/scripts/ui/TerrainStudioErosionV7.gd
          grep -q 'ComparadorTerrenoV6V7' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          test -s battle-source/tests/test_terrain_studio_v10_natural.gd
          grep -q 'BosqueMixtoV6' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'CordilleraContinuaV6' battle-source/scripts/ui/TerrainStudioNaturalV6.gd
          test -s battle-source/tests/test_terrain_studio_v9_controls.gd
          grep -q 'TaludesNaturalesDeRiberaV5' battle-source/scripts/ui/TerrainStudioDetailV5.gd
          grep -q 'GaleriaFaccionesTerreno' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'PantallaCompletaTerreno3D' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          grep -q 'BATALLA 3D' battle-source/scripts/ui/CombinedArtStudioWeb.gd
          mkdir -p battle-source/assets battle-source/build/web build/web/batalla
          git -C battle-source rev-parse --short=12 HEAD > battle-source/assets/art_studio_revision.txt
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' battle-source/project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' battle-source/project.godot
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor \
            --path battle-source --import --quit 2>&1 | tee /tmp/battle-pages-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/battle-pages-import.log; then
            echo 'TARVOKA Battle V8 script or asset import failed' >&2
            exit 1
          fi
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless \
            --path battle-source --export-release 'Web Studio' \
            build/web/index.html 2>&1 | tee /tmp/battle-pages-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Export failed' /tmp/battle-pages-export.log; then
            echo 'TARVOKA Battle V8 WebGL export failed' >&2
            exit 1
          fi
          cp -a battle-source/build/web/. build/web/batalla/
          for asset in index.html index.js index.pck index.wasm; do
            test -s "build/web/batalla/$asset"
          done
      # Export the actual G09 V31 feature branch as an independent browser scene.
      # Preserve the existing HQ V11 root and Battle V8 at /batalla/ unchanged.
      - name: Check out finished G09 V31 native tank source
        uses: actions/checkout@v4
        with:
          ref: feat/g09-v31-studio-inboard-track-alignment-20261114
          path: tank-source
          persist-credentials: false
      - name: Export G09 V31 tank into TARVOKA Estudio 3D at /tanque/
        shell: bash
        run: |
          set -euo pipefail
          test -s tank-source/scripts/ui/TankGunV22.gd
          test -s tank-source/scripts/ui/TankFactionV23.gd
          test -s tank-source/scripts/ui/TankTacticalV24.gd
          test -s tank-source/scripts/ui/TankWearV25.gd
          test -s tank-source/scripts/ui/TankFinalTracksV29.gd
          test -s tank-source/scripts/ui/TankTrackAlignmentV31.gd
          test -s tank-source/tests/test_g09_track_alignment_v31.gd
          test -s tank-source/scripts/ui/TankDamagePolishV30.gd
          test -s tank-source/scripts/ui/TankHitReactionV30.gd
          test -s tank-source/tests/test_g09_art_v30.gd
          test -s tank-source/tests/test_g09_track_final_v29.gd
          test -s tank-source/scripts/ui/TankBattleScenarioV26.gd
          test -s tank-source/scripts/ui/TankFinishV21.gd
          test -s tank-source/scripts/ui/UnitArtStudioWeb.gd
          test -s tank-source/tests/test_g09_art_v22.gd
          test -s tank-source/tests/test_g09_art_v23.gd
          test -s tank-source/tests/test_g09_art_v24.gd
          test -s tank-source/tests/test_g09_art_v25.gd
          test -s tank-source/tests/test_g09_art_v26.gd
          test -s tank-source/scenes/UnitArtStudioWeb.tscn
          mkdir -p tank-source/assets tank-source/build/web build/web/tanque
          git -C tank-source rev-parse --short=12 HEAD > tank-source/assets/art_studio_revision.txt
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' tank-source/project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' tank-source/project.godot
          # Show the newest tank when opening the independent viewer;
          # the branch's Android defaults and other studio routes stay intact.
          sed -i 's/var _v25_preview := false/var _v25_preview := true/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _v25_preview := true' tank-source/scripts/ui/UnitArtStudioWeb.gd
          sed -i 's/var _v30_preview := false/var _v30_preview := true/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _v30_preview := true' tank-source/scripts/ui/UnitArtStudioWeb.gd
          sed -i 's/var _v31_preview := false/var _v31_preview := true/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _v31_preview := true' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q '_toggle_v31' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q '_toggle_underside_camera' tank-source/scripts/ui/UnitArtStudioWeb.gd
          # Publish this review on a forest battlefield in daylight from an
          # elevated tactical camera; Android's runtime defaults stay stable.
          sed -i 's/var _scenario_enabled := false/var _scenario_enabled := true/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          sed -i 's/var _scenario_terrain := 0/var _scenario_terrain := 1/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          sed -i 's/var _tactical_view := false/var _tactical_view := true/' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _scenario_enabled := true' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _scenario_terrain := 1' tank-source/scripts/ui/UnitArtStudioWeb.gd
          grep -q 'var _tactical_view := true' tank-source/scripts/ui/UnitArtStudioWeb.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor \
            --path tank-source --import --quit 2>&1 | tee /tmp/tank-pages-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/tank-pages-import.log; then
            echo 'G09 V31 import or script validation failed' >&2
            exit 1
          fi
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless \
            --path tank-source --export-release 'Web Studio' \
            build/web/index.html 2>&1 | tee /tmp/tank-pages-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Export failed' /tmp/tank-pages-export.log; then
            echo 'G09 V31 WebGL export failed' >&2
            exit 1
          fi
          cp -a tank-source/build/web/. build/web/tanque/
          for asset in index.html index.js index.pck index.wasm; do
            test -s "build/web/tanque/$asset"
          done
      # The dedicated V27 demo uses the ACTUAL 3D orders view and tank
      # LOD source, without replacing newer terrain and HQ galleries.
      - name: Check out playable G09 V31 battle branch
        uses: actions/checkout@v4
        with:
          ref: feat/g09-v31-tracks-inboard-alignment-20261114
          path: battle-g09-source
          persist-credentials: false
      - name: Export tested G09 V25 live-battle LOD demo at /batalla-g09/
        shell: bash
        run: |
          set -euo pipefail
          test -s battle-g09-source/scripts/ui/Battle3DMapView.gd
          test -s battle-g09-source/scripts/ui/BattleTerrain3D.gd
          test -s battle-g09-source/scripts/ui/TankBattleLOD27.gd
          test -s battle-g09-source/scripts/ui/TankWearV25.gd
          test -s battle-g09-source/scripts/ui/TankFinalTracksV29.gd
          test -s battle-g09-source/scripts/ui/TankTrackAlignmentV31.gd
          test -s battle-g09-source/tests/test_g09_track_alignment_v31.gd
          test -s battle-g09-source/scripts/ui/TankDamagePolishV30.gd
          test -s battle-g09-source/scripts/ui/TankHitReactionV30.gd
          test -s battle-g09-source/tests/test_g09_battle_lod_v27.gd
          test -s battle-g09-source/scripts/ui/CombinedArtStudioWeb.gd
          mkdir -p battle-g09-source/assets battle-g09-source/build/web build/web/batalla-g09
          git -C battle-g09-source rev-parse --short=12 HEAD > battle-g09-source/assets/art_studio_revision.txt
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' battle-g09-source/project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' battle-g09-source/project.godot
          # Open the interactive sandbox instead of the default tank-only
          # gallery. Sandbox orders use the real action validation code.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('battle-g09-source/scripts/ui/CombinedArtStudioWeb.gd')
          src=p.read_text(encoding='utf-8')
          needle='    _add_building_mode()\n'
          assert src.count(needle)==1
          src=src.replace(needle,needle+'    _switch_category(3)\n',1)
          p.write_text(src,encoding='utf-8')
          PY
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor \
            --path battle-g09-source --import --quit 2>&1 | tee /tmp/g09-v27-pages-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/g09-v27-pages-import.log; then
            echo 'G09 V31 live-battle source import failed' >&2
            exit 1
          fi
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless \
            --path battle-g09-source --export-release 'Web Studio' \
            build/web/index.html 2>&1 | tee /tmp/g09-v27-pages-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Export failed' /tmp/g09-v27-pages-export.log; then
            echo 'G09 V31 live battle WebGL export failed' >&2
            exit 1
          fi
          cp -a battle-g09-source/build/web/. build/web/batalla-g09/
          for asset in index.html index.js index.pck index.wasm; do
            test -s "build/web/batalla-g09/$asset"
          done
      - name: Add visible navigation among HQ V12, Battle V8 and G09 V31 studios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def add_link(filepath, href, label, tooltip, top=16):
              html = filepath.read_text(encoding='utf-8')
              assert html.count('</body>') == 1, filepath
              link = (
                  '<nav aria-label="Navegacion TARVOKA Estudio 3D" '
                  f'style="position:fixed;left:16px;top:{top}px;z-index:1000;'
                  'font:700 14px system-ui,Arial,sans-serif">'
                  f'<a href="{href}" title="{tooltip}" '
                  'style="display:inline-block;padding:12px 16px;'
                  'border:2px solid #e1c275;border-radius:9px;'
                  'background:#111d2e;color:#ffe5a0;'
                  'box-shadow:0 4px 15px #0009;text-decoration:none">'
                  f'{label}</a></nav>'
              )
              filepath.write_text(
                  html.replace('</body>', link + '\n</body>'),
                  encoding='utf-8'
              )

          add_link(Path('build/web/index.html'),
                   'batalla/', 'BATALLA 3D · MAPAS Y COMBATE',
                   'Abre el mapa 3D interactivo, terreno y ordenes confirmadas')
          add_link(Path('build/web/index.html'),
                   'tanque/', 'TANQUE G09 V31 · ESTUDIO 3D',
                   'Revisa V31: cadenas anchas alineadas hacia dentro y engranajes sincronizados', 76)
          add_link(Path('build/web/batalla/index.html'),
                   '../', 'VOLVER AL ESTUDIO · UNIDADES Y EDIFICIOS',
                   'Volver al Estudio principal con Cuartel General V11')
          add_link(Path('build/web/batalla/index.html'),
                   '../tanque/', 'TANQUE G09 V31 · MODELO REAL',
                   'Ver G09 V31 corregido desde abajo, frontal y trasero sin instalar APK', 76)
          add_link(Path('build/web/tanque/index.html'),
                   '../', 'VOLVER AL ESTUDIO · UNIDADES Y EDIFICIOS',
