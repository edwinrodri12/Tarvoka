      - name: Export native Godot 3D browser studio
        shell: bash
        env:
          # An ART ONLY city-preview release is not a G09/A01 approval.
          # Normal studio releases still execute the entire inventory.
          CITY_ART_PREVIEW: >-
            ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(studio): ship civilian city V16 unified buildings') }}
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/studio-pages-import.log
          if grep -E "SCRIPT ERROR:|ERROR:|Import failed" /tmp/studio-pages-import.log; then
            echo "Godot HQ V8 atlas import failed" >&2
            exit 1
          fi
          test -d .godot/imported
          # Actually instantiate the published homepage under GL compatibility.
          # A successful static export alone cannot detect broken model pickers
          # or a fallback vehicle displayed instead of V5 on Android.
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_bastion_studio_web_ui.gd \
            2>&1 | tee /tmp/bastion-studio-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/bastion-studio-smoke.log; then
            echo "Bastion Web UI regression"; exit 1
          fi
          grep -F 'PASS BASTION V25 LIVE WEB STUDIO:' /tmp/bastion-studio-smoke.log
          # Capture UI first: if later G13 checks fail, landscape artifacts
          # still exist for layout review. Test root starts at 960x540 and
          # resizes to 1280x720 within this full-size virtual display.
          # Catch hidden OptionButtons and duplicate/overlapping menu panels
          # in the actual exported Godot scene, at Android-landscape width.
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_unified_studio_navigation.gd \
            2>&1 | tee /tmp/unified-menu-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/unified-menu-smoke.log; then
            echo "Unified Studio navigation regression"; exit 1
          fi
          grep -F 'PASS UNIFIED STUDIO NAVIGATION:' /tmp/unified-menu-smoke.log
          test -s build/qa/studio-960x540.png
          test -s build/qa/studio-1280x720.png
          # ART-ONLY city preview: no unrelated A01 animation approval.
          # The currently failing A01 catalogue audit remains a HARD GATE
          # for every normal release, unchanged. Never claim it passed.
          if [[ "${CITY_ART_PREVIEW:-false}" != "true" ]]; then
            # Every role exposes ONLY its real rig actions in Animar.
            timeout 240s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
              /tmp/Godot_v4.3-stable_linux.x86_64 \
              --rendering-method gl_compatibility --audio-driver Dummy --path . \
              --script res://tests/test_studio_full_animation_inventory.gd \
              2>&1 | tee /tmp/studio-animation-inventory.log
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/studio-animation-inventory.log; then
              echo 'Incomplete or broken real studio animation catalog'; exit 1
            fi
            grep -F 'PASS ALL STUDIO ANIMATIONS:' /tmp/studio-animation-inventory.log
          else
            echo 'ART PREVIEW ONLY: A01 full animation inventory not executed; model remains unapproved'
          fi
          # The new G13 must actually be selectable in the SAME native
          # combined Studio, with its radar and twin gun mechanisms moving.
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g13_studio_web_v1.gd \
            2>&1 | tee /tmp/g13-studio-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/g13-studio-smoke.log; then
            echo "G13 visual 3D Studio selection regression"; exit 1
          fi
          grep -F 'PASS G13 V1 LIVE STUDIO:' /tmp/g13-studio-smoke.log
          # Prove the real SHARED published scene, NOT a second building
          # viewer. Fails the publication if V9 is absent or the other
          # buildings cannot be selected. Existing Pages remains untouched.
          timeout 240s xvfb-run -a -s '-screen 0 1280x800x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_barracks_v10_gpu.gd \
            2>&1 | tee /tmp/infantry-v10-pages-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/infantry-v10-pages-smoke.log; then
            echo "Published single Studio Infantry V10 regression"; exit 1
          fi
          grep -F 'PASS INFANTRY BARRACKS V10:' /tmp/infantry-v10-pages-smoke.log
          test -s artifacts/tarvoka_infantry_v10_front_close_v10.png
          test -s artifacts/tarvoka_infantry_v10_compare_v10_front.png
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --export-release "Web Studio" build/web/index.html 2>&1 | tee /tmp/studio-publish.log
          if grep -E "SCRIPT ERROR:|ERROR:|Export failed" /tmp/studio-publish.log; then
            exit 1
          fi
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.pck
          test -s build/web/index.wasm
          touch build/web/.nojekyll

      - name: Save actual landscape UI screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-unified-studio-landscape-qa
          path: |
            build/qa/studio-960x540.png
            build/qa/studio-1280x720.png
          if-no-files-found: warn
          retention-days: 14

      # Keep the current HQ V11 gallery as the SAME PUBLIC ROOT.
      # Add the complete tested Battle V8 Studio under /Tarvoka/batalla/.
      # No download or local installation is required for either view.
      - name: Check out V19 winter terrain with V18b real-mesh mountains and V17 battle
        uses: actions/checkout@v4
        with:
          ref: feat/terrain-v19-snow-biome-20261114
          path: battle-source
          persist-credentials: false
      - name: Export V19 snow biome and V18b mountain finish to /batalla/
        shell: bash
        run: |
          set -euo pipefail
          test -s battle-source/scripts/ui/Battle3DMapView.gd
          test -s battle-source/scripts/ui/Battle3DOrders.gd
          test -s battle-source/scripts/ui/BattleTerrain3D.gd
          test -s battle-source/scripts/ui/TerrainStudioDetailV5.gd
          test -s battle-source/scripts/ui/TerrainStudioNaturalV6.gd
