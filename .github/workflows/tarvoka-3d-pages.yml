          grep -q 'BASTIÓN P06 V25 · MODELO ACTUAL' build/web/index.html
          grep -q 'BASTIÓN P06 V25 · ACTUAL' build/web/tanque/index.html
          grep -q 'TANQUE G09 V32' build/web/apc/index.html
          grep -q 'ESTUDIO CENTRAL · BASTIÓN P06 V25' build/web/apc/index.html
          grep -q 'tarvoka-apc-build' build/web/apc/index.html
          cmp -s build/web/index.pck build/web/apc/index.pck
          cmp -s build/web/index.js build/web/apc/index.js
          cmp -s build/web/index.wasm build/web/apc/index.wasm
          touch build/web/.nojekyll

      - name: Upload GitHub Pages web site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - name: Publish native 3D studio
        id: deployment
        uses: actions/deploy-pages@v4
