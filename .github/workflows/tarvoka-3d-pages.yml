            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_studio_v2_review.gd \
            2>&1 | tee /tmp/infantry-v2-studio-review.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/infantry-v2-studio-review.log; then
            echo 'Infantry 3D viewer is not selecting genuine V2 geometry'; exit 1
          fi
          grep -Fq 'PASS INFANTRY V2 SAME STUDIO:' /tmp/infantry-v2-studio-review.log
          # The new G13 must actually be selectable in the SAME native
          # combined Studio, with its radar and twin gun mechanisms moving.
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_g13_studio_web_v1.gd \
            2>&1 | tee /tmp/g13-studio-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/g13-studio-smoke.log; then
            echo "G13 visual 3D Studio selection regression"; exit 1
          fi
          grep -F 'PASS G13 V1 LIVE STUDIO:' /tmp/g13-studio-smoke.log
          # Prove the real SHARED published scene, NOT a second building
          # viewer. Fails the publication if V9 is absent or the other
          # buildings cannot be selected. Existing Pages remains untouched.
          timeout 240s xvfb-run -a -s '-screen 0 1280x800x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_infantry_barracks_v10_gpu.gd \
            2>&1 | tee /tmp/infantry-v10-pages-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/infantry-v10-pages-smoke.log; then
            echo "Published single Studio Infantry V10 regression"; exit 1
          fi
          grep -F 'PASS INFANTRY BARRACKS V10:' /tmp/infantry-v10-pages-smoke.log
          test -s artifacts/tarvoka_infantry_v10_front_close_v10.png
          test -s artifacts/tarvoka_infantry_v10_compare_v10_front.png
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --export-release "Web Studio" build/web/index.html 2>&1 | tee /tmp/studio-publish.log
          if grep -E "SCRIPT ERROR:|ERROR:|Export failed" /tmp/studio-publish.log; then
            exit 1
          fi
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.pck
          test -s build/web/index.wasm
