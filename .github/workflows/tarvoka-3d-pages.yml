      - name: Verify and expose exact Engineer V17 web build identity
        id: studio_identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/tarvoka-engineer-source.sha256
          grep -Fq 'InfantryEngineerV17.apply' scripts/ui/UnitModels3D.gd
          source_sha="$(cat /tmp/tarvoka-studio-source-sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          export STUDIO_SOURCE_SHA="$source_sha"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import html
          import json
          import os
          root = Path('build/web')
          source = Path('scripts/ui/InfantryEngineerOuterArmorV17.gd')
          commit = os.environ['STUDIO_SOURCE_SHA']
          info = {
              'engineer': 'G05 V17',
              'a02': 'V17 EN REVISION',
              'a02_source_sha256': hashlib.sha256(Path('scripts/ui/A02FpvArtV1.gd').read_bytes()).hexdigest(),
              'source_commit': commit,
              'engineer_source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'bundle_sha256': hashlib.sha256((root / 'index.pck').read_bytes()).hexdigest(),
          }
          (root / 'studio-version.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          viewer = root / 'index.html'
          page = viewer.read_text(encoding='utf-8')
          assert page.count('</body>') == 1
          badge = (
              '<div id="tarvoka-engineer-build" role="status" '
              'style="position:fixed;right:8px;bottom:8px;z-index:950;'
              'padding:4px 7px;background:#14202acc;color:#ffe3a5;'
              'font:600 11px system-ui,Arial,sans-serif">'
              'Estudio · G05 V17 incluido · ' + html.escape(commit[:12])
              + ' · <a style="color:inherit" href="?unidad=a02" aria-label="Revisar A02 FPV en el mismo visor">A02 FPV</a>'
              + ' · <a style="color:inherit" href="studio-version.json">versión</a></div>'
          )
          # On A02 inspection URLs the original floating navigation obscures
          # the native model, especially on landscape phones. Preserve every
          # destination in a collapsed native HTML details menu, only here.
          a02_menu = """<script>
          (() => {
            const alias = (new URLSearchParams(location.search).get('unidad') || '').trim().toLowerCase();
            if (!['a02','fpv'].includes(alias)) return;
            const navs = [...document.querySelectorAll('nav[aria-label="Navegacion TARVOKA Estudio 3D"]')];
            const badge = document.getElementById('tarvoka-engineer-build');
            if (!badge || !navs.length) return;
            const menu = document.createElement('details');
            menu.id = 'tarvoka-a02-compact-nav';
            menu.style.cssText = 'position:fixed;left:8px;top:8px;z-index:1001;max-width:min(330px,calc(100vw - 16px));font:600 12px system-ui,Arial,sans-serif;color:#ffe5a0;background:#14202a;border:1px solid #e1c275;border-radius:6px;box-shadow:0 2px 8px #0006';
            const summary = document.createElement('summary');
            summary.textContent = 'Estudio · menú';
            summary.style.cssText = 'padding:7px 10px;cursor:pointer';
            menu.append(summary);
            const panel = document.createElement('div');
            panel.style.cssText = 'display:grid;gap:5px;padding:0 7px 7px;max-height:65vh;overflow:auto';
            for (const nav of navs) {
              nav.style.cssText = 'position:static;margin:0';
              const link = nav.querySelector('a');
              if (link) link.style.cssText = 'display:block;padding:6px 8px;color:#ffe5a0;background:#111d2e;border:1px solid #e1c275;border-radius:4px;text-decoration:none;font-size:12px;overflow-wrap:anywhere';
              panel.append(nav);
            }
            badge.style.cssText = 'position:static;padding:5px 3px;font:600 11px system-ui,Arial,sans-serif;color:#ffe3a5;overflow-wrap:anywhere';
            panel.append(badge);
            menu.append(panel);
            document.body.append(menu);
          })();
          </script>"""
          viewer.write_text(page.replace('</body>', badge + a02_menu + '\n</body>'), encoding='utf-8')
          assert commit[:12] in viewer.read_text(encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('source_commit=' + commit + '\n')
              output.write('bundle_sha256=' + info['bundle_sha256'] + '\n')
          print('Verified Engineer V17 export source:', commit)
          PY

