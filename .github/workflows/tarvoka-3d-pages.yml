          content = viewer.read_text(encoding='utf-8')
          assert content.count('</body>') == 1
          badge = (
              '<div id="tarvoka-apc-build" role="status" '
              'style="position:fixed;right:8px;bottom:8px;z-index:950;'
              'padding:4px 7px;border-radius:6px;'
              'background:#14202acc;color:#ffe3a5;'
              'font:600 11px system-ui,Arial,sans-serif;pointer-events:none">'
              + html.escape(match.group(1)) + ' · ' + revision + '</div>'
          )
          viewer.write_text(
              content.replace('</body>', badge + '\n</body>'),
              encoding='utf-8'
          )
          assert revision in viewer.read_text(encoding='utf-8')
          PY
          test -s build/web/apc/index.html
          test -s build/web/apc/index.pck
      - name: Add visible navigation among HQ V12, Battle V8 and G09 V32 studios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def add_link(filepath, href, label, tooltip, top=16):
              html = filepath.read_text(encoding='utf-8')
              assert html.count('</body>') == 1, filepath
              link = (
                  '<nav aria-label="Navegacion TARVOKA Estudio 3D" '
                  f'style="position:fixed;left:16px;top:{top}px;z-index:1000;'
                  'font:700 14px system-ui,Arial,sans-serif">'
                  f'<a href="{href}" title="{tooltip}" '
                  'style="display:inline-block;padding:12px 16px;'
                  'border:2px solid #e1c275;border-radius:9px;'
                  'background:#111d2e;color:#ffe5a0;'
                  'box-shadow:0 4px 15px #0009;text-decoration:none">'
                  f'{label}</a></nav>'
              )
              filepath.write_text(
                  html.replace('</body>', link + '\n</body>'),
                  encoding='utf-8'
              )

          add_link(Path('build/web/index.html'),
                   'batalla/', 'BATALLA 3D · MAPAS Y COMBATE',
                   'Abre el mapa 3D interactivo, terreno y ordenes confirmadas')
          # G09 V32 now loads natively from the main catalogue and the same
          # Godot SubViewport as all buildings; /tanque/ stays as archival QA.
          add_link(Path('build/web/batalla/index.html'),
                   '../', 'VOLVER AL ESTUDIO · UNIDADES Y EDIFICIOS',
                   'Volver al Estudio principal con Cuartel General V11')
          add_link(Path('build/web/batalla/index.html'),
                   '../tanque/', 'TANQUE G09 V32 · MODELO REAL',
                   'G09 V32 · revisar movimiento, torreta, disparos, daños e impactos sin APK', 76)
          add_link(Path('build/web/tanque/index.html'),
                   '../', 'VOLVER AL ESTUDIO · UNIDADES Y EDIFICIOS',
                   'Abrir Cuartel General y facciones')
          add_link(Path('build/web/tanque/index.html'),
                   '../batalla/', 'BATALLA 3D · MAPAS Y COMBATE',
                   'Ver terreno y combate en 3D', 76)
          add_link(Path('build/web/index.html'),
                   'batalla-g09/', 'BATALLA G09 V32 · JUGABLE',
                   'Prueba G09 V25 final con LOD invisible: sin cambios de silueta entre distancias', 136)
          add_link(Path('build/web/batalla/index.html'),
                   '../batalla-g09/', 'PROBAR G09 V32 EN BATALLA',
                   'Comprobar mismo diseño V25 al acercar, alejar y activar ECO', 136)
          add_link(Path('build/web/tanque/index.html'),
                   '../batalla-g09/', 'G09 V32 · PARTIDA REAL',
                   'Abrir G09 V25 uniforme en batalla real, incluso en modo ECO', 136)
          add_link(Path('build/web/batalla-g09/index.html'),
                   '../', 'ESTUDIO · EDIFICIOS Y UNIDADES',
                   'Regresar al Estudio TARVOKA')
          add_link(Path('build/web/batalla-g09/index.html'),
                   '../batalla/', 'MAPA 3D ACTUAL',
                   'Volver al visor de terreno avanzado', 76)
          add_link(Path('build/web/batalla-g09/index.html'),
                   '../tanque/', 'G09 · REVISIÓN ARTÍSTICA',
                   'Inspeccionar materiales de tanque V25 y escenarios V26', 136)
          add_link(Path('build/web/index.html'),
                   'apc/', 'BASTIÓN P06 V25 · MODELO ACTUAL',
                   'Bastión V25 con las seis carcasas cerradas y controles de inspección', 196)
          add_link(Path('build/web/tanque/index.html'),
                   '../apc/', 'BASTIÓN P06 V25 · ACTUAL',
                   'Inspeccionar Bastión V25 sin alterar G09 V32', 196)
          add_link(Path('build/web/batalla/index.html'),
                   '../apc/', 'BASTIÓN P06 V25 · MODELO ACTUAL',
                   'Revisar los seis neumáticos completos y sus daños', 196)
          add_link(Path('build/web/apc/index.html'),
                   '../', 'ESTUDIO CENTRAL · BASTIÓN P06 V25',
                   'Volver al Estudio TARVOKA con Bastión V25')
          add_link(Path('build/web/apc/index.html'),
                   '../tanque/', 'TANQUE G09 V32 · FINAL',
