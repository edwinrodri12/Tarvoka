& github.event.pull_request.head.ref == 'feat/a01-v13-tail-gimbal-surface-polish-20261123' && 'tarvoka-a01-v13-unique-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/a01-recon-v11-aerodynamic-body-and-conformal-paint-20261122' && 'tarvoka-a01-v12-unique-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/hq-v24-live-shared-pages-integration-20261121' && 'tarvoka-hq-v24-actual-pages-check' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'art/engineer-v11-integrated-hq-v24-20261121' && 'tarvoka-engineer-v11-hq24-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'art/engineer-v10-anatomic-arms-workhand-20261121' && 'tarvoka-engineer-v10-native-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/infantry-engineer-v6-360-hinge-continuity-20261121' && 'tarvoka-engineer-v6-hinge-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/a01-recon-uav-v1-studio-20261120' && 'tarvoka-a01-v6-native-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/infantry-six-core-camps-20261120' && 'tarvoka-infantry-six-camps-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/infantry-v3-tactical-color-lod-studio-20261120' && 'tarvoka-infantry-v3-tactical-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/infantry-v2-in-one-studio-20261120' && 'tarvoka-infantry-v2-native-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/g16-v6-consolidated-service-hardware-20261120' && 'tarvoka-g16-v6-native-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/g16-v5-materials-glazing-damage-20261120' && 'tarvoka-g16-v5-native-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/g16-v4-body-sculpt-wreck-studio-20261119' && 'tarvoka-g16-v4-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/g16-v1-armored-logistics-studio-20261119' && 'tarvoka-g16-v3-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/g15-v11-wheel-sidewall-cab-360-20261119' && 'tarvoka-g15-v11-pages-review' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/g15-v11b-physical-contour-closure-20261119' && 'tarvoka-g15-v11b-pages-review' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(studio): ship civilian city V16 unified buildings') && 'tarvoka-city-v16-native-publish' || github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push') && 'tarvoka-pages-ignored-checks' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'art(infantry): integrate Engineer V11') && 'tarvoka-engineer-v11-hq24-publish' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(workshop-pages):') && 'tarvoka-workshop-auto-lod-publish' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(g16-pages):') && 'tarvoka-g16-v3-verified-main-publish' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(g16-v4-pages):') && 'tarvoka-g16-v4-verified-main-deploy' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(g16-v5-pages):') && 'tarvoka-g16-v5-verified-main-publish' || (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && 'tarvoka-native-studio-main-publish' || github.event_name == 'pull_request' && format('tarvoka-native-studio-pr-{0}', github.event.pull_request.number) || 'tarvoka-native-3d-studio-build' }}
