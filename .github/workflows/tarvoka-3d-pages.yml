          /tmp/Godot_v4.3-stable_linux.x86_64 --headless \
            --path apc-p06-source --export-release 'Web Studio' \
            build/web/index.html 2>&1 | tee /tmp/apc-p06-pages-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Export failed' /tmp/apc-p06-pages-export.log; then
