  workflow_run:
    workflows: ["TARVOKA Browser 3D Art Studio", "TARVOKA G09 V32 native animation filmstrips and QA", "TARVOKA G09 V32 final animation and Android QA", "TARVOKA APC P06 V3 Roof, Turret and Five-Stage Damage QA", "TARVOKA Airbase V6 Architecture and Real Godot Visual QA", "TARVOKA Airbase V7 Native PBR Textures and Weathering GPU QA", "TARVOKA Airbase V8 Glass, Hangar Lighting and Grime Godot QA", "TARVOKA Airbase V9 Panoramic Glass 360 Degree Model QA", "TARVOKA Airbase V10 Roof Supports and Rear Facade Godot QA", "TARVOKA Airbase V11 Exposed Trusses and Damage Godot QA", "TARVOKA Airbase V12 Charred Steel and Explosion Debris Godot QA", "TARVOKA Airbase V13 Material Specific Combat Impacts Godot QA", "TARVOKA Airbase V14 Persistent Impact Scars Godot QA", "TARVOKA Airbase V15 Organic Fracture and Char Godot QA", "TARVOKA Airbase V16 Final 360 Degree Visual Acceptance Godot QA", "TARVOKA Naval Base V1 Native Godot Visual QA", "TARVOKA Naval Base V2 Quays Hangar Crane Water Godot QA", "TARVOKA Naval Base V3 Berths Ramps Shipyard Native Godot QA", "TARVOKA Naval Base V4 Marine Weathering Coast Native Godot QA", "TARVOKA Naval Base V5 Shipyard Signage Lighting Native Godot QA", "TARVOKA Naval Base V6 Night Readability LOD Native Godot QA", "TARVOKA Naval Base V7 Boarding Detail Native Godot QA", "TARVOKA Naval Base V8 Fenders Foam Shipyard Native Godot QA", "TARVOKA Naval Base V9 Sculpted Fenders PBR Native Godot QA", "TARVOKA Naval Base V10 Mooring Alignment Native Godot QA", "TARVOKA Naval Base V11 Contact Seals Chain Native Godot QA", "TARVOKA Naval Base V12 Final 360 Contact Chain Native Godot QA", "TARVOKA Naval Base V13 Visual Audit Cameras Native Godot QA", "TARVOKA Infantry Barracks V1 Three Distinct Levels Native Godot QA", "TARVOKA Infantry Barracks V3 Procedural Materials Native Godot QA", "TARVOKA Infantry Barracks V4 Real Rear and Side Facades Native Godot QA", "TARVOKA Infantry Barracks V5 Tower Clearance and Detail Native Godot QA"]
    types: [completed]
    branches:
      - feat/naval-base-v2-quays-hangar-crane-water-20261115
      - feat/naval-base-v3-berths-ramps-shipyard-20261115
      - feat/naval-base-v4-marine-weathering-coast-20261115
      - feat/naval-base-v5-shipyard-signage-lighting-20261115
      - feat/naval-base-v6-night-readability-lod-20261115
      - feat/naval-base-v7-boarding-detail-20261115
      - feat/naval-base-v8-fenders-foam-shipyard-20261115
      - feat/naval-base-v9-sculpted-fenders-pbr-20261115
      - feat/naval-base-v10-mooring-alignment-20261115
      - feat/naval-base-v11-contact-seals-chain-20261115
      - feat/naval-base-v12-final-360-contact-chain-20261115
      - feat/naval-base-v13-visual-audit-cameras-20261115
      - feat/infantry-barracks-v1-three-distinct-levels-20261116
      - feat/infantry-barracks-v3-procedural-materials-20261116
      - feat/infantry-barracks-v4-rear-side-facades-20261116
      - feat/infantry-barracks-v5-final-corner-clearance-20261116
      - feat/terrain-v19-snow-biome-20261114
      - feat/g09-v32-studio-final-animation-20261114
      - feat/g09-v32-final-animation-pass-20261114
      - feat/apc-p06-v3-roof-armor-wear-damage-20261114

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Unrelated PR workflow_run completions must NOT evict a real Pages
  # publication from the single pending slot of the publish group.
  # Keep actual push/successful source releases serialized as before.
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push') && 'tarvoka-pages-ignored-checks' || 'tarvoka-public-studio-pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out native HQ V21 complete rear geometry and staged hit animation studio with nine original Android HQ V15 sprites
        uses: actions/checkout@v4
        with:
          ref: feat/infantry-barracks-v5-final-corner-clearance-20261116
          persist-credentials: false
      - name: Retrieve the exact nine V15 sprites shipped by Android
        uses: actions/checkout@v4
        with:
          ref: main
          path: hq-android-v15
          persist-credentials: false
      - name: Include V15 source PNGs in the HQ 3D showroom before import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png"
            cp "hq-android-v15/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s hq-android-v15/assets/buildings/hq_v15/hq_neutral.png
          cp hq-android-v15/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          # The publisher keeps the complete HQ/Airbase/G09 web studio from its
          # release branch. Only P06 model/animation files and an additive
          # subclass adapter come from main; no building assets are replaced.
          for item in UnitModels3D.gd AttackHelicopterV1.gd AttackHelicopterCabinV2.gd AttackHelicopterRotorV3.gd AttackHelicopterEnginesV4.gd AttackHelicopterLandingV5.gd AttackHelicopterLandingFinishV6.gd AttackHelicopterReadabilityV7.gd AttackHelicopterSilhouetteV8.gd AttackHelicopterFinishV10.gd BastionVisualRig3D.gd BastionDamage3D.gd BastionStudioAdapter.gd APCArtV1.gd APCArmorV2.gd APCBatchingV4.gd APCFinishV3.gd APCDetailV5.gd APCFinishV6.gd APCMachineGunV7.gd APCDamageV7.gd APCRearDesignV10.gd APCExteriorV11.gd APCTurretV12.gd APCSurfaceV13.gd APCWheelV14.gd APCUndercarriageV15.gd APCJointFinishV16.gd APCContourV17.gd APCWheelwellV18.gd APCUnifiedFlankV19.gd APCMicrodetailV20.gd APCMaterialFinishV21.gd APCWeatherFinishV22.gd APCTireFinishV23.gd APCRubberArchV24.gd APCClosedTiresV25.gd APCTacticalLOD8.gd APCDistanceLODControllerV9.gd APCWeaponAudioV8.gd APCVisualRigV1.gd G11Art3D.gd G11VisualRig3D.gd G11FinishV2.gd G11SurfaceV3.gd G11GeometryV4.gd G11MechanicsV5.gd G11DamageSculptV6.gd G11DamageAtmosphereV7.gd G11SequentialSalvoV8.gd G11ExhaustV9.gd G11CooldownV10.gd G11ArmorFinishV11.gd G11CabChassisV12.gd G11TracksFactionV13.gd G11MechanicalDetailV14.gd G11AftPodFinishV15.gd G11FrontFrameV16.gd G11SurfaceWeatherV17.gd G11TrackAssemblyV18.gd G11TrackFinishV19.gd G11WheelSuspensionV20.gd G11ShockMountFinishV21.gd G11SuspensionJointsV22.gd G11JointFinishV23.gd G11MobileLOD.gd G11TacticalReadabilityV24.gd G11BattleLODControllerV25.gd G11BattleContextV25.gd G11RocketFaceReadabilityV25.gd G11TacticalPaintReadabilityV27.gd G11CameraIdentityV28.gd G11BattleActionsV29.gd G11RearUndercarriageV30.gd G11RocketTrailsV30.gd G11RocketFlightV31.gd G11RunningGearV32.gd G11FinalAuditV33.gd G13MobileAirDefenseV1.gd G13DetailV2.gd BattleTerrain3D.gd TerrainVisualMapBridge3D.gd TerrainSurfaceFinish3D.gd TerrainSurfaceSampler3D.gd TerrainStudioRoadShore3D.gd TerrainStudioSnowPaletteV15.gd WinterBattleBiome.gd; do
            test -s "hq-android-v15/scripts/ui/${item}"
            cp "hq-android-v15/scripts/ui/${item}" "scripts/ui/${item}"
          done
          test -s hq-android-v15/tests/test_bastion_studio_web_ui.gd
          cp hq-android-v15/tests/test_bastion_studio_web_ui.gd tests/test_bastion_studio_web_ui.gd
          test -s hq-android-v15/tests/test_g13_studio_web_v1.gd
          cp hq-android-v15/tests/test_g13_studio_web_v1.gd tests/test_g13_studio_web_v1.gd
          test -s scenes/UnitArtStudioWeb.tscn
          sed -i 's|res://scripts/ui/CombinedArtStudioWeb.gd|res://scripts/ui/BastionStudioAdapter.gd|' scenes/UnitArtStudioWeb.tscn
          grep -q 'res://scripts/ui/BastionStudioAdapter.gd' scenes/UnitArtStudioWeb.tscn
          rm -rf hq-android-v15
          test "$(find assets/buildings/hq_v15 -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      # Merge the approved tank into the EXISTING single native Godot scene.
      # This copy occurs AFTER the pinned buildings/APC setup, BEFORE import
      # and export. Keep the building catalogue and all other unit meshes.
      - name: Check out approved G09 V32 for unified studio
        uses: actions/checkout@v4
        with:
          ref: feat/g09-v32-studio-final-animation-20261114
          path: g09-unified-source
          persist-credentials: false
      - name: Integrate G09 V32 native model and controls in central engine
        shell: bash
        run: |
          set -euo pipefail
          test -s g09-unified-source/tests/test_g09_animation_final_v32.gd
          test -s g09-unified-source/scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/CombinedArtStudioWeb.gd
          test -s scripts/ui/BastionStudioAdapter.gd
          # Only the tank-specific modules and the compatible base inspector
          # are exchanged. HQ, naval base, airbase, barracks, APC, G11 and
          # helicopter modules retain their existing tested implementations.
          cp g09-unified-source/scripts/ui/Tank*.gd scripts/ui/
          # Preserve post-V32 new roles (notably G13) while upgrading the
          # approved tank geometry and rig from the exact V32 branch.
          cp scripts/ui/UnitModels3D.gd /tmp/tarvoka-models-before-g09.gd
          cp g09-unified-source/scripts/ui/UnitModels3D.gd scripts/ui/UnitModels3D.gd
          cp g09-unified-source/scripts/ui/UnitArtStudioWeb.gd scripts/ui/UnitArtStudioWeb.gd
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ui/UnitModels3D.gd')
          current=p.read_text()
          previous=Path('/tmp/tarvoka-models-before-g09.gd').read_text()
          def replace_once(old,new):
              global current
              assert current.count(old)==1, 'G09 bridge mismatch: '+old[:65]
              current=current.replace(old,new,1)
          assert 'const G13AA = preload(' in previous
          assert 'const G13DetailV2 = preload(' in previous
          replace_once('const ROLES := ["line","scout","apc","tank","mlrs","attack_heli","fighter","destroyer"]',
              'const ROLES := ["line","scout","apc","tank","mlrs","attack_heli","fighter","destroyer","aa_mobile"]')
          replace_once('const VisualStyle = preload(',
              'const G13AA = preload("res://scripts/ui/G13MobileAirDefenseV1.gd")\n'
              'const G13DetailV2 = preload("res://scripts/ui/G13DetailV2.gd")\n'
              'const VisualStyle = preload(')
          replace_once('"destroyer":5.10', '"destroyer":5.10,\n    "aa_mobile":3.85')
          replace_once('        "destroyer":\n            _destroyer(model)',
              '        "destroyer":\n            _destroyer(model)\n'
              '        "aa_mobile":\n'
              '            if not G13AA.build(model,faction_paint_color(faction),'
              ' finish_enabled and art_level>=13):\n'
              '                return null\n'
              '            if finish_enabled and art_level>=13:\n'
              '                G13DetailV2.apply(model,faction_paint_color(faction))')
          replace_once('    else:\n        model.scale = Vector3.ONE * 0.83',
              '    elif role=="aa_mobile":\n'
              '        model.scale=Vector3.ONE*0.83\n'
              '        model.position.y=0.0\n'
              '    else:\n        model.scale = Vector3.ONE * 0.83')
          # The V32 branch predates the shared pose_model API. Add only
          # the preview role callbacks that the G13 inspection controls need.
          insert = (
              'static func pose_model(role: String, model: Node3D, kind: String,\n'
              '        progress: float, target_heading: Vector2i = Vector2i(0,-1)) -> bool:\n'
              '    if role=="aa_mobile":\n'
              '        return G13AA.pose(model,kind,progress,target_heading)\n'
              '    if role=="tank":\n'
              '        return TankRig.pose(model,kind,progress,target_heading)\n'
              '    return false\n\n'
              'static func restore_model_pose(role: String, model: Node3D) -> void:\n'
              '    if role=="aa_mobile":\n'
              '        G13AA.restore(model)\n'
              '    elif role=="tank":\n'
              '        TankRig.restore(model)\n\n'
          )
          replace_once('static func inspect_meshes(model: Node) -> int:',
              insert+'static func inspect_meshes(model: Node) -> int:')
          p.write_text(current)
          assert 'TankTrackAlignmentV31.apply(model)' in current
          assert 'G13DetailV2.apply(model' in current
          assert '"aa_mobile"' in current
          PY
          test -s scripts/ui/G13MobileAirDefenseV1.gd
          test -s scripts/ui/G13DetailV2.gd
          test -s scripts/ui/TankTrackAlignmentV31.gd
          test -s scripts/ui/TankHitReactionV30.gd
          grep -q 'var _v31_preview := false' scripts/ui/UnitArtStudioWeb.gd
          grep -q 'TankTrackAlignmentV31.apply' scripts/ui/UnitModels3D.gd
          grep -q 'Tanque G09 · V32 FINAL' scripts/ui/BastionStudioAdapter.gd
          # Avoid Godot importing a second project with duplicate class_name.
          rm -rf g09-unified-source
      - name: Download Godot 4.3 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$T"
          cp /tmp/godot-templates/templates/web_*.zip "$T/"
          test -s "$T/web_nothreads_release.zip"
          printf '4.3.stable\n' > "$T/version.txt"
      - name: Select native 3D scene and deployed revision watermark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets build/web
          # The editor draws its original HQ base from a pinned feature
          # branch, but Bastion P06 is overlaid from this main revision.
          # Show the deployed revision, not the misleading older HQ SHA.
          printf 'Bastión P06 · seis carcasas de neumáticos cerradas V25 · revisión %s\n' "${GITHUB_SHA:0:12}" > assets/art_studio_revision.txt
          test "$(git branch --show-current)" = "feat/infantry-barracks-v5-final-corner-clearance-20261116" || test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/infantry-barracks-v5-final-corner-clearance-20261116)"
          test -s scripts/ui/HeadquartersFinishV8.gd
          test -s scripts/ui/HeadquartersArchitectureV7.gd
          test -s scripts/ui/HeadquartersEmblems3D.gd
          test -s tests/test_headquarters_v8.gd
          test -s scripts/ui/HeadquartersReadabilityV9.gd
          test -s tests/test_headquarters_v9_faction_gallery.gd
          test -s scripts/ui/HeadquartersSurfaceV10.gd
          test -s tests/test_headquarters_v10_surfaces.gd
          test -s scripts/ui/HeadquartersRefinementV11.gd
          test -s tests/test_headquarters_v11_lighting.gd
          test -s scripts/ui/HeadquartersSilhouetteV12.gd
          test -s scripts/ui/HeadquartersProductionV13.gd
          test -s tests/test_headquarters_v13_production.gd
          test -s scripts/ui/HeadquartersSpriteStudioV16.gd
          test -s scripts/ui/HeadquartersClimateV17.gd
          test -s tests/test_hq_v17_weather_terrain.gd
          test -s scripts/ui/HeadquartersWayfindingV18.gd
          test -s tests/test_hq_v18_wayfinding.gd
          test -s scripts/ui/HeadquartersFacadeV19.gd
          test -s tests/test_hq_v19_facade_stress.gd
          test -s tests/test_hq_v20_walls_weather_release.gd
          test -s scripts/ui/HeadquartersDamageV21.gd
          test -s scripts/ui/HeadquartersImpactV21.gd
          test -s tests/test_hq_v21_rear_damage_impacts.gd
          test -s scripts/ui/HeadquartersDamageV22.gd
          test -s scripts/ui/HeadquartersFireV22.gd
          test -s tests/test_hq_v22_progressive_damage_fire.gd
          test -s scripts/ui/HeadquartersSmokeV23.gd
          # Airbase V1 ships INSIDE the existing 3D building selector:
          # preserve existing HQ V23, terrain, G09 tank and APC sources.
          test -s scripts/ui/BastionVisualRig3D.gd
          test -s scripts/ui/BastionDamage3D.gd
          test -s scripts/ui/BastionStudioAdapter.gd
          test -s scripts/ui/AttackHelicopterV1.gd
          test -s scripts/ui/AttackHelicopterCabinV2.gd
          test -s scripts/ui/AttackHelicopterRotorV3.gd
          test -s scripts/ui/AttackHelicopterEnginesV4.gd
          test -s scripts/ui/AttackHelicopterLandingV5.gd
          test -s scripts/ui/AttackHelicopterLandingFinishV6.gd
          test -s scripts/ui/AttackHelicopterReadabilityV7.gd
          test -s scripts/ui/AttackHelicopterSilhouetteV8.gd
          test -s scripts/ui/AttackHelicopterFinishV10.gd
          test -s scripts/ui/G11Art3D.gd
          test -s scripts/ui/G11VisualRig3D.gd
