name: TARVOKA V43 real browser city visibility diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/city-v43-browser-visibility-diagnostic.yml"
permissions:
  contents: read
jobs:
  browser-city-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - name: Check out native V43 city art only
        uses: actions/checkout@v4
        with:
          ref: art/cities-v8-rear-facades-rooftops-20261117
      - name: Get Godot 4.3 engine and matching Web templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/diag-godot.zip
          unzip -oq /tmp/diag-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/diag-templates.tpz
          mkdir -p /tmp/diag-templates
          unzip -oq /tmp/diag-templates.tpz -d /tmp/diag-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp /tmp/diag-templates/templates/web_*.zip "$HOME/.local/share/godot/export_templates/4.3.stable/"
          printf '4.3.stable\n' > "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"
      # Probe stable city D0 overview, with explicit camera framing and LOD1.
      # Final V43 regression: quick camera controls stay available, the
      # full city is visible and full historical tools are scroll archived.
      # Verify V43's scrollable camera archive keeps a real WebGL canvas
      # on screen at 1280x720 after removing the 200-button layout overflow.
      - name: Create non-production real city visibility probe
        shell: bash
        run: |
          set -euo pipefail
          # The art branch contains a legacy integrated-studio adapter whose
          # inherited CombinedArtStudioWeb.gd is absent. The standalone V43
          # viewer never uses either adapter. Remove only these dead scripts
          # from this disposable diagnostic checkout so unrelated parse errors
          # cannot mask the real browser framebuffer result.
          rm -f scripts/ui/CivilianCityStudioAdapter.gd scripts/ui/BastionStudioAdapter.gd
          # In Godot 4.3 Web export, default 1000-instance threaded culling
          # blanks all 3D geometry with no runtime error. The art Web build
          # must explicitly disable it; this test MUST fail without the fix.
          grep -Fx 'limits/spatial_indexer/threaded_cull_minimum_instances=1000000' project.godot
          cat > scripts/ui/CivilianCityWebVisibilityProbe.gd <<'GDSCRIPT'
          extends "res://scripts/ui/CivilianCityDesignStudioV43.gd"

          func _ready() -> void:
              super._ready()
              _probe.call_deferred()

          func _probe() -> void:
              await get_tree().create_timer(3.0).timeout
              for config in [[1,1],[0,0],[1,0],[2,0],[2,1],[2,2],[0,1],[1,2]]:
                  var tier: int=int(config[0])
                  var lod: int=int(config[1])
                  var key: String="%d-%d" % [tier,lod]
                  JavaScriptBridge.eval("window.__cityQaStage='loading-%s';" % key)
                  _tier.select(tier)
                  _damage.select(0)
                  _lod.select(lod)
                  var began: int=Time.get_ticks_msec()
                  _rebuild()
                  _orient_camera()
                  if _model==null:
                      push_error("CITY WEB PROBE: no model for "+key)
                      JavaScriptBridge.eval("window.__cityQaStage='failed-%s';" % key)
                      return
                  var visible: int=Cities.drawable_count(_model)
                  var count: int=int(_model.get_meta("city_mesh_count",-1))
                  print("CITY WEB PROBE model ",key," visible=",visible," count=",count," millis=",Time.get_ticks_msec()-began," viewport=",viewport.size," frame=",viewport.get_parent().size)
                  await get_tree().create_timer(2.0).timeout
                  JavaScriptBridge.eval("window.__cityQaStage='visible-%s';" % key)
                  await get_tree().create_timer(4.0).timeout
                  _model.visible=false
                  JavaScriptBridge.eval("window.__cityQaStage='hidden-%s';" % key)
                  await get_tree().create_timer(3.0).timeout
                  _model.visible=true
              JavaScriptBridge.eval("window.__cityQaStage='done';")
          GDSCRIPT
          sed -i 's|res://scripts/ui/CivilianCityDesignStudioV43.gd|res://scripts/ui/CivilianCityWebVisibilityProbe.gd|' scenes/CivilianCityDesignStudioV43.tscn
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/CivilianCityDesignStudioV43.tscn"|' project.godot
          grep -q 'run/main_scene="res://scenes/CivilianCityDesignStudioV43.tscn"' project.godot
          cat >> export_presets.cfg <<'PRESET'

          [preset.1]
          name="Web City Diagnostic"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/city-preview/index.html"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=false
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          PRESET
      - name: Export actual native city model to WebGL2 browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/city-preview
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/city-qa-import.log
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Web City Diagnostic" build/city-preview/index.html 2>&1 | tee /tmp/city-qa-export.log
          for part in index.html index.js index.pck index.wasm; do test -s build/city-preview/$part; done
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed|Export failed' /tmp/city-qa-import.log /tmp/city-qa-export.log; then
            exit 1
          fi
      - name: Test actual WebGL frame against hidden real city using Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save playwright-core pngjs
          python3 -m http.server 8123 --directory build/city-preview > /tmp/city-browser-http.log 2>&1 &
          sleep 2
          mkdir -p artifacts
          cat > /tmp/city-qa-browser.cjs <<'JAVASCRIPT'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const {PNG}=require(process.cwd()+'/node_modules/pngjs');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({
              headless:true,executablePath:'/usr/bin/google-chrome',
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
                '--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']
            });
            const page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
            const errors=[];
            page.on('console',msg=>{
              const line='BROWSER '+msg.type()+' '+msg.text();
              if(msg.type()==='error') errors.push(line);
              if(/CITY WEB PROBE|ERROR:|Could not create render|INVALID_VALUE/.test(line)) console.log(line);
            });
            page.on('pageerror',e=>{errors.push(String(e));console.log('BROWSER JS ERROR',String(e));});
            page.on('requestfailed',req=>{
              const line='NETWORK FAILED '+req.url()+' '+req.failure()?.errorText;
              console.log(line);errors.push(line);
            });
            await page.goto('http://127.0.0.1:8123/',{waitUntil:'domcontentloaded',timeout:60000});
            const configs=[[1,1],[0,0],[1,0],[2,0],[2,1],[2,2],[0,1],[1,2]];
            const results=[];
            for(const [tier,lod] of configs){
              const key=tier+'-'+lod;
              await page.waitForFunction(key=>window.__cityQaStage==='visible-'+key||
                window.__cityQaStage==='failed-'+key, key, {timeout:150000});
              if(await page.evaluate(()=>window.__cityQaStage)==='failed-'+key)throw Error('Missing Godot model '+key);
              await page.waitForTimeout(600);
              const visible=await page.screenshot({path:'artifacts/city-tier'+tier+'-lod'+lod+'-visible.png'});
              await page.waitForFunction(key=>window.__cityQaStage==='hidden-'+key,key,{timeout:15000});
              await page.waitForTimeout(600);
              const hidden=await page.screenshot({path:'artifacts/city-tier'+tier+'-lod'+lod+'-hidden.png'});
              const a=PNG.sync.read(visible),b=PNG.sync.read(hidden);
              let changed=0,strong=0;
              for(let y=72;y<a.height-68;y+=4)for(let x=80;x<a.width-80;x+=4){
                const o=(y*a.width+x)*4;
                const d=Math.abs(a.data[o]-b.data[o])+Math.abs(a.data[o+1]-b.data[o+1])+Math.abs(a.data[o+2]-b.data[o+2]);
                if(d>40)changed++;
                if(d>150)strong++;
              }
              results.push({tier,lod,changed,strong});
              console.log('CITY CHROME ACTUAL PIXELS',JSON.stringify(results[results.length-1]));
            }
            await browser.close();
            const blank=results.filter(r=>r.changed<250||r.strong<60);
            console.log('CITY CHROME MATRIX',JSON.stringify(results));
            console.log('BROWSER ERRORS',JSON.stringify(errors.slice(-15)));
            if(blank.length)throw Error('No visible city geometry in actual WebGL cases '+JSON.stringify(blank));
            console.log('PASS REAL WEB V43 ALL TIERS LOD MATRIX');
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JAVASCRIPT
          node /tmp/city-qa-browser.cjs
      - name: Upload browser screenshots and HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-city-real-webgl-visibility
          path: artifacts/
          if-no-files-found: warn
