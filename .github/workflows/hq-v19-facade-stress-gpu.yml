name: TARVOKA HQ V19 Facade Crest and 144 Buildings GPU QA

on:
  push:
    branches:
      - feat/hq-v19-facade-crest-stress-20261114
    paths:
      - "scripts/ui/HeadquartersFacadeV19.gd"
      - "scripts/ui/HeadquartersProductionV13.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_hq_v19_facade_stress.gd"
      - ".github/workflows/hq-v19-facade-stress-gpu.yml"
  pull_request:
    paths:
      - "scripts/ui/HeadquartersFacadeV19.gd"
      - "scripts/ui/HeadquartersProductionV13.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_hq_v19_facade_stress.gd"
      - ".github/workflows/hq-v19-facade-stress-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Bring the actual V15 PNGs from the Android game
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-android
          persist-credentials: false
      - name: Copy precisely nine approved PNGs and isolate Android code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "source-android/assets/buildings/hq_v15/hq_${i}.png"
            cp "source-android/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s source-android/assets/buildings/hq_v15/hq_neutral.png
          cp source-android/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          rm -rf source-android
          test "$(find assets/buildings/hq_v15 -name '*.png' | wc -l)" -eq 9
      - name: Install native Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/hq19-godot.zip
          unzip -q /tmp/hq19-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          timeout --signal=TERM --kill-after=5s 120s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/hq19-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/hq19-import.log; then
            echo "HQ V19 architectural lighting import failed" >&2; exit 1
          fi
      - name: Native GPU test 20 bevels, authentic crest and 49/100/144 HQ stress
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_hq_v19_facade_stress.gd 2>&1 | tee /tmp/hq19-gpu.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/hq19-gpu.log; then
            echo "HQ V19 architecture regression" >&2; exit 1
          fi
          grep -q "PASS HQ V19:" /tmp/hq19-gpu.log
          for image in \
            tarvoka_hq_v19_day_facade_crest.png \
            tarvoka_hq_v19_night_glass_alignment.png \
            tarvoka_hq_v19_rain_facade_crest.png \
            tarvoka_hq_v19_stress_49_buildings.png \
            tarvoka_hq_v19_stress_100_buildings.png \
            tarvoka_hq_v19_stress_144_buildings.png; do
            test -s "artifacts/$image"
          done
      - name: Archive real GPU visuals
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-HQ-V19-Facade-Crest-Stress-GPU
          retention-days: 30
          if-no-files-found: error
          path: artifacts/tarvoka_hq_v19_*.png
