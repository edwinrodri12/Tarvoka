name: Mountain cover and movement integration (Godot 4.3)
on:
  pull_request:
    paths:
      - 'tests/test_mountain_cover_movement_integration.gd'
      - 'scripts/core/Rules.gd'
      - 'scripts/core/TerrainTactics.gd'
      - 'scripts/core/Combat.gd'
      - '.github/workflows/mountain-cover-integration.yml'
  workflow_dispatch:

jobs:
  mountain-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Validate mountain movement, cover and counterattack
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_mountain_cover_movement_integration.gd 2>&1 | tee /tmp/mountain-integration.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/mountain-integration.log; then
            echo 'Godot mountain integration regression'; exit 1
          fi
          grep -F 'PASS: mountain movement and positional combat integration' /tmp/mountain-integration.log
