name: TARVOKA HQ V24 FPS HUD live battle QA
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ui/City3DPerfProbeV7.gd"
      - "tests/test_hq_v24_real_device_fps_hud.gd"
      - ".github/workflows/hq-v24-real-device-hud-qa.yml"
  push:
    branches: [feat/hq-v24-real-android-fps-overlay-20261121]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-hq-fps-hud:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot 4.3 native engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/hq24-fps-godot.zip
          unzip -oq /tmp/hq24-fps-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Import same playable scene used on Android
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ui/BastionStudioAdapter.gd scripts/ui/ArmoredWorkshopStudioAdapterV1.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 \
            --headless --editor --path . --import --quit \
            2>&1 | tee /tmp/hq24-fps-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' \
              /tmp/hq24-fps-import.log; then exit 1; fi
      - name: Verify actual battle models and read-only in-game FPS overlay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 140s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/test_hq_v24_real_device_fps_hud.gd \
            2>&1 | tee /tmp/hq24-fps-hud.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:|ERROR:' \
              /tmp/hq24-fps-hud.log; then exit 1; fi
          grep -F 'PASS HQ V24 REAL DEVICE HUD:' /tmp/hq24-fps-hud.log
      - name: Archive real engine test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-hq-v24-fps-hud-native-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/hq24-fps-import.log
            /tmp/hq24-fps-hud.log
