name: TARVOKA phase 05 isolated role ability and AI proposal A-B

on:
  pull_request:
    paths:
      - "scripts/experiments/BalanceProposalV05.gd"
      - "tests/test_balance_phase05_proposals.gd"
      - "docs/BALANCE_PHASE05_PROPOSALS_20261115.md"
      - ".github/workflows/balance-phase05-proposals.yml"
  workflow_dispatch:

jobs:
  isolated_proposals:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Obtain Godot 4.3 official
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compare existing mechanics and isolated proposals
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 200s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --quit-after 5 --path . \
            --script res://tests/test_balance_phase05_proposals.gd \
            2>&1 | tee /tmp/tarvoka-proposals-phase05.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-proposals-phase05.log; then
            echo 'Proposed ability audit failed'; exit 1
          fi
          grep -Fq 'PASS balance phase05:' /tmp/tarvoka-proposals-phase05.log
