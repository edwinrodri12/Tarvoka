name: TARVOKA capture-aware AI paired strategic audit

on:
  pull_request:
    paths:
      - "scripts/experiments/CaptureAwareAIV01.gd"
      - "scripts/experiments/CaptureExperimentV01.gd"
      - "tests/test_capture_aware_ai_ab_v01.gd"
      - ".github/workflows/capture-aware-ai-ab-v01.yml"
  workflow_dispatch:

jobs:
  paired_ai:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Replay 16 mirrored matches with and without friendly siege coordination
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 780s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_capture_aware_ai_ab_v01.gd \
            2>&1 | tee /tmp/tarvoka-capture-aware-ai-ab-v01.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-capture-aware-ai-ab-v01.log; then
            echo 'Paired capture-aware AI test failed'; exit 1
          fi
          grep -Fq 'PASS capture AI AB v01:' /tmp/tarvoka-capture-aware-ai-ab-v01.log
      - name: Archive paired statistics and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-capture-aware-ai-ab-v01
          path: /tmp/tarvoka-capture-aware-ai-ab-v01.log
          retention-days: 30
          if-no-files-found: ignore
