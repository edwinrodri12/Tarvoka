name: TARVOKA G13 V21 sculpted side armor real 3D and 56-frame comparison QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/G13*.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/G13InspectionStudio.gd'
      - 'scenes/G13InspectionStudio.tscn'
      - 'tests/test_g13*.gd'
      - '.github/workflows/g13-v8-final-art-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ui/G13*.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_g13*.gd'
      - '.github/workflows/g13-v8-final-art-audit.yml'
  workflow_dispatch:

jobs:
  g13-final-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and headless display
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      # Main contains G13's native meshes, but the published multi-building
      # Studio is assembled from separate release branches. Do NOT change its
      # adapter or substitute a fake superclass in the repository.
      - name: Scope CI import to native G13 models without published-only studio
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f scripts/ui/CombinedArtStudioWeb.gd && test -f scripts/ui/BastionStudioAdapter.gd; then
            mkdir -p /tmp/g13-ci-external-studio
            mv scripts/ui/BastionStudioAdapter.gd /tmp/g13-ci-external-studio/
            echo 'Published multi-building studio adapter excluded from this isolated G13 audit only'
          fi
      - name: Import native art and scenes
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/g13-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error|Import failed' /tmp/g13-import.log; then exit 1; fi
      - name: Run all eight G13 model and studio regressions
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            tests/test_g11_final_lock_g13_v1.gd
            tests/test_g13_detail_v2.gd
            tests/test_g13_animation_v3.gd
            tests/test_g13_ground_air_finish_v4.gd
            tests/test_g13_geometry_v5.gd
            tests/test_g13_undercarriage_v6.gd
            tests/test_g13_wheel_finish_v7.gd
            tests/test_g13_surface_v8.gd
            tests/test_g13_silhouette_v10.gd
            tests/test_g13_body_finish_v11.gd
            tests/test_g13_cab_rear_v11.gd
            tests/test_g13_mechanical_finish_v12.gd
            tests/test_g13_surface_finish_v13.gd
            tests/test_g13_sensor_sculpt_v14.gd
            tests/test_g13_turret_finish_v15.gd
            tests/test_g13_static_batch_v16.gd
            tests/test_g13_autocannon_sculpt_v18.gd
            tests/test_g13_gun_trunnion_v19.gd
            tests/test_g13_turret_armor_v20.gd
            tests/test_g13_side_armor_v21.gd
            tests/test_g13_v17_lod_policy.gd
            tests/test_g13_v17_android_telemetry.gd
            tests/test_g13_inspection_studio.gd
          )
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            test -f "$script"
            logfile="/tmp/$(basename "$script").log"
            timeout --signal=TERM --kill-after=5s 100s \
              xvfb-run -a -s '-screen 0 1280x720x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              /tmp/Godot_v4.3-stable_linux.x86_64 \
              --rendering-method gl_compatibility --audio-driver Dummy \
              --path . --script "res://$script" 2>&1 | tee "$logfile"
            if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' "$logfile"; then
              echo "FAIL $script"; exit 1
            fi
            grep -E 'PASS G13|PASS G11 LOCK' "$logfile" >/dev/null || {
              echo "Missing explicit PASS marker: $script"; exit 1;
            }
            echo "::endgroup::"
          done
      - name: Profile G13 V16 visible GPU draw savings and LOD8/13 geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V16_PROFILE_FILE=/tmp/g13-v16-profile.json \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v16_visible_profile.gd 2>&1 | tee /tmp/g13-profile.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-profile.log; then exit 1; fi
          grep -F 'PASS G13 V16 PROFILE:' /tmp/g13-profile.log
          test -s /tmp/g13-v16-profile.json
      - name: Upload CPU and geometry profile (not Android FPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v16-visible-gpu-batch-lod8-lod13-profile
          path: /tmp/g13-v16-profile.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture G13 V16 35-frame identical original-vs-GPU comparison QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v16-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V16_CAPTURE_DIR=/tmp/g13-v16-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v16_visual_capture.gd 2>&1 | tee /tmp/g13-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-capture.log; then exit 1; fi
          grep -F 'PASS G13 V16 CAPTURE:' /tmp/g13-capture.log
          test "$(find /tmp/g13-v16-gallery -name '*.png' | wc -l)" -eq 35
      - name: Upload actual 3D inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v16-35-real-godot-frames-visual-batch-comparison
          path: /tmp/g13-v16-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture V18 38 authentic 3D cannon-only proof views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v18-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V18_CAPTURE_DIR=/tmp/g13-v18-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v18_visual_capture.gd 2>&1 | tee /tmp/g13-v18-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v18-capture.log; then exit 1; fi
          grep -F 'PASS G13 V18 CAPTURE:' /tmp/g13-v18-capture.log
          test "$(find /tmp/g13-v18-gallery -name '*.png' | wc -l)" -eq 38
      - name: Upload actual V18 cannon-only 38-frame 3D gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v18-twin-cannon-only-38-real-godot-frames
          path: /tmp/g13-v18-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture 44 V19 real articulated joint model frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v19-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V19_CAPTURE_DIR=/tmp/g13-v19-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v19_visual_capture.gd 2>&1 | tee /tmp/g13-v19-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v19-capture.log; then exit 1; fi
          grep -F 'PASS G13 V19 CAPTURE:' /tmp/g13-v19-capture.log
          test "$(find /tmp/g13-v19-gallery -name '*.png' | wc -l)" -eq 44
      - name: Upload authentic V19 44-image turret and cannon joint gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v19-native-joint-44-godot-art-inspection-views
          path: /tmp/g13-v19-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture V20 50 real turret armor and underside 3D views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v20-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V20_CAPTURE_DIR=/tmp/g13-v20-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v20_visual_capture.gd 2>&1 | tee /tmp/g13-v20-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v20-capture.log; then exit 1; fi
          grep -F 'PASS G13 V20 CAPTURE:' /tmp/g13-v20-capture.log
          test "$(find /tmp/g13-v20-gallery -name '*.png' | wc -l)" -eq 50
      - name: Upload authentic V20 50-image turret shield and same-camera before-after gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v20-armor-50-real-godot-3d-views
          path: /tmp/g13-v20-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture 56 native V21 side-armor sculpt comparison views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v21-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V21_CAPTURE_DIR=/tmp/g13-v21-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v21_visual_capture.gd 2>&1 | tee /tmp/g13-v21-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v21-capture.log; then exit 1; fi
          grep -F 'PASS G13 V21 CAPTURE:' /tmp/g13-v21-capture.log
          test "$(find /tmp/g13-v21-gallery -name '*.png' | wc -l)" -eq 56
      - name: Upload 56 actual native V21 Godot screenshots and V20/V21 same-camera proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v21-56-real-godot-side-armor-art-captures
          path: /tmp/g13-v21-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Stress render G13 V17 1–32 vehicles across mobile and hero LODs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v17-stress
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V17_STRESS_DIR=/tmp/g13-v17-stress \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v17_stress_scene.gd 2>&1 | tee /tmp/g13-v17-stress.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v17-stress.log; then exit 1; fi
          grep -F 'PASS G13 V17 STRESS:' /tmp/g13-v17-stress.log
          test -s /tmp/g13-v17-stress/g13-v17-stress.json
          test "$(find /tmp/g13-v17-stress -name '*.png' | wc -l)" -eq 8
      - name: Publish V17 native software benchmark, memory JSON and 8 real formation images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v17-real-godot-1to32-fleet-stress-and-memory
          path: /tmp/g13-v17-stress/
          if-no-files-found: ignore
          retention-days: 14
