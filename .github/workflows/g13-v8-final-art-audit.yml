name: TARVOKA G13 V22 final 3D art candidate verification and 360-degree Godot QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui/G13*.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'scripts/ui/G13InspectionStudio.gd'
      - 'scenes/G13InspectionStudio.tscn'
      - 'tests/test_g13*.gd'
      - '.github/workflows/g13-v8-final-art-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ui/G13*.gd'
      - 'scripts/ui/UnitModels3D.gd'
      - 'tests/test_g13*.gd'
      - '.github/workflows/g13-v8-final-art-audit.yml'
  workflow_dispatch:

jobs:
  g13-final-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and headless display
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      # Main contains G13's native meshes, but the published multi-building
      # Studio is assembled from separate release branches. Do NOT change its
      # adapter or substitute a fake superclass in the repository.
      - name: Scope CI import to native G13 models without published-only studio
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f scripts/ui/CombinedArtStudioWeb.gd && test -f scripts/ui/BastionStudioAdapter.gd; then
            mkdir -p /tmp/g13-ci-external-studio
            mv scripts/ui/BastionStudioAdapter.gd /tmp/g13-ci-external-studio/
            echo 'Published multi-building studio adapter excluded from this isolated G13 audit only'
          fi
      - name: Import native art and scenes
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/g13-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error|Import failed' /tmp/g13-import.log; then exit 1; fi
      - name: Run all eight G13 model and studio regressions
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            tests/test_g11_final_lock_g13_v1.gd
            tests/test_g13_detail_v2.gd
            tests/test_g13_animation_v3.gd
            tests/test_g13_ground_air_finish_v4.gd
            tests/test_g13_geometry_v5.gd
            tests/test_g13_undercarriage_v6.gd
            tests/test_g13_wheel_finish_v7.gd
            tests/test_g13_surface_v8.gd
            tests/test_g13_silhouette_v10.gd
            tests/test_g13_body_finish_v11.gd
            tests/test_g13_cab_rear_v11.gd
            tests/test_g13_mechanical_finish_v12.gd
            tests/test_g13_surface_finish_v13.gd
            tests/test_g13_sensor_sculpt_v14.gd
            tests/test_g13_turret_finish_v15.gd
            tests/test_g13_static_batch_v16.gd
            tests/test_g13_autocannon_sculpt_v18.gd
            tests/test_g13_gun_trunnion_v19.gd
            tests/test_g13_turret_armor_v20.gd
            tests/test_g13_side_armor_v21.gd
            tests/test_g13_360_underbody_v22.gd
            tests/test_g13_front_lighting_v23.gd
            tests/test_g13_armored_intake_v24.gd
            tests/test_g13_tactical_zoom_v25.gd
            tests/test_g13_v17_lod_policy.gd
            tests/test_g13_v17_android_telemetry.gd
            tests/test_g13_inspection_studio.gd
          )
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            test -f "$script"
            logfile="/tmp/$(basename "$script").log"
            timeout --signal=TERM --kill-after=5s 100s \
              xvfb-run -a -s '-screen 0 1280x720x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              /tmp/Godot_v4.3-stable_linux.x86_64 \
              --rendering-method gl_compatibility --audio-driver Dummy \
              --path . --script "res://$script" 2>&1 | tee "$logfile"
            if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error|Assertion failed' "$logfile"; then
              echo "FAIL $script"; exit 1
            fi
            grep -E 'PASS G13|PASS G11 LOCK' "$logfile" >/dev/null || {
              echo "Missing explicit PASS marker: $script"; exit 1;
            }
            echo "::endgroup::"
          done
      - name: Verify G13 V22 final 3D art candidate across eight factions and original controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 115s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_FINAL_ART_REPORT=/tmp/g13-v22-final-readiness.json \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_final_art_candidate_v22.gd 2>&1 | tee /tmp/g13-v22-final-readiness.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v22-final-readiness.log; then exit 1; fi
          grep -F 'PASS G13 FINAL ART CANDIDATE V22:' /tmp/g13-v22-final-readiness.log
          test -s /tmp/g13-v22-final-readiness.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g13-v22-final-readiness.json'))
          assert x['art_revision']=='V22' and x['factions']==8
          assert x['pose_invocations']==448 and x['failures']==0
          assert x['heading_directions']==8 and x['poses_per_heading']==7
          assert x['decision']=='ART_CANDIDATE_REQUIRES_USER_APPROVAL'
          assert x['android_lod8_modified'] is False
          assert x['playable_registered'] is False
          assert x['checked_meshes']>100
          print('PASS V22 FINAL ART READINESS JSON:',x['assertions'],'checks and',x['checked_meshes'],'meshes')
          PY
      - name: Upload auditable final art readiness checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v22-final-art-readiness-448-pose-eight-factions
          path: /tmp/g13-v22-final-readiness.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Profile G13 V16 visible GPU draw savings and LOD8/13 geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V16_PROFILE_FILE=/tmp/g13-v16-profile.json \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v16_visible_profile.gd 2>&1 | tee /tmp/g13-profile.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-profile.log; then exit 1; fi
          grep -F 'PASS G13 V16 PROFILE:' /tmp/g13-profile.log
          test -s /tmp/g13-v16-profile.json
      - name: Upload CPU and geometry profile (not Android FPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v16-visible-gpu-batch-lod8-lod13-profile
          path: /tmp/g13-v16-profile.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture G13 V16 35-frame identical original-vs-GPU comparison QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v16-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V16_CAPTURE_DIR=/tmp/g13-v16-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v16_visual_capture.gd 2>&1 | tee /tmp/g13-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-capture.log; then exit 1; fi
          grep -F 'PASS G13 V16 CAPTURE:' /tmp/g13-capture.log
          test "$(find /tmp/g13-v16-gallery -name '*.png' | wc -l)" -eq 35
      - name: Upload actual 3D inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v16-35-real-godot-frames-visual-batch-comparison
          path: /tmp/g13-v16-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture V18 38 authentic 3D cannon-only proof views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v18-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V18_CAPTURE_DIR=/tmp/g13-v18-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v18_visual_capture.gd 2>&1 | tee /tmp/g13-v18-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v18-capture.log; then exit 1; fi
          grep -F 'PASS G13 V18 CAPTURE:' /tmp/g13-v18-capture.log
          test "$(find /tmp/g13-v18-gallery -name '*.png' | wc -l)" -eq 38
      - name: Upload actual V18 cannon-only 38-frame 3D gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v18-twin-cannon-only-38-real-godot-frames
          path: /tmp/g13-v18-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture 44 V19 real articulated joint model frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v19-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V19_CAPTURE_DIR=/tmp/g13-v19-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v19_visual_capture.gd 2>&1 | tee /tmp/g13-v19-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v19-capture.log; then exit 1; fi
          grep -F 'PASS G13 V19 CAPTURE:' /tmp/g13-v19-capture.log
          test "$(find /tmp/g13-v19-gallery -name '*.png' | wc -l)" -eq 44
      - name: Upload authentic V19 44-image turret and cannon joint gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v19-native-joint-44-godot-art-inspection-views
          path: /tmp/g13-v19-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture V20 50 real turret armor and underside 3D views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v20-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V20_CAPTURE_DIR=/tmp/g13-v20-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v20_visual_capture.gd 2>&1 | tee /tmp/g13-v20-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v20-capture.log; then exit 1; fi
          grep -F 'PASS G13 V20 CAPTURE:' /tmp/g13-v20-capture.log
          test "$(find /tmp/g13-v20-gallery -name '*.png' | wc -l)" -eq 50
      - name: Upload authentic V20 50-image turret shield and same-camera before-after gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v20-armor-50-real-godot-3d-views
          path: /tmp/g13-v20-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture 56 native V21 side-armor sculpt comparison views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v21-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V21_CAPTURE_DIR=/tmp/g13-v21-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v21_visual_capture.gd 2>&1 | tee /tmp/g13-v21-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v21-capture.log; then exit 1; fi
          grep -F 'PASS G13 V21 CAPTURE:' /tmp/g13-v21-capture.log
          test "$(find /tmp/g13-v21-gallery -name '*.png' | wc -l)" -eq 56
      - name: Upload 56 actual native V21 Godot screenshots and V20/V21 same-camera proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v21-56-real-godot-side-armor-art-captures
          path: /tmp/g13-v21-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture G13 V22 62 authentic 360-degree Godot inspection views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v22-gallery
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V22_CAPTURE_DIR=/tmp/g13-v22-gallery \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v22_visual_capture.gd 2>&1 | tee /tmp/g13-v22-gallery.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v22-gallery.log; then exit 1; fi
          grep -F 'PASS G13 V22 CAPTURE:' /tmp/g13-v22-gallery.log
          test "$(find /tmp/g13-v22-gallery -name '*.png' | wc -l)" -eq 62
      - name: Upload native V22 62-image 360 inspection and V21/V22 undercarriage comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v22-62-real-godot-360-inspection-and-underbody
          path: /tmp/g13-v22-gallery/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture G13 V23 27 true Godot frontal optical and same-camera V22 comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v23-front-review
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V23_VISUAL_DIR=/tmp/g13-v23-front-review \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v23_visual_front_audit.gd 2>&1 | tee /tmp/g13-v23-front-review.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v23-front-review.log; then exit 1; fi
          grep -F 'PASS G13 V23 FRONT VISUAL AUDIT:' /tmp/g13-v23-front-review.log
          test "$(find /tmp/g13-v23-front-review -name '*.png' | wc -l)" -eq 27
          test -s /tmp/g13-v23-front-review/g13-v23-front-visual-report.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/g13-v23-front-review/g13-v23-front-visual-report.json'))
          assert r['captured']==27 and r['factions']==8
          assert r['failed_checks']==0 and r['gameplay_modified'] is False
          assert r['android_lod8_modified'] is False
          assert len(r['front_view_differences'])==6
          for angle in ('front','front_low','front_left','front_right'):
              assert r['front_view_differences'][angle]['changed']>=20,angle
          print('PASS G13 V23 frontal optics unchanged-camera render QA',r['front_view_differences'])
          PY
      - name: Upload G13 V23 native front 27 screenshots and geometric delta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v23-front-27-godot-3d-views-v22-comparison
          path: |
            /tmp/g13-v23-front-review/*.png
            /tmp/g13-v23-front-review/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Capture G13 V24 new sculpt 22 true Godot frontal views and V23 reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v24-frontal
          timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V24_CAPTURE_DIR=/tmp/g13-v24-frontal \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v24_front_visual_capture.gd 2>&1 | tee /tmp/g13-v24-frontal.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v24-frontal.log; then exit 1; fi
          grep -F 'PASS G13 V24 3D FRONTAL REVIEW:' /tmp/g13-v24-frontal.log
          test "$(find /tmp/g13-v24-frontal -name '*.png' | wc -l)" -eq 22
          test -s /tmp/g13-v24-frontal/g13_v24_real_3d_review.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g13-v24-frontal/g13_v24_real_3d_review.json'))
          assert x['authentic_godot_screenshots']==22 and x['factions']==8
          assert x['failures']==0 and x['android_lod8_modified'] is False
          assert x['louvres']==4 and x['new_gun_modules']==0
          assert len(x['same_camera_comparison'])==5
          for k,v in x['same_camera_comparison'].items():
              assert v['changed']>35,(k,v)
          print('PASS G13 V24 real Godot frontal report:',x['same_camera_comparison'])
          PY
      - name: Upload G13 V24 real armored front 22-image dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v24-frontal-sculpt-22-native-3d-images
          path: |
            /tmp/g13-v24-frontal/*.png
            /tmp/g13-v24-frontal/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Capture G13 V25 native battle zoom + identical V1 low-cost comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v25-tactical
          timeout --signal=TERM --kill-after=5s 170s \
            xvfb-run -a -s '-screen 0 960x640x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V25_CAPTURE_DIR=/tmp/g13-v25-tactical \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_tactical_zoom_v25.gd 2>&1 | tee /tmp/g13-v25-tactical.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v25-tactical.log; then exit 1; fi
          grep -F 'PASS G13 V25 TACTICAL ZOOM:' /tmp/g13-v25-tactical.log
          test "$(find /tmp/g13-v25-tactical -name '*.png' | wc -l)" -eq 17
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g13-v25-tactical/g13-v25-tactical-summary.json'))
          assert x['shots']==17 and x['factions']==8
          assert x['android_fps_measured'] is False
          assert x['new_render_nodes_per_unit']==0 and x['failures']==0
          assert set(x['visual_delta'])=={'close','medium','far'}
          assert x['visual_delta']['close']['changed']>8
          print('PASS G13 V25 no-extra-draw low zoom native geometry')
          PY
      - name: Upload G13 V25 17 authentic Godot battle-zoom evidence images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v25-tactical-zoom-17-real-native-3d-images
          path: |
            /tmp/g13-v25-tactical/*.png
            /tmp/g13-v25-tactical/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stress render G13 V17 1–32 vehicles across mobile and hero LODs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g13-v17-stress
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 G13_V17_STRESS_DIR=/tmp/g13-v17-stress \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/test_g13_v17_stress_scene.gd 2>&1 | tee /tmp/g13-v17-stress.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error' /tmp/g13-v17-stress.log; then exit 1; fi
          grep -F 'PASS G13 V17 STRESS:' /tmp/g13-v17-stress.log
          test -s /tmp/g13-v17-stress/g13-v17-stress.json
          test "$(find /tmp/g13-v17-stress -name '*.png' | wc -l)" -eq 8
      - name: Publish V17 native software benchmark, memory JSON and 8 real formation images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v17-real-godot-1to32-fleet-stress-and-memory
          path: /tmp/g13-v17-stress/
          if-no-files-found: ignore
          retention-days: 14
