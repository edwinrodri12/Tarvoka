name: TARVOKA G09 antiarmor balance

on:
  pull_request:
    paths:
      - 'scripts/core/UnitRoles.gd'
      - 'scripts/core/ModernArsenal.gd'
      - 'tests/test_piercer_g09_sensitivity.gd'
      - 'tests/test_piercer_g09_regression.gd'
      - 'tests/test_piercer_g09_ai_economy.gd'
      - '.github/workflows/piercer-g09-balance.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/core/UnitRoles.gd'
      - 'scripts/core/ModernArsenal.gd'
      - 'tests/test_piercer_g09_sensitivity.gd'
      - 'tests/test_piercer_g09_regression.gd'
      - 'tests/test_piercer_g09_ai_economy.gd'
      - '.github/workflows/piercer-g09-balance.yml'
  workflow_dispatch:

jobs:
  antiarmor:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compare real attack/reaction with all counterfactual bonuses
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_piercer_g09_sensitivity.gd 2>&1 \
            | tee /tmp/piercer-g09-sensitivity.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/piercer-g09-sensitivity.log; then exit 1; fi
          grep -F 'PASS piercer antitank sensitivity:' /tmp/piercer-g09-sensitivity.log
          grep -F 'PIERCER_BALANCE_JSON ' /tmp/piercer-g09-sensitivity.log \
            | tail -1 | sed 's/^.*PIERCER_BALANCE_JSON //' \
            > /tmp/piercer-g09-sensitivity.json
          python3 -m json.tool /tmp/piercer-g09-sensitivity.json >/dev/null
      - name: Verify production bonus with saves and asymmetric orders
        if: ${{ hashFiles('tests/test_piercer_g09_regression.gd') != '' }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_piercer_g09_regression.gd 2>&1 \
            | tee /tmp/piercer-g09-regression.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/piercer-g09-regression.log; then exit 1; fi
          grep -F 'PASS piercer G09 regression:' /tmp/piercer-g09-regression.log
      - name: Verify AI buys and fights with counter budget
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_piercer_g09_ai_economy.gd 2>&1 \
            | tee /tmp/piercer-g09-ai-economy.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/piercer-g09-ai-economy.log; then exit 1; fi
          grep -F 'PASS piercer G09 AI economy:' /tmp/piercer-g09-ai-economy.log
      - name: Regress existing role text, counterfire, HUD and paired AI economy
        run: |
          set -euo pipefail
          for test in test_unit_roles test_counterfire_doctrine test_skirmish_combat_preview test_modern_mirror_decisions test_paired_balance_telemetry; do
            timeout --signal=TERM --kill-after=5s 150s \
              /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
              --script "res://tests/${test}.gd" 2>&1 \
              | tee "/tmp/${test}-g09.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' "/tmp/${test}-g09.log"; then exit 1; fi
            grep -F 'PASS ' "/tmp/${test}-g09.log"
          done
      - name: Upload auditable balance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Piercer-G09-Balance
          path: |
            /tmp/piercer-g09-sensitivity.log
            /tmp/piercer-g09-sensitivity.json
            /tmp/piercer-g09-regression.log
            /tmp/piercer-g09-ai-economy.log
            /tmp/test_unit_roles-g09.log
            /tmp/test_counterfire_doctrine-g09.log
            /tmp/test_skirmish_combat_preview-g09.log
            /tmp/test_modern_mirror_decisions-g09.log
            /tmp/test_paired_balance_telemetry-g09.log
          if-no-files-found: warn
