name: TARVOKA Mesh Census JSON QA

on:
  pull_request:
    paths:
      - 'tools/validate_mesh_census.py'
      - '.github/workflows/mesh-census-json-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-census-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile tools/validate_mesh_census.py
      - name: Run fourteen structural and JSON-integrity cases
        run: python3 tools/validate_mesh_census.py --self-test
      - name: Verify CLI rejects invalid input
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"triangles":-1}' > "$RUNNER_TEMP/invalid.json"
          if python3 tools/validate_mesh_census.py "$RUNNER_TEMP/invalid.json"; then
            echo "ERROR: invalid report accepted"
            exit 1
          fi
      - name: Verify CLI accepts valid input
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"triangles":12,"instances":1,"mesh_nodes":1,"surfaces":1,"largest_mesh_triangles":12,"largest_mesh_path":"Vehicle/Hull","warnings":[]}' > "$RUNNER_TEMP/valid.json"
          python3 tools/validate_mesh_census.py "$RUNNER_TEMP/valid.json"
