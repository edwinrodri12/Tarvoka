name: Godot asset orbit camera smoke
on:
  pull_request:
    paths:
      - 'scripts/tools/AssetOrbitCamera.gd'
      - 'scenes/tools/AssetInspectionSmoke.tscn'
      - 'tests/test_asset_orbit_camera.gd'
      - '.github/workflows/asset-orbit-camera.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tools/AssetOrbitCamera.gd'
      - 'scenes/tools/AssetInspectionSmoke.tscn'
      - 'tests/test_asset_orbit_camera.gd'
      - '.github/workflows/asset-orbit-camera.yml'
  workflow_dispatch:

jobs:
  orbit-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Validate isolated 3D orbit scene and transformed rig
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 80s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_asset_orbit_camera.gd 2>&1 | tee /tmp/asset-orbit.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/asset-orbit.log; then
            echo 'Orbit smoke emitted engine errors'; exit 1
          fi
          grep -F 'PASS: isolated asset orbit camera smoke' /tmp/asset-orbit.log
