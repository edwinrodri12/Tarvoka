name: TARVOKA Browser 3D Art Studio

on:
  pull_request:
    paths:
      - "scripts/ui/UnitArtStudioWeb.gd"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "scripts/ui/Headquarters3D.gd"
      - "scripts/ui/HeadquartersFinish3D.gd"
      - "scripts/ui/HeadquartersDetail3D.gd"
      - "scripts/ui/HeadquartersHero4.gd"
      - "scripts/ui/HeadquartersMapLOD3D.gd"
      - "scripts/ui/HeadquartersEmblems3D.gd"
      - "scripts/ui/HeadquartersArchitectureV7.gd"
      - "tests/test_headquarters_v7.gd"
      - "scripts/ui/HeadquartersCityBatch3D.gd"
      - "tests/test_headquarters_v6.gd"
      - "assets/factions/**"
      - "tests/test_headquarters_map_lod.gd"
      - "tests/test_headquarters_v4.gd"
      - "tests/export_headquarters_hero_glb.gd"
      - "tests/export_headquarters_sculpt_v7_glb.gd"
      - "tests/test_headquarters_v3.gd"
      - "tests/test_headquarters_premium_v2.gd"
      - "tests/test_web_building_studio.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/Tank*.gd"
      - "scenes/UnitArtStudioWeb.tscn"
      - "export_presets.cfg"
      - ".github/workflows/web-art-studio.yml"
      - "tests/test_web_art_studio.gd"
      - "tests/test_g09_premium_finish_v8.gd"
      - "tests/test_g09_production_v9.gd"
      - "tests/test_g09_sculpted_v10.gd"
      - "tests/test_mbt_silhouette_v5.gd"
  push:
    branches:
      - feat/browser-3d-model-lab-20261113
      - main
    paths:
      - "scripts/ui/**"
      - "scenes/UnitArtStudioWeb.tscn"
      - "export_presets.cfg"
      - ".github/workflows/web-art-studio.yml"
      - "tests/test_g09_premium_finish_v8.gd"
      - "tests/test_g09_production_v9.gd"
      - "tests/test_g09_sculpted_v10.gd"
      - "tests/test_mbt_silhouette_v5.gd"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-art-studio:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3 and web export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/tpl.tpz
          mkdir -p /tmp/tpl
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$T"
          cp /tmp/tpl/templates/web_*.zip "$T/"
          test -s "$T/web_nothreads_release.zip"
          test -s "$T/web_nothreads_debug.zip"
          printf '4.3.stable\n' > "$T/version.txt"
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Mark exact Git revision in browser viewer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          git rev-parse --short=12 HEAD > assets/art_studio_revision.txt
          sed -i 's|run/main_scene="res://scenes/Main.tscn"|run/main_scene="res://scenes/UnitArtStudioWeb.tscn"|' project.godot
          grep -q 'run/main_scene="res://scenes/UnitArtStudioWeb.tscn"' project.godot
      - name: Import official faction WebP atlases before Godot scripts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/hq-atlas-import.log
          if grep -E "SCRIPT ERROR:|ERROR:|Import failed" /tmp/hq-atlas-import.log; then
            echo "Original faction WebP textures failed Godot import" >&2
            exit 1
          fi
          test -d .godot/imported
      - name: Validate native Godot 3D art studio interface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_mbt_silhouette_v5.gd 2>&1 | tee /tmp/watertight-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/watertight-check.log; then
            echo "G09 body topology or visual damage restoration failed" >&2
            exit 1
          fi
          grep -q "PASS G09 V7:" /tmp/watertight-check.log
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_g09_premium_finish_v8.gd 2>&1 | tee /tmp/premium-g09-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/premium-g09-check.log; then
            echo "New premium G09 geometry or PBR test failed" >&2
            exit 1
          fi
          grep -q "PASS G09 premium V8:" /tmp/premium-g09-check.log
          test -s artifacts/tarvoka_g09_premium_v8_engine.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_g09_production_v9.gd 2>&1 | tee /tmp/production-g09-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/production-g09-check.log; then
            echo "Production G09 V9 body/paint/HP test failed" >&2
            exit 1
          fi
          grep -q "PASS G09 production V9:" /tmp/production-g09-check.log
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_g09_sculpted_v10.gd 2>&1 | tee /tmp/sculpted-g09-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/sculpted-g09-check.log; then
            echo "G09 V10 closed armor or art integration QA failed" >&2
            exit 1
          fi
          grep -q "PASS G09 V10:" /tmp/sculpted-g09-check.log
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_web_art_studio.gd 2>&1 | tee /tmp/studio-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/studio-check.log; then
            echo "Model studio parsing, scene or functional test failed" >&2
            exit 1
          fi
          grep -q "PASS native web studio:" /tmp/studio-check.log
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_web_building_studio.gd 2>&1 | tee /tmp/studio-buildings-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/studio-buildings-check.log; then
            echo "Unified 3D studio building viewer regression" >&2
            exit 1
          fi
          grep -q "PASS unified web studio:" /tmp/studio-buildings-check.log
          test -s artifacts/tarvoka_headquarters_web_studio.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_premium_v2.gd 2>&1 | tee /tmp/hq-premium-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-premium-check.log; then
            echo "Headquarters V2 architecture regression" >&2
            exit 1
          fi
          grep -q "PASS headquarters premium V2:" /tmp/hq-premium-check.log
          test -s artifacts/tarvoka_headquarters_v1_v2_comparison.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_v3.gd 2>&1 | tee /tmp/hq-v3-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v3-check.log; then
            echo "Headquarters V3 GPU comparison or model test failed" >&2
            exit 1
          fi
          grep -q "PASS headquarters V3:" /tmp/hq-v3-check.log
          test -s artifacts/tarvoka_headquarters_v2_v3_comparison.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_v4.gd 2>&1 | tee /tmp/hq-v4-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v4-check.log; then
            echo "HQ V4 game-asset visual or model regression" >&2
            exit 1
          fi
          grep -q "PASS headquarters V4:" /tmp/hq-v4-check.log
          test -s artifacts/tarvoka_hq_v3_vs_v4_real_render.png
          test -s artifacts/tarvoka_hq_v4_level3_render.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_map_lod.gd 2>&1 | tee /tmp/hq-v5-map-lod-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v5-map-lod-check.log; then
            echo "HQ V5 map LOD visual comparison or proxy regression" >&2
            exit 1
          fi
          grep -q "PASS HQ V5 map LOD:" /tmp/hq-v5-map-lod-check.log
          test -s artifacts/tarvoka_hq_v4_vs_v5_map_lod.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_v6.gd 2>&1 | tee /tmp/hq-v6-approval.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v6-approval.log; then
            echo "HQ V6 official shields or multi-building GPU regression" >&2
            exit 1
          fi
          grep -q "PASS HQ V6:" /tmp/hq-v6-approval.log
          test -s artifacts/tarvoka_hq_v6_49_buildings_map_scale.png
          test -s artifacts/tarvoka_hq_v6_official_shield.png
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_headquarters_v7.gd 2>&1 | tee /tmp/hq-v7-sculpt-check.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v7-sculpt-check.log; then
            echo "HQ V7 sculpted geometry or screenshot test failed" >&2
            exit 1
          fi
          grep -q "PASS HQ V7:" /tmp/hq-v7-sculpt-check.log
          test -s artifacts/tarvoka_hq_v4_vs_v7_sculpted_front.png
          test -s artifacts/tarvoka_hq_v7_level3.png
          test -s artifacts/tarvoka_hq_v7_damaged.png
          test -s artifacts/tarvoka_hq_v7_entrance_closeup.png
          test -s artifacts/tarvoka_web_3d_studio.png
          test -s artifacts/tarvoka_mbt_before_after_same_camera.png
          test -s artifacts/tarvoka_mbt_v9_vs_v10_same_camera.png
          test -s artifacts/tarvoka_g09_v10_four_angles.png
          test -s artifacts/tarvoka_g09_v9_closeup_engine.png
      - name: Export actual G09 V10 to portable Blender-compatible GLB
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/export_g09_hero_glb.gd 2>&1 | tee /tmp/tarvoka-hero-glb.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/tarvoka-hero-glb.log; then
            echo "G09 glTF export contains invalid geometry or material" >&2
            exit 1
          fi
          grep -q "PASS G09 V10 GLB export:" /tmp/tarvoka-hero-glb.log
          test -s artifacts/TARVOKA_G09_V10_Escultura_Editable.glb
      - name: Export HQ V4 as editable Blender GLB
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/export_headquarters_hero_glb.gd 2>&1 | tee /tmp/hq-glb.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-glb.log; then
            echo "HQ V4 Blender GLB export failed" >&2
            exit 1
          fi
          grep -q "PASS HQ V4 GLB export:" /tmp/hq-glb.log
          test -s artifacts/TARVOKA_CuartelGeneral_V4_Nivel3_Editable.glb
      - name: Export sculpted HQ V7 as editable Blender GLB
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/export_headquarters_sculpt_v7_glb.gd 2>&1 | tee /tmp/hq-v7-glb.log
          if grep -E "SCRIPT ERROR:|ERROR:|Assertion failed" /tmp/hq-v7-glb.log; then
            echo "HQ V7 editable sculpt export failed" >&2
            exit 1
          fi
          grep -q "PASS HQ V7 GLB export:" /tmp/hq-v7-glb.log
          test -s artifacts/TARVOKA_CuartelGeneral_V7_Nivel3_Editable.glb
      - name: Export actual Godot 3D studio to WebGL 2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --export-release "Web Studio" build/web/index.html 2>&1 | tee /tmp/studio-export.log
          if grep -E "SCRIPT ERROR:|ERROR:|Export failed" /tmp/studio-export.log; then
            echo "Godot web export failed" >&2
            exit 1
          fi
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.js
          test -s build/web/index.pck
          touch build/web/.nojekyll
          du -h build/web/*
      - name: Archive live browser viewer and source render
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Native-3D-Web-Studio
          path: |
            build/web/
            artifacts/tarvoka_web_3d_studio.png
            artifacts/tarvoka_headquarters_web_studio.png
            artifacts/tarvoka_headquarters_v1_v2_comparison.png
            artifacts/tarvoka_headquarters_v2_v3_comparison.png
            artifacts/tarvoka_hq_v3_vs_v4_real_render.png
            artifacts/tarvoka_hq_v4_level3_render.png
            artifacts/tarvoka_hq_v4_vs_v5_map_lod.png
            artifacts/tarvoka_hq_v6_49_buildings_map_scale.png
            artifacts/tarvoka_hq_v6_official_shield.png
            artifacts/tarvoka_hq_v4_vs_v7_sculpted_front.png
            artifacts/tarvoka_hq_v7_level3.png
            artifacts/tarvoka_hq_v7_damaged.png
            artifacts/tarvoka_hq_v7_entrance_closeup.png
            artifacts/tarvoka_mbt_before_after_same_camera.png
            artifacts/tarvoka_mbt_v9_vs_v10_same_camera.png
            artifacts/tarvoka_g09_v10_four_angles.png
            artifacts/tarvoka_g09_v9_closeup_engine.png
            artifacts/tarvoka_g09_premium_v8_engine.png
            artifacts/TARVOKA_G09_V10_Escultura_Editable.glb
            artifacts/TARVOKA_CuartelGeneral_V4_Nivel3_Editable.glb
            artifacts/TARVOKA_CuartelGeneral_V7_Nivel3_Editable.glb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload GitHub Pages publishing payload
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

