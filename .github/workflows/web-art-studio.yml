            artifacts/tarvoka_g09_premium_v8_engine.png
            artifacts/TARVOKA_G09_V10_Escultura_Editable.glb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Archive Windows ready-to-open offline TARVOKA 3D Studio
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Estudio-3D-PC-Windows
          path: build/web/
