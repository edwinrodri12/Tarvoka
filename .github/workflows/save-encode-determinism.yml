name: Save encoding determinism
on:
  push:
    branches: [main]
    paths: ['tests/test_save_encode_determinism.gd', '.github/workflows/save-encode-determinism.yml']
  pull_request:
    paths: ['tests/test_save_encode_determinism.gd', '.github/workflows/save-encode-determinism.yml']
  workflow_dispatch:
jobs:
  save-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run deterministic encoding regression
        run: |
          set -o pipefail
          timeout 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_save_encode_determinism.gd 2>&1 | tee /tmp/save-determinism.log
          grep -Fq 'PASS save encode determinism: 20 iterations' /tmp/save-determinism.log
