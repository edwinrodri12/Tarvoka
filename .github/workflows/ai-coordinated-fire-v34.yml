name: TARVOKA v34 coordinated tactical fire and safety

on:
  pull_request:
    paths:
      - "scripts/core/CoordinatedFireV34.gd"
      - "scripts/core/BasicAI.gd"
      - "tests/test_ai_coordinated_fire_v34.gd"
      - ".github/workflows/ai-coordinated-fire-v34.yml"
  workflow_dispatch:

jobs:
  coordinated_fire_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify actual 2/3-shooter group kills, fog and role discipline
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_coordinated_fire_v34.gd \
            2>&1 | tee /tmp/v34-focus-fire.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v34-focus-fire.log; then exit 1; fi
          grep -Fq 'PASS strategic AI v34 coordinated fire:' /tmp/v34-focus-fire.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarvoka-v34-focus-fire
          path: /tmp/v34-focus-fire.log
          retention-days: 30
          if-no-files-found: ignore

  legacy_ai_regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test_ai_multiturn_objectives_v33.gd
          - test_ai_strategy_levels_v32.gd
          - test_ai_game_ui_profile_v32.gd
          - test_ai_decisions.gd
          - test_ai_retreat.gd
          - test_ai_fog_sweep.gd
          - test_ai_self_play.gd
          - test_economic_ai.gd
          - test_multidomain_ai.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify real AI, economy, fog, save and mission compatibility
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/${{ matrix.suite }} \
            2>&1 | tee /tmp/v34-regression.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/v34-regression.log; then exit 1; fi
          grep -Fq 'PASS' /tmp/v34-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarvoka-v34-${{ matrix.suite }}
          path: /tmp/v34-regression.log
          retention-days: 30
          if-no-files-found: ignore
