name: TARVOKA Workshop Android battle-density proxy
on:
  push:
    branches: [feat/workshop-battle-android-stress-v1-20261120]
    paths:
      - scripts/ui/ArmoredWorkshopBattleLOD.gd
      - scripts/ui/City3DPerfProbeV7.gd
      - scripts/ui/Battle3DMapView.gd
      - tests/benchmark_armored_workshop_battle_android_v1.gd
      - .github/workflows/armored-workshop-battle-stress-qa.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ui/ArmoredWorkshopBattleLOD.gd
      - scripts/ui/City3DPerfProbeV7.gd
      - scripts/ui/Battle3DMapView.gd
      - tests/benchmark_armored_workshop_battle_android_v1.gd
      - .github/workflows/armored-workshop-battle-stress-qa.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: workshop-battle-android-proxy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-battle-density:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot 4.3 native GL Compatibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot-workshop.zip
          unzip -oq /tmp/godot-workshop.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          command -v xvfb-run
      - name: Import project and reject GDScript parser errors
        shell: bash
        run: |
          set -euo pipefail
          # The shared Web adapter imports a parent file assembled only by
          # the Pages pipeline, unrelated to live-battle visual tests.
          rm -f scripts/ui/BastionStudioAdapter.gd scripts/ui/ArmoredWorkshopStudioAdapterV1.gd
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/workshop-android-proxy-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/workshop-android-proxy-import.log; then exit 1; fi
      - name: Benchmark real modern 3D battle with 8 24 and 48 visual-only workshop models
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/benchmark_armored_workshop_battle_android_v1.gd \
            2>&1 | tee /tmp/workshop-android-proxy.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/workshop-android-proxy.log; then exit 1; fi
          grep -F 'PASS WORKSHOP BATTLE ANDROID PROXY:' /tmp/workshop-android-proxy.log
          test -s artifacts/workshop_battle_android_v1/manifest.json
          test "$(find artifacts/workshop_battle_android_v1 -name '*.png' | wc -l)" -eq 4
      - name: Publish inspectable Mesa-only evidence and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-battle-android-proxy-mesa
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/workshop_battle_android_v1/
            /tmp/workshop-android-proxy.log
            /tmp/workshop-android-proxy-import.log
