name: TARVOKA Naval Base V8 Fenders Foam Shipyard Native Godot QA

on:
  push:
    branches:
      - feat/naval-base-v8-fenders-foam-shipyard-20261115
    paths:
      - "scripts/ui/NavalBase3DV1.gd"
      - "scripts/ui/NavalBaseDetailV2.gd"
      - "scripts/ui/NavalBaseBerthsV3.gd"
      - "scripts/ui/NavalMarineFinishV4.gd"
      - "scripts/ui/NavalYardSignalsV5.gd"
      - "scripts/ui/NavalNightReadabilityV6.gd"
      - "scripts/ui/NavalBoardingDetailV7.gd"
      - "scripts/ui/NavalFendersV8.gd"
      - "assets/shaders/naval_contact_foam_v8.gdshader"
      - "assets/shaders/naval_marine_weathering_v4.gdshader"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_naval_base_v8_gpu.gd"
      - ".github/workflows/naval-base-v8-gpu.yml"
  pull_request:
    paths:
      - "scripts/ui/NavalFendersV8.gd"
      - "assets/shaders/naval_contact_foam_v8.gdshader"
      - "scripts/ui/NavalBoardingDetailV7.gd"
      - "scripts/ui/NavalBaseBerthsV3.gd"
      - "scripts/ui/NavalMarineFinishV4.gd"
      - "assets/shaders/naval_marine_weathering_v4.gdshader"
      - "scripts/ui/CombinedArtStudioWeb.gd"
      - "tests/test_naval_base_v8_gpu.gd"
      - ".github/workflows/naval-base-v8-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naval-v8-native-render:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Import nine approved HQ sprites from main for Studio compatibility
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-android
          persist-credentials: false
      - name: Restore referenced approved art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/buildings/hq_v15
          for i in {0..7}; do
            test -s "source-android/assets/buildings/hq_v15/hq_${i}.png"
            cp "source-android/assets/buildings/hq_v15/hq_${i}.png" assets/buildings/hq_v15/
          done
          test -s source-android/assets/buildings/hq_v15/hq_neutral.png
          cp source-android/assets/buildings/hq_v15/hq_neutral.png assets/buildings/hq_v15/
          rm -rf source-android
      - name: Install native Godot 4.3 and import project
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/naval-v8-godot.zip
          unzip -q /tmp/naval-v8-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          timeout --signal=TERM --kill-after=5s 120s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/naval-v8-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Import failed' /tmp/naval-v8-import.log; then
            echo "Naval V8 Godot import failed" >&2; exit 1
          fi
      - name: Verify real geometry and Studio camera screenshots in OpenGL
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_naval_base_v8_gpu.gd 2>&1 | tee /tmp/naval-v8-gpu.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/naval-v8-gpu.log; then
            echo "Naval V8 native geometry acceptance failed" >&2; exit 1
          fi
          grep -q "PASS NAVAL BASE V8:" /tmp/naval-v8-gpu.log
          for name in overview fenders_close quay_water tactical_far night_fenders compare_v7 shipyard_level3 critical_damage; do
            test -s "artifacts/tarvoka_naval_v8_${name}.png"
          done
      - name: Publish eight Godot screenshots
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-Naval-Base-V8-8-Godot-Captures
          retention-days: 30
          if-no-files-found: error
          path: artifacts/tarvoka_naval_v8_*.png
