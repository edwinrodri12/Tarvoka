name: TARVOKA v366 intermediate opening budgets 3-4-5-unlimited (128 battles)

on:
  pull_request:
    paths:
      - "tests/test_ai_opening_budget_v366.gd"
      - "tests/test_ai_opening_budget_contract_v366.gd"
      - "tests/aggregate_ai_opening_budget_v366.py"
      - ".github/workflows/ai-opening-budgets-v366.yml"
  workflow_dispatch:

jobs:
  self_mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10,12]
        map: [0,2]
        fog: ["false","true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Execute sixteen real self-play games with first-action budgets
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_opening_budget_v366.gd \
            2>&1 | tee /tmp/ai-v366-opening.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v366-opening.log; then exit 1; fi
          grep -Fq 'PASS AI opening v366:' /tmp/ai-v366-opening.log
          test "$(grep -c '^OPEN366_MATCH ' /tmp/ai-v366-opening.log)" -eq 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v366-cap-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/ai-v366-opening.log
          if-no-files-found: ignore
          retention-days: 30

  opening_budget_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Validate engine cap3 and trial-only 4/5 order budgets, save parity
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_opening_budget_contract_v366.gd \
            2>&1 | tee /tmp/ai-v366-contract.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v366-contract.log; then exit 1; fi
          grep -Fq 'PASS AI opening v366 contract:' /tmp/ai-v366-contract.log
          test "$(grep -c '^OPEN366_CONTRACT ' /tmp/ai-v366-contract.log)" -eq 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v366-contract
          path: /tmp/ai-v366-contract.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [self_mirrors, opening_budget_contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v366-cap-L*
          path: .ci-v366-logs
          merge-multiple: false
      - name: Verify 128 actual games and reproduce cap3 and unlimited baselines
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_opening_budget_v366.py .ci-v366-logs
          cat reports/ai_v366_opening_budgets.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v366-opening-budgets-report
          path: reports/ai_v366_opening_budgets.*
          if-no-files-found: ignore
          retention-days: 30
