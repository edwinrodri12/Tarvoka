name: TARVOKA engineer repair balance regression

on:
  pull_request:
    paths:
      - 'scripts/core/EngineerRepair.gd'
      - 'scripts/core/BattleSession.gd'
      - 'scripts/core/BasicAI.gd'
      - 'scripts/ui/TouchBoard.gd'
      - 'scripts/ui/Main.gd'
      - 'tests/test_engineer_repair.gd'
      - 'tests/test_engineer_repair_ui.gd'
      - 'tests/test_paired_balance_telemetry.gd'
      - 'tests/test_modern_coastal_self_play.gd'
      - 'tests/test_modern_mirror_decisions.gd'
      - '.github/workflows/engineer-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/core/EngineerRepair.gd'
      - 'scripts/core/BattleSession.gd'
      - 'scripts/core/BasicAI.gd'
      - 'scripts/ui/TouchBoard.gd'
      - 'scripts/ui/Main.gd'
      - 'tests/test_engineer_repair.gd'
      - 'tests/test_engineer_repair_ui.gd'
      - 'tests/test_paired_balance_telemetry.gd'
      - 'tests/test_modern_coastal_self_play.gd'
      - 'tests/test_modern_mirror_decisions.gd'
      - '.github/workflows/engineer-repair.yml'
  workflow_dispatch:

jobs:
  engineer-repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify engineer real repair and economic balance
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_engineer_repair.gd 2>&1 \
            | tee /tmp/engineer-repair.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/engineer-repair.log; then exit 1; fi
          grep -F 'PASS engineer repair:' /tmp/engineer-repair.log
      - name: Verify Android landscape repair UI and actual paid target selection
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_engineer_repair_ui.gd 2>&1 \
            | tee /tmp/engineer-repair-ui.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/engineer-repair-ui.log; then exit 1; fi
          grep -F 'PASS engineer repair UI:' /tmp/engineer-repair-ui.log
      - name: Regress full modern economy, coastal combat and mirrored AI decisions
        run: |
          set -euo pipefail
          for test in test_paired_balance_telemetry test_modern_coastal_self_play test_modern_mirror_decisions; do
            timeout --signal=TERM --kill-after=5s 150s \
              /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
              --script "res://tests/${test}.gd" 2>&1 \
              | tee "/tmp/${test}.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' "/tmp/${test}.log"; then exit 1; fi
            grep -F 'PASS ' "/tmp/${test}.log"
          done
      - name: Upload repro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-engineer-repair-QA
          path: |
            /tmp/engineer-repair.log
            /tmp/engineer-repair-ui.log
            /tmp/test_paired_balance_telemetry.log
            /tmp/test_modern_coastal_self_play.log
            /tmp/test_modern_mirror_decisions.log
          if-no-files-found: warn
