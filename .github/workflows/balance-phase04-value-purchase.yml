name: TARVOKA balance phase 04 role value and AI purchase bias

on:
  pull_request:
    paths:
      - "tests/test_balance_phase04_value_purchase.gd"
      - "docs/BALANCE_PHASE04_VALUE_PURCHASE_20261115.md"
      - ".github/workflows/balance-phase04-value-purchase.yml"
  workflow_dispatch:

jobs:
  value_audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Diagnose 32 role prices, mirrored AI buys and real counterplay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 210s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --quit-after 5 --path . \
            --script res://tests/test_balance_phase04_value_purchase.gd \
            2>&1 | tee /tmp/tarvoka-balance-phase04.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-balance-phase04.log; then
            echo 'Balance role-value study failed'; exit 1
          fi
          grep -Fq 'PASS phase04 purchase-bias and counterplay:' /tmp/tarvoka-balance-phase04.log
