name: TARVOKA v370 first responder income on-off audit (256 real battles)

on:
  pull_request:
    paths:
      - "tests/test_ai_responder_income_v370.gd"
      - "tests/test_ai_first_income_contract_v370.gd"
      - "tests/FirstReplyIncomeV370.gd"
      - "tests/aggregate_ai_first_income_v370.py"
      - ".github/workflows/ai-first-income-v370.yml"
  workflow_dispatch:

jobs:
  self_mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        level: [10,12]
        map: [0,1,2,3]
        fog: ["false","true"]
    env:
      TARVOKA_AB_LEVEL: ${{ matrix.level }}
      TARVOKA_AB_MAP: ${{ matrix.map }}
      TARVOKA_AB_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Run sixteen self-play matches with first responder city income retained or suppressed
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_responder_income_v370.gd \
            2>&1 | tee /tmp/ai-v370-income.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v370-income.log; then exit 1; fi
          grep -Fq 'PASS AI income v370:' /tmp/ai-v370-income.log
          test "$(grep -c '^INCOME370_MATCH ' /tmp/ai-v370-income.log)" -eq 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v370-income-L${{ matrix.level }}-map${{ matrix.map }}-fog${{ matrix.fog }}
          path: /tmp/ai-v370-income.log
          if-no-files-found: ignore
          retention-days: 30

  opening_budget_contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Verify 32 real first responder handoffs, single payout removed and later income restored
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_first_income_contract_v370.gd \
            2>&1 | tee /tmp/ai-v370-contract.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/ai-v370-contract.log; then exit 1; fi
          grep -Fq 'PASS AI income v370 contract:' /tmp/ai-v370-contract.log
          test "$(grep -c '^INCOME370_CONTRACT ' /tmp/ai-v370-contract.log)" -eq 32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v370-contract
          path: /tmp/ai-v370-contract.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [self_mirrors, opening_budget_contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v370-income-L*
          path: .ci-v370-logs
          merge-multiple: false
      - name: Aggregate 256 real games, 128 income-matched pairs, first3 parity and cap3/cap4
        run: |
          set -euo pipefail
          python3 tests/aggregate_ai_first_income_v370.py .ci-v370-logs
          cat reports/ai_v370_first_income.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v370-first-income-report
          path: reports/ai_v370_first_income.*
          if-no-files-found: ignore
          retention-days: 30
