name: TARVOKA real production slot opening investment A/B v1.5

on:
  pull_request:
    paths:
      - "tests/test_tier_investment_openings_v15.gd"
      - ".github/workflows/tier-investment-openings-v15.yml"
      - "scripts/experiments/BuildingProgressionV12.gd"
  workflow_dispatch:

jobs:
  compare_openings:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compare mirrored actual 5-phase production and technology purchases
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 480s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_tier_investment_openings_v15.gd \
            2>&1 | tee /tmp/tarvoka-tier-investment-v15.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-tier-investment-v15.log; then exit 1; fi
          grep -Fq 'PASS tier investment openings v15:' /tmp/tarvoka-tier-investment-v15.log
      - name: Archive matchup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-tier-investment-v15
          path: /tmp/tarvoka-tier-investment-v15.log
          retention-days: 30
          if-no-files-found: ignore
