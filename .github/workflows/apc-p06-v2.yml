name: TARVOKA APC P06 V2 Commercial Geometry and Mobile Batching QA
on:
  push:
    branches:
      - feat/apc-p06-v2-armored-finish-20261114
    paths:
      - "scripts/ui/APC*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/UnitArtStudioWeb.gd"
      - "tests/test_apc_p06_art_v2.gd"
      - "tests/export_apc_p06_v2_glb.gd"
      - ".github/workflows/apc-p06-v2.yml"
  pull_request:
    paths:
      - "scripts/ui/APC*.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/UnitArtStudioWeb.gd"
      - "tests/test_apc_p06_art_v2.gd"
      - "tests/export_apc_p06_v2_glb.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apc-v2-art-mobile-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native Godot 4.3 OpenGL 3 software display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libxrandr2 > /dev/null
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Import and parse full project without Godot script errors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/apc-v2-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Cannot infer the type' /tmp/apc-v2-import.log; then exit 1; fi
      - name: "Real APC P06 V2 geometry and render - tires, PBR, 8 factions, troop bay"
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 165s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/test_apc_p06_art_v2.gd 2>&1 | tee /tmp/apc-v2-native.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/apc-v2-native.log; then exit 1; fi
          grep -q 'PASS APC P06 V2:' /tmp/apc-v2-native.log
          for path in \
            artifacts/tarvoka_apc_p06_v2_frontal_tres_cuartos.png \
            artifacts/tarvoka_apc_p06_v2_lateral_ruedas.png \
            artifacts/tarvoka_apc_p06_v2_detalle_neumaticos.png \
            artifacts/tarvoka_apc_p06_v2_rampa_cerrada.png \
            artifacts/tarvoka_apc_p06_v2_rampa_abierta.png \
            artifacts/tarvoka_apc_p06_v1_comparativa.png; do
            test -s "$path"
          done
      - name: Export editable V2 GLB with all 288 real tread lugs
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/export_apc_p06_v2_glb.gd 2>&1 | tee /tmp/apc-v2-editable.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/apc-v2-editable.log; then exit 1; fi
          grep -q 'PASS APC P06 V2 GLB:' /tmp/apc-v2-editable.log
          test -s artifacts/TARVOKA_APC_P06_V2_Editable.glb
      - name: Regression — original six-wheel model and final G09 V32
        shell: bash
        run: |
          set -euo pipefail
          for test in test_apc_p06_art_v1 test_g09_animation_final_v32; do
            timeout --signal=TERM --kill-after=5s 165s xvfb-run -a -s "-screen 0 1280x800x24" \
              /tmp/Godot_v4.3-stable_linux.x86_64 --path . \
              --rendering-driver opengl3 --audio-driver Dummy \
              --script "res://tests/${test}.gd" 2>&1 | tee "/tmp/${test}.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' "/tmp/${test}.log"; then exit 1; fi
            grep -q 'PASS' "/tmp/${test}.log"
          done
      - name: Archive authentic Godot APC V1-V2 comparison renders
        uses: actions/upload-artifact@v4
        with:
          name: TARVOKA-APC-P06-V2-Real-Mesh-Comparison
          path: |
            artifacts/tarvoka_apc_p06_v2_*.png
            artifacts/tarvoka_apc_p06_v1_comparativa.png
            artifacts/TARVOKA_APC_P06_V2_Editable.glb
          if-no-files-found: error
