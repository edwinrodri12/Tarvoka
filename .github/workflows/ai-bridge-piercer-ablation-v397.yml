name: TARVOKA v397 paid Piercer body ablation

on:
  pull_request:
    paths:
      - "tests/test_ai_opening_budget_counterfactual_v383.gd"
      - "tests/test_ai_bridge_piercer_ablation_v397.gd"
      - "tests/aggregate_ai_bridge_piercer_ablation_v397.py"
      - ".github/workflows/ai-bridge-piercer-ablation-v397.yml"
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-22.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        seed_index: [0,1,2]
    env:
      TARVOKA_V397_SEED_INDEX: ${{ matrix.seed_index }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test identical 300-credit purchase with and without the Piercer unit in the game state
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 2650s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_ai_bridge_piercer_ablation_v397.gd \
            2>&1 | tee /tmp/ablation-v397.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:|ABL397_MIRROR_ERROR' /tmp/ablation-v397.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v397: Piercer body ablation isolated' /tmp/ablation-v397.log
          test "$(grep -c '^ABL397_RESULT ' /tmp/ablation-v397.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v397-seed${{ matrix.seed_index }}
          path: /tmp/ablation-v397.log
          retention-days: 30
          if-no-files-found: ignore

  aggregate:
    needs: [ablation]
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v397-seed*
          path: .ci-v397-logs
      - name: Aggregate six paired experiments and payment invariants
        run: |
          set -euo pipefail
          python3 -m py_compile tests/aggregate_ai_bridge_piercer_ablation_v397.py
          python3 tests/aggregate_ai_bridge_piercer_ablation_v397.py .ci-v397-logs
          cat reports/ai_v397_piercer_ablation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v397-paid-piercer-ablation-report
          path: reports/ai_v397_piercer_ablation.*
          retention-days: 30
          if-no-files-found: ignore
