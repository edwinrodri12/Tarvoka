name: TEMP CommandMenu parser diagnostic
on:
  push:
    branches: [ui/command-center-commercial-v11]
  workflow_dispatch:
jobs:
  parse-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot43.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -oq /tmp/godot43.zip -d /tmp/
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Parse CommandMenu directly
        shell: bash
        run: |
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/ui/CommandMenu.gd 2>&1 | tee /tmp/command_parse.log || true
          echo "--- SCRIPT DIAGNOSTICS ---"
          cat /tmp/command_parse.log
      - name: Parse project in editor
        shell: bash
        run: |
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/editor_parse.log || true
          echo "--- EDITOR PARSER ---"
          grep -Ei 'CommandMenu|Parser Error|SCRIPT ERROR|ERROR:' /tmp/editor_parse.log || true
