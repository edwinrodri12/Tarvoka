        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_economic_ai.gd

      - name: Validate urban economy touchscreen controls and persistence
