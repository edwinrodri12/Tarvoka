name: Godot 4 headless rules
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3 binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Validate visual faction identity and harmless board styling
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_visual_style.gd

      - name: Run GDScript rules tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_rules.gd

      - name: Validate city capture messages and fog-safe building inspection
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_economy_capture_feedback.gd

      - name: Run 24 economy AI battles across maps fog initiative and symmetric-training presets
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/test_economy_self_play.gd

      - name: Validate AI city capture and one-per-workshop recruitment
