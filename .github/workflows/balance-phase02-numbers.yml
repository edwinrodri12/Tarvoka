name: TARVOKA balance phase 02 numeric audit

on:
  pull_request:
    paths:
      - "tests/test_balance_phase02_numbers.gd"
      - "docs/BALANCE_PHASE02_NUMBERS_20261115.md"
      - ".github/workflows/balance-phase02-numbers.yml"
  workflow_dispatch:

jobs:
  number_audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Audit unit combat, weather mobility, city economy and AI openings
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=8s 420s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_balance_phase02_numbers.gd \
            2>&1 | tee /tmp/tarvoka-balance02.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-balance02.log; then
            echo 'Numeric balance audit failed'; exit 1
          fi
          grep -Fq 'PASS balance phase 02:' /tmp/tarvoka-balance02.log
