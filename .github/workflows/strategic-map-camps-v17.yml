name: TARVOKA fixed recruit bases and specialist-built camps v1.7

on:
  pull_request:
    paths:
      - "scripts/experiments/StrategicMapSitesV17.gd"
      - "scripts/experiments/SpecialistCampsV17.gd"
      - "tests/test_fixed_producer_sites_v17.gd"
      - "tests/test_specialist_camps_v17.gd"
      - ".github/workflows/strategic-map-camps-v17.yml"
  workflow_dispatch:

jobs:
  fixed_city_and_factory_map:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Test 12 size/terrain maps with neutral capturable production bases
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_fixed_producer_sites_v17.gd \
            2>&1 | tee /tmp/tarvoka-fixed-sites-v17.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-fixed-sites-v17.log; then exit 1; fi
          grep -Fq 'PASS fixed producer sites v17:' /tmp/tarvoka-fixed-sites-v17.log
      - name: Archive map site checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-fixed-sites-v17
          path: /tmp/tarvoka-fixed-sites-v17.log
          retention-days: 30
          if-no-files-found: ignore

  exclusive_infantry_camps:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Reject player-built producers and wrong infantry specialties
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_specialist_camps_v17.gd \
            2>&1 | tee /tmp/tarvoka-specialist-camps-v17.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/tarvoka-specialist-camps-v17.log; then exit 1; fi
          grep -Fq 'PASS specialist camps v17:' /tmp/tarvoka-specialist-camps-v17.log
      - name: Archive camp restrictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-specialist-camps-v17
          path: /tmp/tarvoka-specialist-camps-v17.log
          retention-days: 30
          if-no-files-found: ignore
