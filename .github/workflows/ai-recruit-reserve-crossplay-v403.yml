name: TARVOKA v403 early economic reserve cross-play

on:
  pull_request:
    paths:
      - "scripts/core/BasicAI.gd"
      - "scripts/core/RecruitReserveV403.gd"
      - "tests/test_ai_recruit_reserve_micro_v403.gd"
      - "tests/test_ai_recruit_reserve_crossplay_v403.gd"
      - "tests/aggregate_ai_recruit_reserve_v403.py"
      - ".github/workflows/ai-recruit-reserve-crossplay-v403.yml"
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3 stable
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Check actual 650-credit SPG, budget from city income, threat exemption, default OFF and exact mirrors
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 180 \
            --script res://tests/test_ai_recruit_reserve_micro_v403.gd \
            2>&1 | tee /tmp/reserve-v403-micro.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:' /tmp/reserve-v403-micro.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v403 micro:' /tmp/reserve-v403-micro.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v403-micro-diagnostic
          path: /tmp/reserve-v403-micro.log
          retention-days: 30
          if-no-files-found: ignore

  crossplay:
    needs: [micro]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed_index: [0,1,2,3,4,5,6,7]
        fog: ["false","true"]
    env:
      TARVOKA_V403_SEED_INDEX: ${{ matrix.seed_index }}
      TARVOKA_V403_FOG: ${{ matrix.fog }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3 stable
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Real direct v403-v400 and v403-official matches, faction/start swaps and exact mirrors
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3480s \
            /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 180 \
            --script res://tests/test_ai_recruit_reserve_crossplay_v403.gd \
            2>&1 | tee /tmp/reserve-v403-crossplay.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed|Parse Error:|RESERVE403_MIRROR_FAILURE' /tmp/reserve-v403-crossplay.log; then exit 1; fi
          grep -Fq 'PASS TARVOKA v403: 8 original games' /tmp/reserve-v403-crossplay.log
          test "$(grep -c '^RESERVE403_RESULT ' /tmp/reserve-v403-crossplay.log)" -eq 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v403-seed${{ matrix.seed_index }}-fog${{ matrix.fog }}
          path: /tmp/reserve-v403-crossplay.log
          retention-days: 30
          if-no-files-found: ignore

  aggregate:
    needs: [crossplay]
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-v403-seed*
          path: .ci-v403-logs
      - name: Validate all 128 original battles and real outcomes against both rivals
        run: |
          set -euo pipefail
          python3 -m py_compile tests/aggregate_ai_recruit_reserve_v403.py
          python3 tests/aggregate_ai_recruit_reserve_v403.py .ci-v403-logs
          cat reports/ai_v403_recruitment_reserve.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v403-direct-head-to-head-report
          path: reports/ai_v403_recruitment_reserve.*
          retention-days: 30
          if-no-files-found: ignore
