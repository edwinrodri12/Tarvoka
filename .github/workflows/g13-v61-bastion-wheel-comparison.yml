name: TARVOKA G13 V61 real open wheel spokes versus Bastion P06

on:
  push:
    branches: [main]
    paths:
      - "scripts/ui/G13ExteriorMicrofinishV55.gd"
      - "scripts/ui/G13MechanicalJointFinishV56.gd"
      - "scripts/ui/G13TacticalMountReadabilityV57.gd"
      - "scripts/ui/G13IsometricMechanicalFinishV58.gd"
      - "scripts/ui/G13PremiumSurfaceV59.gd"
      - "scripts/ui/G13ContinuousTreadV60.gd"
      - "scripts/ui/G13ProductionWheelArmorV61.gd"
      - "scripts/ui/G13OpticalGlazingV62.gd"
      - "scripts/ui/G13FactionReadabilityV63.gd"
      - "scripts/ui/G13RubberSculptV54.gd"
      - "scripts/ui/G13MaterialRealismV53.gd"
      - "scripts/ui/G13InspectionStudio.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "tests/test_g13_v61_open_hub_armor.gd"
      - "tests/test_g13_v53_material_realism.gd"
      - "tests/test_g13_v61_real_bastion_comparison.gd"
      - "tests/test_g13_v62_optical_glazing.gd"
      - "tests/test_g13_v63_faction_readability.gd"
      - ".github/workflows/g13-v61-bastion-wheel-comparison.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ui/G13ProductionWheelArmorV61.gd"
      - "scripts/ui/G13OpticalGlazingV62.gd"
      - "scripts/ui/G13FactionReadabilityV63.gd"
      - "scripts/ui/UnitModels3D.gd"
      - "scripts/ui/BastionStudioAdapter.gd"
      - "tests/test_g13_v62_optical_glazing.gd"
      - "tests/test_g13_v63_faction_readability.gd"
      - ".github/workflows/g13-v61-bastion-wheel-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g13-v61-native-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-real-g13:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Use newest source for native Godot unit and materials
        uses: actions/checkout@v4
      - name: Install Godot 4.3 and software GL inspection display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri unzip
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Exclude published-only shared Studio subclass from standalone G13 audit
        shell: bash
        run: |
          set -euo pipefail
          # Main deliberately does not hold CombinedArtStudioWeb.gd, which
          # is assembled from separately signed-off branches on publication.
          # This test renders the G13InspectionStudio native scene instead.
          if test ! -f scripts/ui/CombinedArtStudioWeb.gd && test -f scripts/ui/BastionStudioAdapter.gd; then
            mkdir -p /tmp/g13-v61-published-studio
            mv scripts/ui/BastionStudioAdapter.gd /tmp/g13-v61-published-studio/
          fi
      - name: Import all real native 3D G13 resources
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee /tmp/g13-v61-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Import failed' /tmp/g13-v61-import.log; then
            exit 1
          fi
      - name: Verify real open G13 V61 wheel spokes versus six-spoke P06 Bastion wheel
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility \
            --audio-driver Dummy --path . --script res://tests/test_g13_v61_open_hub_armor.gd \
            2>&1 | tee /tmp/g13-v61-open-hubs.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/g13-v61-open-hubs.log; then
            exit 1
          fi
          grep -F 'PASS G13 V61 BASTION WHEEL AND PBR:' /tmp/g13-v61-open-hubs.log
      - name: Verify V62 real optical glazing in all faction and Android variants
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility \
            --audio-driver Dummy --path . --script res://tests/test_g13_v62_optical_glazing.gd \
            2>&1 | tee /tmp/g13-v62-optical-glazing.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/g13-v62-optical-glazing.log; then
            exit 1
          fi
          grep -F 'PASS G13 V62 OPTICAL GLAZING:' /tmp/g13-v62-optical-glazing.log
      - name: Verify G13 V63 native faction paint and real 3D armor badge seating
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility \
            --audio-driver Dummy --path . --script res://tests/test_g13_v63_faction_readability.gd \
            2>&1 | tee /tmp/g13-v63-faction-visual.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/g13-v63-faction-visual.log; then
            exit 1
          fi
          grep -F 'PASS G13 V63 FACTION READABILITY:' /tmp/g13-v63-faction-visual.log
      - name: Capture 9 true Godot P06 Bastion and G13 same-light iso and wheel-macro frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/g13-v61
          timeout 240s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility \
            --audio-driver Dummy --path . --script res://tests/test_g13_v61_real_bastion_comparison.gd \
            2>&1 | tee /tmp/g13-v61-native-capture.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:|Assertion failed' /tmp/g13-v61-native-capture.log; then
            exit 1
          fi
          grep -F 'PASS G13 V61 REAL P06 BASTION MATCHED LIGHT:' /tmp/g13-v61-native-capture.log
          test "$(find build/qa/g13-v61 -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Upload 9 authentic G13 V61 and P06 Bastion identical-light wheel snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarvoka-g13-v61-bastion-matched-wheel-and-armor
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/qa/g13-v61/*.png
            build/qa/g13-v61/g13-v61-bastion-comparison.json
